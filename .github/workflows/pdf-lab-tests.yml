name: PDF Lab worker tests

on:
  push:
    paths:
      - "pdf-lab/worker/**"
      - ".github/workflows/pdf-lab-tests.yml"
  pull_request:
    paths:
      - "pdf-lab/worker/**"
      - ".github/workflows/pdf-lab-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf-lab/worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pdf-lab/worker/requirements.txt
      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile worker
        run: python -m py_compile app.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
