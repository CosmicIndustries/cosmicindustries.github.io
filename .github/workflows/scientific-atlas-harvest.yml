name: Scientific Atlas Harvest

on:
  push:
    paths:
      - "scientific-atlas/harvest/**"
      - "scientific-atlas/schema/harvest-record.schema.json"
      - ".github/workflows/scientific-atlas-harvest.yml"
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scientific-atlas-harvest
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harvest authoritative catalogs
        run: python scientific-atlas/harvest/harvest.py

      - name: Show harvest report
        run: cat scientific-atlas/catalog/harvest-report.json

      - name: Commit harvested catalog
        run: |
          git config user.name "fort-knowledge-harvest[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scientific-atlas/catalog/
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "Refresh Scientific Atlas harvested catalog"
            git push
          fi
