<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RouteOps Work Board</title>
<style>
:root{color-scheme:dark;background:#111827;color:#f8fafc;font-family:Arial,Helvetica,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#1f2937,#111827 45%,#0f172a)}.box{max-width:720px;margin:24px;padding:22px;border:1px solid rgba(148,163,184,.22);border-radius:16px;background:#1f2937;box-shadow:0 8px 22px rgba(0,0,0,.24)}h1{margin:0 0 8px;font-size:28px}.muted{color:#cbd5e1;line-height:1.45}.err{margin-top:14px;color:#fecaca;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.btn{display:inline-block;margin-top:14px;padding:10px 13px;border-radius:10px;background:#d97706;color:#111827;font-weight:900;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<h1>Loading RouteOps Work Board…</h1>
<p class="muted">Applying the Drive Mode archive-scroll update.</p>
<div id="err" class="err"></div>
</div>
<script>
(async()=>{
  const base="https://raw.githubusercontent.com/CosmicIndustries/cosmicindustries.github.io/d8eff36dd1f95cede8d36e624296d7aba83ed4c7/routeops/index.html";
  const replacements=[
    ["<button class=\"btn btn-success\" onclick=\"archiveStop('${s.id}')\">Archive Finished Job</button>","<button id=\"archiveButton\" class=\"btn btn-success\" onclick=\"archiveStop('${s.id}')\">Archive Finished Job</button>"],
    ["${isArchived?'<div style=\"margin-top:10px\"><span class=\"pill pickup\">Archived to ledger</span></div>':allDone?'<div style=\"margin-top:10px\"><span class=\"pill pickup\">Ready to archive</span></div>':\"\"}</section>","${isArchived?'<div style=\"margin-top:10px\"><span class=\"pill pickup\">Archived to ledger</span></div>':allDone?'<div style=\"margin-top:10px\"><span class=\"pill pickup\">Ready to archive</span></div><div class=\"toolbar no-print\" style=\"margin-top:12px\"><button class=\"btn btn-success\" onclick=\"scrollToArchive()\">↓ Archive Finished Job</button></div>':\"\"}</section>"],
    ["onchange=\"updateItem('${s.id}','${it.id}',{done:this.checked});render()\"","onchange=\"updateItem('${s.id}','${it.id}',{done:this.checked});scrollToArchiveIfReady('${s.id}')\""],
    ["onchange=\"updateItem('${s.id}','${it.id}',{actual:this.value});render()\"","onchange=\"updateItem('${s.id}','${it.id}',{actual:this.value});scrollToArchiveIfReady('${s.id}')\""],
    ["onchange=\"updateItem('${s.id}','${it.id}',{condition:this.value});render()\"","onchange=\"updateItem('${s.id}','${it.id}',{condition:this.value});scrollToArchiveIfReady('${s.id}')\""],
    ["onchange=\"updateTask('${s.id}','${t.id}',{done:this.checked});render()\"","onchange=\"updateTask('${s.id}','${t.id}',{done:this.checked});scrollToArchiveIfReady('${s.id}')\""],
    ["<button class=\"btn\" onclick=\"markActualsExpected('${s.id}')\">Fill Counts</button>","<button class=\"btn\" onclick=\"markActualsExpected('${s.id}');scrollToArchiveIfReady('${s.id}')\">Fill Counts</button>"],
    ["function renderBottomGate(s,issues,isArchived){","function scrollToArchive(){const el=document.getElementById(\"archiveButton\")||document.getElementById(\"bottomGate\");if(!el)return;el.scrollIntoView({behavior:\"smooth\",block:\"center\"});setTimeout(()=>document.getElementById(\"archiveButton\")?.focus(),350)}\nfunction scrollToArchiveIfReady(stopId){if(tab!==\"Drive\")return;setTimeout(()=>{const s=state.find(x=>x.id===stopId);if(s&&!s.archivedAt&&stopIssues(s).length===0)scrollToArchive()},80)}\nfunction renderBottomGate(s,issues,isArchived){"],
    ["const s=state.find(x=>x.id===stopId);updateStop(stopId,{photos:[...rows,...s.photos]})}","const s=state.find(x=>x.id===stopId);updateStop(stopId,{photos:[...rows,...s.photos]});scrollToArchiveIfReady(stopId)}"]
  ];
  try{
    let html=await fetch(base,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.text()});
    for(const [from,to] of replacements){
      if(!html.includes(from)) throw new Error(`Patch anchor missing: ${from.slice(0,80)}`);
      html=html.replace(from,to);
    }
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById("err").textContent=`RouteOps failed to load or patch.\n${err?.message||err}`;
  }
})();
</script>
</body>
</html>
