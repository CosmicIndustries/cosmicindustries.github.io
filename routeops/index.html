function updateStop(id,patch){state.stops=state.stops.map(function(s){return s.id===id?stop(Object.assign({},s,patch)):s});save();render()}function findStop(id){return state.stops.find(function(s){return s.id===id})}function addStop(){var s=stop({name:'New Stop '+(state.stops.length+1)});state.stops.push(s);state.selectedId=s.id;save();render()}function addShop(){var s=stop({name:'Shop / Depot',isDepot:true,items:[]});state.stops.unshift(s);state.selectedId=s.id;save();render()}function removeStop(id){state.stops=state.stops.filter(function(s){return s.id!==id});state.selectedId=state.stops[0]&&state.stops[0].id;save();render()}function duplicateStop(id){var s=stop(copy(findStop(id)));s.id=uid();s.name=s.name+' Copy';s.archivedAt=null;state.stops.push(s);state.selectedId=s.id;save();render()}function addTask(id){var s=findStop(id);s.tasks.push(task('New task'));save();render()}function addItem(id){var s=findStop(id);s.items.push(item({dir:'dropoff',item:'Adult Bikes',qty:1}));save();render()}function fillCounts(id){var s=findStop(id);s.items.forEach(function(i){i.actual=i.actual||String(i.qty);i.done=true});save();render()}function archive(id){var s=findStop(id),iss=issues(s);if(iss.length){modal('<h2>Cannot archive yet</h2><ul>'+iss.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>');return}s.archivedAt=new Date().toISOString();state.ledger.unshift({name:s.name,archivedAt:s.archivedAt,items:copy(s.items)});save();render();toast('Archived '+s.name)}

function handleClick(e){var b=e.target.closest?e.target.closest('button,[data-action],[data-tab]'):null;if(!b)return;var a=b.getAttribute('data-action'),id=b.getAttribute('data-id');if(b.getAttribute('data-tab')){state.tab=b.getAttribute('data-tab');save();render();return}if(!a)return;if(a==='upload')$('fileInput').click();else if(a==='pasteJson')openPaste();else if(a==='schema')openSchema();else if(a==='buildRoute')buildRoute();else if(a==='addStop')addStop();else if(a==='addShop')addShop();else if(a==='tests')runTests();else if(a==='backup')downloadJSON();else if(a==='newDay'){state.stops=DEFAULT.stops.map(stop);state.inventory=[];state.routeOrder=[];state.selectedId=state.stops[0].id;state.tab='stops';save();render()}else if(a==='reset'){state=hydrate(DEFAULT);save();render()}else if(a==='select'){state.selectedId=id;save();render()}else if(a==='editFromRoute'){state.selectedId=id;state.tab='stops';save();render()}else if(a==='remove')removeStop(id);else if(a==='duplicate')duplicateStop(id);else if(a==='addTask')addTask(id);else if(a==='removeTask'){var s=findStop(id);s.tasks=s.tasks.filter(function(t){return t.id!==b.getAttribute('data-taskid')});save();render()}else if(a==='addItem')addItem(id);else if(a==='removeItem'){var st=findStop(id);st.items=st.items.filter(function(i){return i.id!==b.getAttribute('data-itemid')});save();render()}else if(a==='fillCounts')fillCounts(id);else if(a==='archive')archive(id);else if(a==='driveDone'){var ds=findStop(id),di=ds.items.find(function(i){return i.id===b.getAttribute('data-itemid')});di.done=true;di.actual=di.actual||String(di.qty);save();render()}else if(a==='driveBack'){state.driveIndex=Math.max(0,state.driveIndex-1);save();render()}else if(a==='driveNext'){var os=ordered(),s2=os[state.driveIndex],iss=issues(s2);if(iss.length){modal('<h2>Hard stop</h2><ul>'+iss.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>');return}if(!s2.archivedAt){toast('Archive this finished job first');return}state.driveIndex=M 10 16\nSlipcovers Hodnett Cooper 37 10\nLoungers 37 7\nBeach Club #127\nOrder 596730\nCustomer Dana Habershaw\nPickup & Load\n4 Slipcovers Hodnett Cooper\nBeach Club #130\nOrder 603694\nCustomer Jennifer Rewczuk\nUnload & Delivery\n2 Loungers';ocr.text=txt;ocr.parsed=parseRouteOpsText(txt);ocr.status='OCR parser test: '+(ocr.parsed.stops.length===2&&ocr.parsed.inventory_summary.length===3?'PASS':'FAIL');ocr.progress=100;state.tab='ocr';render();}}
function handleChange(e){var el=e.target;if(el.id==='fileInput'){handleFile(el.files[0]).catch(function(err){modal('<h2>Import failed</h2><p>'+esc(err.message)+'</p>')}).finally(function(){el.value=''})}else if(el.id==='ocrImageInput'){ocr.files=[].slice.call(el.files||[]);ocr.status='Selected '+ocr.files.length+' page image(s).';ocr.progress=0;state.tab='ocr';save();render();el.value=''}else if(el.hasAttribute('data-edit')){var p={};p[el.getAttribute('data-edit')]=el.value;updateStop(el.getAttribute('data-id'),p)}else if(el.hasAttribute('data-task')){var s=findStop(el.getAttribute('data-id')),tid=el.getAttribute('data-taskid'),field=el.getAttribute('data-task');s.tasks=s.tasks.map(function(t){if(t.id===tid)t[field]=field==='done'?el.checked:el.value;return t});save();render()}else if(el.hasAttribute('data-item')){var st=findStop(el.getAttribute('data-id')),iid=el.getAttribute('data-itemid'),f=el.getAttribute('data-item');st.items=st.items.map(function(it){if(it.id===iid){it[f]=f==='done'?el.checked:(f==='qty'?num(el.value,1):el.value);if(f==='item')it.item=gear(it.item)}return it});save();render()}else if(el.hasAttribute('data-driveactual')){var ss=findStop(el.getAttribute('data-id')),ii=ss.items.find(function(x){return x.id===el.getAttribute('data-driveactual')});ii.actual=el.value;save();render()}}
function openBulk(id){modal('<h2>Bulk Gear</h2><p class="muted">One per line: pickup Adult Bikes 2</p><textarea id="bulkBox" class="input mono"></textarea><button class="btn success" id="bulkApply">Apply</button>');setTimeout(function(){$('bulkApply').onclick=function(){var s=findStop(id);$('bulkBox').value.split(/\n+/).map(clean).filter(Boolean).forEach(function(line){var p=line.split(/\s+/),q=num(p[p.length-1],1),d=p[0],it=p.slice(1,-1).join(' '),ni=item({dir:d,item:it,qty:q});if(ni)s.items.push(ni)});closeModal();save();render()}},0)}function openPhotos(id){var input=document.createElement('input');input.type='file';input.accept='image/*';input.multiple=true;input.onchange=function(){addPhotos(id,input.files)};input.click()}async function addPhotos(id,files){var s=findStop(id);for(var i=0;i<files.length;i++){var data=await resizeImage(files[i]).catch(function(){return null});s.photos.push({name:files[i].name,time:new Date().toISOString(),dataUrl:data})}save();render()}function resizeImage(file){return new Promise(function(res,rej){var reader=new FileReader();reader.onload=function(){var img=new Image();img.onload=function(){var max=900,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};img.onerror=rej;img.src=reader.result};reader.onerror=rej;reader.readAsDataURL(file)})}
