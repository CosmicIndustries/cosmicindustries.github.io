function render(){if(!state.selectedId&&state.stops[0])state.selectedId=state.stops[0].id;$('stats').innerHTML=statsHTML();var t=state.activeTab||'stops';document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===t)});$('app').innerHTML=t==='stops'?renderStops():t==='route'?renderRoute():t==='load'?renderLoad():t==='drive'?renderDrive():t==='ledger'?renderLedger():renderStops()}
function renderStops(){var sel=state.stops.find(function(s){return s.id===state.selectedId})||state.stops[0];return'<div class="grid"><section><div class="card"><div class="row"><button class="btn pri" data-action="quickAdd">Quick Add</button><button class="btn" data-action="addStop">+ Stop</button></div></div><div class="list">'+state.stops.map(function(s,i){var iss=issues(s),cls=s.id===state.selectedId?' sel':'';return'<div class="card stop'+cls+'" data-action="select" data-id="'+s.id+'"><b>'+(i+1)+'. '+esc(s.name)+'</b><p class="mut">'+esc(s.customer_name)+' '+(s.order_id?'· '+esc(s.order_id):'')+'</p><div>'+s.items.map(function(it){return'<span class="pill '+(it.dir==='pickup'?'pu':'do')+'">'+it.dir+' '+it.qty+' '+esc(it.item)+'</span>'}).join('')+'</div><p class="dim">'+(s.archivedAt?'Archived':iss.length?iss.length+' blockers':'Ready')+'</p><div class="row"><button class="btn sm" data-action="duplicate" data-id="'+s.id+'">Duplicate</button><button class="btn sm bad" data-action="remove" data-id="'+s.id+'">Remove</button></div></div>'}).join('')+'</div></section><section>'+(sel?renderEditor(sel):'<div class="card">No stop</div>')+'</section></div>'}
function renderEditor(s){return'<div class="card"><h2>'+esc(s.name)+'</h2><div class="grid2"><label>Name<input class="inp" data-edit="name" data-id="'+s.id+'" value="'+esc(s.name)+'"></label><label>Order ID<input class="inp" data-edit="order_id" data-id="'+s.id+'" value="'+esc(s.order_id)+'"></label><label>Customer<input class="inp" data-edit="customer_name" data-id="'+s.id+'" value="'+esc(s.customer_name)+'"></label><label>Phone<input class="inp" data-edit="customer_phone" data-id="'+s.id+'" value="'+esc(s.customer_phone)+'"></label><label>Time<input class="inp" data-edit="scheduled_time" data-id="'+s.id+'" value="'+esc(s.scheduled_time)+'"></label><label>Address<input class="inp" data-edit="address" data-id="'+s.id+'" value="'+esc(s.address)+'"></label></div><label>Notes<textarea class="inp" data-edit="notes" data-id="'+s.id+'">'+esc(s.notes)+'</textarea></label></div><div class="card"><div class="row"><h3>Tasks</h3><button class="btn sm" data-action="addTask" data-id="'+s.id+'">+ Task</button></div>'+s.tasks.map(function(t){return'<div class="taskRow"><input type="checkbox" data-task="done" data-id="'+s.id+'" data-taskid="'+t.id+'" '+(t.done?'checked':'')+'><input class="inp" data-task="text" data-id="'+s.id+'" data-taskid="'+t.id+'" value="'+esc(t.text)+'"><button class="btn sm bad" data-action="removeTask" data-id="'+s.id+'" data-taskid="'+t.id+'">×</button></div>'}).join('')+'</div><div class="card"><div class="row"><h3>Gear</h3><button class="btn sm" data-action="addItem" data-id="'+s.id+'">+ Gear</button><button class="btn sm" data-action="bulkGear" data-id="'+s.id+'">Bulk</button><button class="btn sm" data-action="fillCounts" data-id="'+s.id+'">Fill Counts</button></div>'+s.items.map(function(it){return'<div class="itemRow"><select class="inp" data-item="dir" data-id="'+s.id+'" data-itemid="'+it.id+'"><option '+(it.dir==='pickup'?'selected':'')+'>pickup</option><option '+(it.dir==='dropoff'?'selected':'')+'>dropoff</option></select><select class="inp" data-item="item" data-id="'+s.id+'" data-itemid="'+it.id+'">'+GEAR.map(function(g){return'<option '+(g===it.item?'selected':'')+'>'+esc(g)+'</option>'}).join('')+'</select><input class="inp" type="number" data-item="qty" data-id="'+s.id+'" data-itemid="'+it.id+'" value="'+esc(it.qty)+'"><input class="inp" type="number" data-item="actual" data-id="'+s.id+'" data-itemid="'+it.id+'" placeholder="actual" value="'+esc(it.actual)+'"><select class="inp" data-item="condition" data-id="'+s.id+'" data-itemid="'+it.id+'">'+['OK','Dirty','Wet','Damaged','Missing','Needs Manager'].map(function(c){return'<option '+(c===it.condition?'selected':'')+'>'+c+'</option>'}).join('')+'</select><button class="btn sm bad" data-action="removeItem" data-id="'+s.id+'" data-itemid="'+it.id+'">×</button><label><input type="checkbox" data-item="done" data-id="'+s.id+'" data-itemid="'+it.id+'" '+(it.done?'checked':'')+'> checked</label><input class="inp" data-item="notes" data-id="'+s.id+'" data-itemid="'+it.id+'" placeholder="notes" value="'+esc(it.notes)+'"></div>'}).join('')+'</div><div class="card"><div class="row"><h3>Photos</h3><button class="btn pri" data-action="photos" data-id="'+s.id+'">Add Photo</button></div><div class="photoGrid">'+s.photos.map(function(p){return'<div class="photo">'+(p.dataUrl?'<img src="'+p.dataUrl+'">':'')+'<p>'+esc(p.name||p.time)+'</p></div>'}).join('')+'</div></div>'}
function renderRoute(){var os=orderedStops();return'<section class="card"><div class="row"><h2>Route Order</h2><button class="btn pri" data-action="buildRoute">Rebuild</button></div>'+os.map(function(s,i){return'<div class="routeRow"><div class="num">'+(i+1)+'</div><div><b>'+esc(s.name)+'</b><p class="mut">'+esc(s.address||s.customer_name)+'</p>'+s.items.map(function(it){return'<span class="pill '+(it.dir==='pickup'?'pu':'do')+'">'+it.dir+' '+it.qty+' '+esc(it.item)+'</span>'}).join('')+'</div><button class="btn sm" data-action="selectTab" data-tabname="stops" data-id="'+s.id+'">Edit</button></div>'}).join('')+'</section>'}
function table(head,rows){return'<div class="scroll"><table><thead><tr>'+head.map(function(h){return'<th>'+esc(h)+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return'<tr>'+head.map(function(h){return'<td>'+esc(r[h]==null?'':r[h])+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
function renderLoad(){var calc=calcLoad(orderedStops());return'<section class="card"><h2>Printed Inventory Summary</h2><p class="mut">From Customers Departing/Returning table.</p>'+table(['item','departing','returning','net'],state.inventory.map(function(r){return{item:r.item,departing:r.departing,returning:r.returning,net:r.departing-r.returning}}))+'</section><section class="card"><h2>Calculated Load / Reconciliation</h2>'+table(['item','loadStart','pickup','dropoff','end','printedDeparting','printedReturning','delta'],calc)+'</section>'}
function renderDrive(){var os=orderedStops(),s=os[state.driveIndex]||os[0];if(!s)return'<section class="card">No stops.</section>';var iss=issues(s);return'<section class="card"><p class="mut">Stop '+(state.driveIndex+1)+' / '+os.length+'</p><h2>'+esc(s.name)+'</h2><p>'+esc(s.notes)+'</p>'+s.items.map(function(it){return'<div class="card"><b>'+it.dir+' '+it.qty+' '+esc(it.item)+'</b><div class="row"><input class="inp" style="max-width:120px" type="number" data-driveactual="'+it.id+'" data-id="'+s.id+'" value="'+esc(it.actual)+'" placeholder="actual"><button class="btn ok" data-action="driveDone" data-id="'+s.id+'" data-itemid="'+it.id+'">Done</button></div></div>'}).join('')+'<div class="card gate">'+(iss.length?'<h3>Hard stop blockers</h3><ul>'+iss.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul>':'<button class="btn ok" data-action="archive" data-id="'+s.id+'">Archive Finished Job</button>')+'</div><div class="row"><button class="btn" data-action="driveBack">Back</button><button class="btn pri" data-action="driveNext">Next</button></div></section>'}
function renderLedger(){return'<section class="card"><h2>Ledger</h2>'+(!state.ledger.length?'<p class="mut">No archived jobs.</p>':state.ledger.map(function(l){return'<details class="card"><summary><b>'+esc(l.name)+'</b> '+new Date(l.archivedAt).toLocaleString()+'</summary>'+table(['dir','item','qty','actual','condition'],l.items||[])+'</details>'}).join(''))+'</section>'}
function preview(payload,source){if(!payload.stops.length&&!payload.inventory.length){modal('<h2>No valid data found</h2><p>Need stops[] and/or inventory_summary[]. Blank rows were ignored.</p><button class="btn" data-action="closeModal">Close</button>');return}window.__pendingImport=payload;modal('<h2>Import Preview</h2><p class="mut">'+esc(source||'import')+': '+payload.stops.length+' stops · '+payload.inventory.length+' inventory rows.</p>'+(payload.report?'<pre class="card mono">'+esc(JSON.stringify(payload.report,null,2))+'</pre>':'')+(payload.stops.length?table(['name','order_id','customer_name','items'],payload.stops.slice(0,20).map(function(s){return{name:s.name,order_id:s.order_id,customer_name:s.customer_name,items:s.items.length}})):'')+(payload.inventory.length?'<h3>Inventory</h3>'+table(['item','departing','returning'],payload.inventory.slice(0,30)):'')+'<div class="row"><button class="btn ok" data-action="applyImport" data-mode="replace">Replace Route + Inventory</button><button class="btn pri" data-action="applyImport" data-mode="append">Append / Merge</button><button class="btn" data-action="closeModal">Cancel</button></div>')}
function modal(html){$('modalRoot').innerHTML='<div class="modal"><div class="box"><button class="btn sm" style="float:right" data-action="closeModal">×</button>'+html+'</div></div>'}function closeModal(){$('modalRoot').innerHTML=''}function toast(msg){$('toast').innerHTML='<div class="card">'+esc(msg)+'</div>';setTimeout(function(){$('toast').innerHTML=''},2800)}
function openPaste(){modal('<h2>Paste OCR JSON</h2><textarea id="pasteBox" class="inp mono" placeholder="{&quot;schema&quot;:&quot;routeops.v11&quot;,&quot;stops&quot;:[],&quot;inventory_summary&quot;:[]}"></textarea><div class="row"><button class="btn ok" data-action="previewPaste">Preview</button><button class="btn" data-action="fillExample">Example</button></div>')}function openSchema(){modal('<h2>OCR Schema + Prompt</h2><p class="mut">For full-page capture: send multiple uncropped page images if needed. The webhook must pass images[] to the vision/OCR model.</p><textarea class="inp mono" style="min-height:240px">'+esc(OCR_PROMPT)+'</textarea><h3>Example JSON</h3><textarea class="inp mono" style="min-height:220px">'+esc(JSON.stringify(DEFAULT,null,2))+'</textarea><button class="btn" data-action="copyPrompt">Copy Prompt</button>')}function openOCR(){modal('<h2>OCR Page(s)</h2><p class="mut">Select every full page: inventory table page + all job pages. Use phone document-scan mode for best results.</p><input id="hookUrl" class="inp" value="'+esc(localStorage.getItem('routeops_hook')||'')+'" placeholder="https://.../webhook/routeops-ocr"><div class="row"><button class="btn pri" data-action="chooseOCR">Choose Images</button><button class="btn" data-action="schema">Schema</button></div>')}
async function fileToDataURL(file){return await new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(file)})}async function sendOCR(files){files=[].slice.call(files||[]);var hook=localStorage.getItem('routeops_hook');if(!hook){openOCR();return}toast('Sending '+files.length+' full page image(s) to OCR...');var images=[];for(var i=0;i<files.length;i++)images.push({index:i+1,name:files[i].name,type:files[i].type,role:'full_page',data_url:await fileToDataURL(files[i])});var res=await fetch(hook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({schema:'routeops.v11',prompt:OCR_PROMPT,gear:GEAR,images:images,image:images[0]})});if(!res.ok)throw new Error('Webhook HTTP '+res.status);var out=await res.json();preview(importPayload(out.json||out.result||out),'OCR webhook')}
function applyImport(mode){var p=window.__pendingImport||{stops:[],inventory:[]};if(mode==='replace'){if(p.stops.length)state.stops=p.stops;if(p.inventory.length)state.inventory=p.inventory}else{state.stops=state.stops.concat(p.stops);state.inventory=mergeInv(state.inventory.concat(p.inventory))}state.selectedId=state.stops[0]&&state.stops[0].id;state.routeOrder=[];closeModal();save();render();toast('Imported '+p.stops.length+' stops, '+p.inventory.length+' inventory rows.')}function runTests(){var out=[];function ok(name,cond,detail){out.push({test:name,result:cond?'PASS':'FAIL',detail:detail||''})}var p=importPayload(DEFAULT);ok('sample imports 3 stops',p.stops.length===3,p.stops.length);ok('inventory imports 3 rows',p.inventory.length===3,p.inventory.length);ok('blank OCR rows filtered',importPayload({stops:[{},{}]}).stops.length===0);ok('alternate pickup_load key',importPayload({stops:[{name:'A',pickup_load:[{item:'Adult Bikes',qty:2}]}]}).stops[0].items[0].dir==='pickup');var rows=parseCSV('name,item,qty,direction,departing,returning\nBeach,Adult Bikes,2,pickup,,\n,Adult Bikes,,,10,16');var cp=csvPayload(rows);ok('CSV creates one stop',cp.stops.length===1,cp.stops.length);ok('CSV imports inventory row',cp.inventory.length===1,JSON.stringify(cp.inventory));ok('load calc returns rows',calcLoad(p.stops).length>0);modal('<h2>Triple Tests</h2>'+table(['test','result','detail'],out)+'<button class="btn" data-action="closeModal">Close</button>')}
function updateStop(id,patch){state.stops=state.stops.map(function(s){return s.id===id?normalizeStop(Object.assign({},s,patch)):s});save();render()}function findStop(id){return state.stops.find(function(s){return s.id===id})}function addStop(){var s=normalizeStop({name:'New Stop '+(state.stops.length+1)});state.stops.push(s);state.selectedId=s.id;save();render()}function addShop(){var s=normalizeStop({name:'Shop / Depot',isDepot:true,items:[]});state.stops.unshift(s);state.selectedId=s.id;save();render()}function removeStop(id){state.stops=state.stops.filter(function(s){return s.id!==id});state.selectedId=state.stops[0]&&state.stops[0].id;save();render()}function duplicateStop(id){var s=normalizeStop(copy(findStop(id)));s.id=uid();s.name=s.name+' Copy';s.archivedAt=null;state.stops.push(s);state.selectedId=s.id;save();render()}function addTask(id){var s=findStop(id);s.tasks.push(normalizeTask('New task'));save();render()}function addItem(id){var s=findStop(id);s.items.push(normalizeItem({dir:'dropoff',item:'Adult Bikes',qty:1}));save();render()}function fillCounts(id){var s=findStop(id);s.items.forEach(function(i){i.actual=i.actual||String(i.qty);i.done=true});save();render()}function archive(id){var s=findStop(id),iss=issues(s);if(iss.length){modal('<h2>Cannot archive yet</h2><ul>'+iss.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul>');return}s.archivedAt=new Date().toISOString();state.ledger.unshift({name:s.name,archivedAt:s.archivedAt,items:copy(s.items)});save();render();toast('Archived '+s.name)}
function bind(){document.addEventListener('click',function(e){var b=e.target.closest('button,[data-action],[data-tab]');if(!b)return;var a=b.getAttribute('data-action');if(b.getAttribute('data-tab')){state.activeTab=b.getAttribute('data-tab');save();render();return}if(!a)return;var id=b.getAttribute('data-id');if(a==='upload')$('fileInput').click();if(a==='ocrSetup')openOCR();if(a==='pasteJson')openPaste();if(a==='schema')openSchema();if(a==='buildRoute')buildRoute();if(a==='addStop')addStop();if(a==='quickAddShop')addShop();if(a==='tests')runTests();if(a==='export')downloadJSON();if(a==='newDay'){state.stops=DEFAULT.stops.map(normalizeStop);state.inventory=[];state.routeOrder=[];state.selectedId=state.stops[0].id;save();render()}if(a==='reset'){state=hydrate(DEFAULT);save();render()}if(a==='select'){state.selectedId=id;render()}if(a==='selectTab'){state.selectedId=id;state.activeTab=b.getAttribute('data-tabname')||'stops';render()}if(a==='remove')removeStop(id);if(a==='duplicate')duplicateStop(id);if(a==='addTask')addTask(id);if(a==='removeTask'){var s=findStop(id);s.tasks=s.tasks.filter(function(t){return t.id!==b.getAttribute('data-taskid')});save();render()}if(a==='addItem')addItem(id);if(a==='removeItem'){var st=findStop(id);st.items=st.items.filter(function(i){return i.id!==b.getAttribute('data-itemid')});save();render()}if(a==='fillCounts')fillCounts(id);if(a==='archive')archive(id);if(a==='driveBack'){state.driveIndex=Math.max(0,state.driveIndex-1);render()}if(a==='driveNext'){var os=orderedStops(),s=os[state.driveIndex],iss=issues(s);if(iss.length){modal('<h2>Hard stop</h2><ul>'+iss.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul>');return}if(!s.archivedAt){toast('Archive this finished job first');return}state.driveIndex=Math.min(os.length-1,state.driveIndex+1);render()}if(a==='closeModal')closeModal();if(a==='previewPaste'){try{preview(importPayload($('pasteBox').value),'pasted JSON')}catch(err){modal('<h2>Bad JSON</h2><p>'+esc(err.message)+'</p>')}}if(a==='fillExample')$('pasteBox').value=JSON.stringify(DEFAULT,null,2);if(a==='copyPrompt'){navigator.clipboard&&navigator.clipboard.writeText(OCR_PROMPT);toast('Prompt copied')}if(a==='chooseOCR'){localStorage.setItem('routeops_hook',$('hookUrl').value);closeModal();$('ocrInput').click()}if(a==='applyImport')applyImport(b.getAttribute('data-mode'));if(a==='bulkGear')openBulk(id);if(a==='photos')openPhotos(id)});
document.addEventListener('change',function(e){var el=e.target;if(el.id==='fileInput')handleFile(el.files[0]).catch(function(err){modal('<h2>Import failed</h2><p>'+esc(err.message)+'</p>')}).finally(function(){el.value=''}) ;if(el.id==='ocrInput')sendOCR(el.files).catch(function(err){modal('<h2>OCR failed</h2><p>'+esc(err.message)+'</p>')}).finally(function(){el.value=''}) ;if(el.hasAttribute('data-edit')){var p={};p[el.getAttribute('data-edit')]=el.value;updateStop(el.getAttribute('data-id'),p)}if(el.hasAttribute('data-task')){var s=findStop(el.getAttribute('data-id')),tid=el.getAttribute('data-taskid'),field=el.getAttribute('data-task');s.tasks=s.tasks.map(function(t){if(t.id===tid){t[field]=field==='done'?el.checked:el.value}return t});save();render()}if(el.hasAttribute('data-item')){var st=findStop(el.getAttribute('data-id')),iid=el.getAttribute('data-itemid'),f=el.getAttribute('data-item');st.items=st.items.map(function(it){if(it.id===iid){it[f]=f==='done'?el.checked:(f==='qty'?num(el.value,1):el.value);if(f==='item')it.item=canonicalGear(it.item)}return it});save();render()}if(el.hasAttribute('data-driveactual')){var ss=findStop(el.getAttribute('data-id')),ii=ss.items.find(function(x){return x.id===el.getAttribute('data-driveactual')});ii.actual=el.value;save();render()}})}
function openBulk(id){modal('<h2>Bulk Gear</h2><p class="mut">One per line: pickup Adult Bikes 2</p><textarea id="bulkBox" class="inp mono"></textarea><button class="btn ok" data-action="bulkApply" data-id="'+id+'">Apply</button>');setTimeout(function(){var btn=document.querySelector('[data-action="bulkApply"]');btn.onclick=function(){var s=findStop(id);bulkBox.value.split(/\n+/).map(clean).filter(Boolean).forEach(function(line){var p=line.split(/\s+/),q=num(p[p.length-1],1),d=p[0],it=p.slice(1,-1).join(' ');var ni=normalizeItem({dir:d,item:it,qty:q});if(ni)s.items.push(ni)});closeModal();save();render()}},0)}function openPhotos(id){var input=document.createElement('input');input.type='file';input.accept='image/*';input.multiple=true;input.onchange=function(){addPhotos(id,input.files)};input.click()}async function addPhotos(id,files){var s=findStop(id);for(var i=0;i<files.length;i++){var data=await resizeImage(files[i]).catch(function(){return null});s.photos.push({name:files[i].name,time:new Date().toISOString(),dataUrl:data})}save();render()}
function resizeImage(file){return new Promise(function(res,rej){var reader=new FileReader();reader.onload=function(){var img=new Image();img.onload=function(){var max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};img.onerror=rej;img.src=reader.result};reader.onerror=rej;reader.readAsDataURL(file)})}
async function handleFile(file){if(!file)return;var text=await file.text(),json=/\.json$/i.test(file.name)||/^[\s\r\n]*[\[{]/.test(text);preview(json?importPayload(text):csvPayload(parseCSV(text)),file.name)}function downloadJSON(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({schema:'routeops.v11',stops:state.stops,inventory_summary:state.inventory,ledger:state.ledger},null,2)],{type:'application/json'}));a.download='routeops-backup.json';a.click()}function init(){bind();render()}
var API={importPayload:importPayload,csvPayload:csvPayload,parseCSV:parseCSV,calcLoad:calcLoad,runTests:runTests,normalizeStop:normalizeStop,normalizeItem:normalizeItem,DEFAULT:DEFAULT,init:init};if(typeof module!=='undefined')module.exports=API;if(typeof window!=='undefined'){window.RouteOps=API;document.addEventListener('DOMContentLoaded',init)}
})();
