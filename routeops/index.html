<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RouteOps v1</title><style>
body{margin:0;background:#0f172a;color:#f8fafc;font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}.wrap{max-width:1080px;margin:auto;padding:10px}.top{position:sticky;top:0;z-index:5;background:#111827f4;border-bottom:1px solid #334155}.topin{max-width:1080px;margin:auto;padding:10px;display:flex;justify-content:space-between;gap:8px}.card{background:#1f2937;border:1px solid #475569;border-radius:14px;padding:12px;margin:9px 0}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.btn{background:#273449;color:#fff;border:1px solid #64748b;border-radius:10px;padding:10px 12px;font-weight:800}.btn.sm{padding:6px 9px;font-size:12px}.pri{background:#2563eb}.ok{background:#15803d}.bad{background:#991b1b}.warn{background:#b45309}.active{background:#d97706;color:#111827}.input{width:100%;background:#111827;color:#fff;border:1px solid #64748b;border-radius:10px;padding:8px}textarea.input{min-height:100px}.grid{display:grid;grid-template-columns:330px 1fr;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;margin:2px;font-size:12px;font-weight:800;background:#334155}.pu{background:#14532d;color:#bbf7d0}.do{background:#7f1d1d;color:#fecaca}.lock{background:#713f12;color:#fde68a}.sel{border-left:5px solid #60a5fa;background:#172033}.gate{border-left:6px solid #f59e0b}.check{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;background:#111827;border:1px solid #64748b;border-radius:12px;padding:10px;margin:7px 0}.item{display:grid;grid-template-columns:92px 1fr 75px 85px 110px auto;gap:7px;align-items:center;background:#273449;border-radius:12px;padding:8px;margin:7px 0}.stage span{display:inline-flex;padding:6px 9px;margin:2px;border-radius:9px;background:#334155;font-size:12px;font-weight:800}.stage .now{background:#d97706;color:#111827}.stage .done{background:#15803d}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{border-top:1px solid #64748b55;padding:7px;text-align:left;font-size:13px}.modal{position:fixed;inset:0;z-index:20;background:#000c;display:grid;place-items:center;padding:10px}.box{width:min(900px,100%);max-height:90vh;overflow:auto;background:#1f2937;border:1px solid #64748b;border-radius:14px;padding:14px}.toast{position:fixed;left:12px;right:12px;bottom:12px;z-index:30}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}.muted{color:#cbd5e1}@media(max-width:820px){.topin{display:block}.grid,.grid2,.item{grid-template-columns:1fr}.row>.btn{flex:1 1 130px}}
</style></head><body><header class="top"><div class="topin"><div><b>RouteOps v1</b><div class="muted" style="font-size:12px">manual data model + ordered gates only · no OCR · no route engine</div></div><div class="row"><button class="btn pri" data-act="addStop">+ Stop</button><button class="btn" data-tab="drive">Drive Gates</button></div></div></header><main class="wrap"><section class="card"><div id="stats" class="row"></div></section><section class="card row"><button class="btn" data-tab="dash">Dashboard</button><button class="btn" data-tab="stops">Stops</button><button class="btn" data-tab="inventory">Inventory</button><button class="btn" data-tab="drive">Drive Gates</button><button class="btn" data-tab="ledger">Ledger</button><button class="btn" data-tab="data">Data</button><button class="btn warn" data-act="tests">Tests</button><button class="btn bad" data-act="reset">Reset</button></section><div id="app"></div></main><div id="modal"></div><div id="toast" class="toast"></div><script>
(function(){'use strict';var KEY='routeops_v1_manual_gates';var DAY=['Route reviewed','Inventory reviewed','Load sheet reviewed','Truck loaded','Truck photo recorded','Phone / water / tools ready'];var ARR=['Park safely','Verify correct address/unit','Read instructions/codes','Confirm customer/order if present'];var STAGES=['Arrival','Work','Exception','Proof','Archive'];var COND=['OK','Dirty','Wet','Damaged','Missing'];var DEF={tab:'dash',selected:null,drive:0,day:{open:false,checks:{},photos:[]},stops:[],inventory:[],ledger:[]};var state=load();function $(id){return document.getElementById(id)}function uid(){return Math.random().toString(36).slice(2,10)}function clean(v){return String(v==null?'':v).trim().replace(/\s+/g,' ')}function num(v,d){v=Number(String(v==null?'':v).replace(/[^0-9.-]/g,''));return Number.isFinite(v)?v:(d||0)}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function copy(o){return JSON.parse(JSON.stringify(o||{}))}
function newItem(){return{id:uid(),dir:'dropoff',name:'Item',expected:1,actual:'',condition:'OK',done:false,note:''}}function newStop(){return{id:uid(),name:'New Stop',address:'',customer:'',order:'',notes:'',items:[newItem()],photos:[],gate:{stage:0,checks:{}},archivedAt:null}}function norm(s){s=s||{};return{tab:s.tab||'dash',selected:s.selected||null,drive:s.drive||0,day:s.day||{open:false,checks:{},photos:[]},stops:(s.stops||[]).map(function(x){x.items=(x.items||[]).map(function(i){return Object.assign(newItem(),i)});x.photos=x.photos||[];x.gate=x.gate||{stage:0,checks:{}};return Object.assign(newStop(),x)}),inventory:(s.inventory||[]).map(function(r){return{id:r.id||uid(),name:clean(r.name||'Item'),available:num(r.available,0),returning:num(r.returning,0),notes:clean(r.notes||'')}}),ledger:s.ledger||[]}}function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)return norm(s)}catch(e){}return norm(DEF)}function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function findStop(id){return state.stops.find(function(s){return s.id===id})}function findItem(sid,iid){var s=findStop(sid);return s&&s.items.find(function(i){return i.id===iid})}function stats(){var items=0,done=0,photos=0;state.stops.forEach(function(s){photos+=s.photos.length;s.items.forEach(function(i){items++;if(i.done)done++})});$('stats').innerHTML='<span class=pill>Stops '+state.stops.length+'</span><span class=pill>Items '+done+'/'+items+'</span><span class=pill>Inventory '+state.inventory.length+'</span><span class=pill>Photos '+photos+'</span><span class="pill '+(state.day.open?'pu':'lock')+'">Day '+(state.day.open?'OPEN':'LOCKED')+'</span><span class=pill>Ledger '+state.ledger.length+'</span>'}function render(){if(!state.selected&&state.stops[0])state.selected=state.stops[0].id;stats();document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.tab===state.tab)});$('app').innerHTML=state.tab==='stops'?viewStops():state.tab==='inventory'?viewInventory():state.tab==='drive'?viewDrive():state.tab==='ledger'?viewLedger():state.tab==='data'?viewData():viewDash()}
function viewDash(){return'<section class=card><h2>RouteOps v1 Foundation</h2><p class=muted>Rebuild step after Zero: data model, manual inventory, ordered checklist gates, and archive ledger only. No OCR, no import, no routing yet.</p><ol><li>Stops/items/inventory/ledger</li><li>Manual gates</li><li>JSON import next</li><li>CSV after that</li><li>Route logic later</li></ol></section>'}function viewStops(){var sel=findStop(state.selected)||state.stops[0];return'<div class=grid><section><div class="card row"><button class="btn pri" data-act=addStop>+ Stop</button><button class=btn data-act=seed>Seed Sample</button></div>'+state.stops.map(function(s,i){return'<div class="card '+(s.id===state.selected?'sel':'')+'" data-act=selectStop data-id="'+s.id+'"><b>'+(i+1)+'. '+esc(s.name)+'</b><p class=muted>'+esc(s.address)+' '+(s.order?'· '+esc(s.order):'')+'</p>'+s.items.map(function(it){return'<span class="pill '+(it.dir==='pickup'?'pu':'do')+'">'+esc(it.dir)+' '+esc(it.expected)+' '+esc(it.name)+'</span>'}).join('')+'<div class=row><button class="btn sm" data-act=dupStop data-id="'+s.id+'">Duplicate</button><button class="btn sm bad" data-act=removeStop data-id="'+s.id+'">Remove</button></div></div>'}).join('')+'</section><section>'+(sel?editStop(sel):'<div class=card>Add a stop to begin.</div>')+'</section></div>'}function editStop(s){return'<div class=card><h2>'+esc(s.name)+'</h2><div class=grid2><label>Name<input class=input data-stop=name data-id="'+s.id+'" value="'+esc(s.name)+'"></label><label>Order<input class=input data-stop=order data-id="'+s.id+'" value="'+esc(s.order)+'"></label><label>Customer<input class=input data-stop=customer data-id="'+s.id+'" value="'+esc(s.customer)+'"></label><label>Address<input class=input data-stop=address data-id="'+s.id+'" value="'+esc(s.address)+'"></label></div><label>Notes<textarea class=input data-stop=notes data-id="'+s.id+'">'+esc(s.notes)+'</textarea></label></div><div class=card><div class=row><h3>Items</h3><button class="btn sm" data-act=addItem data-id="'+s.id+'">+ Item</button><button class="btn sm" data-act=fillItems data-id="'+s.id+'">Fill Counts</button></div>'+s.items.map(function(it){return itemRow(s.id,it)}).join('')+'</div>'}function itemRow(sid,it){return'<div class=item><select class=input data-item=dir data-id="'+sid+'" data-iid="'+it.id+'"><option '+(it.dir==='dropoff'?'selected':'')+'>dropoff</option><option '+(it.dir==='pickup'?'selected':'')+'>pickup</option></select><input class=input data-item=name data-id="'+sid+'" data-iid="'+it.id+'" value="'+esc(it.name)+'"><input class=input type=number data-item=expected data-id="'+sid+'" data-iid="'+it.id+'" value="'+esc(it.expected)+'"><input class=input type=number data-item=actual data-id="'+sid+'" data-iid="'+it.id+'" placeholder=actual value="'+esc(it.actual)+'"><select class=input data-item=condition data-id="'+sid+'" data-iid="'+it.id+'">'+COND.map(function(c){return'<option '+(c===it.condition?'selected':'')+'>'+c+'</option>'}).join('')+'</select><button class="btn sm bad" data-act=removeItem data-id="'+sid+'" data-iid="'+it.id+'">×</button><label><input type=checkbox data-item=done data-id="'+sid+'" data-iid="'+it.id+'" '+(it.done?'checked':'')+'> Done</label><input class=input data-item=note data-id="'+sid+'" data-iid="'+it.id+'" placeholder="exception note" value="'+esc(it.note)+'"></div>'}
function viewInventory(){return'<section class=card><div class=row><h2>Manual Inventory</h2><button class="btn sm" data-act=addInv>+ Row</button></div>'+(!state.inventory.length?'<p class=muted>No inventory rows yet.</p>':'')+state.inventory.map(function(r){return'<div class=item><input class=input data-inv=name data-rid="'+r.id+'" value="'+esc(r.name)+'"><input class=input type=number data-inv=available data-rid="'+r.id+'" value="'+esc(r.available)+'"><input class=input type=number data-inv=returning data-rid="'+r.id+'" value="'+esc(r.returning)+'"><input class=input data-inv=notes data-rid="'+r.id+'" value="'+esc(r.notes)+'" placeholder=notes><button class="btn sm bad" data-act=removeInv data-rid="'+r.id+'">×</button></div>'}).join('')+'</section>'}
function viewDrive(){if(!state.day.open)return dayGate();var s=state.stops[state.drive];if(!s)return'<section class=card><h2>No active stop</h2><p class=muted>Add stops first.</p></section>';return stopGate(s)}function dayGate(){var complete=DAY.every(function(x){return state.day.checks[x]})&&state.day.photos.length>0;return'<section class="card gate"><h2>⓪ Start-of-Day Gate</h2>'+DAY.map(function(x){return'<label class=check><input type=checkbox data-day="'+esc(x)+'" '+(state.day.checks[x]?'checked':'')+'><span>'+esc(x)+'</span><b>'+(state.day.checks[x]?'✓':'LOCK')+'</b></label>'}).join('')+'<div class=card>Truck/load photo records: '+state.day.photos.length+'</div><div class=row><button class="btn pri" data-act=dayPhoto>Add Truck Photo Record</button><button class="btn ok" data-act=unlockDay '+(complete?'':'disabled')+'>Unlock Stops</button></div></section>'}function stageBar(s){var st=s.gate.stage||0;return'<div class=stage>'+STAGES.map(function(x,i){return'<span class="'+(i<st?'done':i===st?'now':'')+'">'+(i+1)+' '+x+'</span>'}).join('')+'</div>'}
function stopGate(s){var st=s.gate.stage||0,body='';if(st===0)body='<h3>① Arrival Gate</h3>'+ARR.map(function(x){return'<label class=check><input type=checkbox data-gcheck="'+esc(x)+'" data-id="'+s.id+'" '+(s.gate.checks[x]?'checked':'')+'><span>'+esc(x)+'</span><b>'+(s.gate.checks[x]?'✓':'LOCK')+'</b></label>'}).join('');if(st===1)body='<h3>② Work Gate</h3>'+s.items.map(function(it){return'<div class=card><b>'+esc(it.dir)+' '+esc(it.expected)+' '+esc(it.name)+'</b><div class=row><input class=input style="max-width:120px" type=number data-drive=actual data-id="'+s.id+'" data-iid="'+it.id+'" value="'+esc(it.actual)+'" placeholder=actual><select class=input style="max-width:160px" data-drive=condition data-id="'+s.id+'" data-iid="'+it.id+'">'+COND.map(function(c){return'<option '+(c===it.condition?'selected':'')+'>'+c+'</option>'}).join('')+'</select><label class=pill><input type=checkbox data-drive=done data-id="'+s.id+'" data-iid="'+it.id+'" '+(it.done?'checked':'')+'> Done</label></div></div>'}).join('');if(st===2){var bad=badItems(s);body='<h3>③ Exception Gate</h3>'+(bad.length?bad.map(function(it){return'<label>'+esc(it.name)+' note<textarea class=input data-drive=note data-id="'+s.id+'" data-iid="'+it.id+'">'+esc(it.note)+'</textarea></label>'}).join('')+'<label class=check><input type=checkbox data-gcheck="Exceptions reviewed" data-id="'+s.id+'" '+(s.gate.checks['Exceptions reviewed']?'checked':'')+'><span>Exceptions reviewed / manager-ready</span><b>LOCK</b></label>':'<label class=check><input type=checkbox data-gcheck="No exceptions" data-id="'+s.id+'" '+(s.gate.checks['No exceptions']?'checked':'')+'><span>No mismatch, missing, dirty, wet, or damaged item found</span><b>LOCK</b></label>')}if(st===3)body='<h3>④ Proof Gate</h3><div class=card>Proof photo records: '+s.photos.length+'</div><button class="btn pri" data-act=proofPhoto data-id="'+s.id+'">Add Proof Photo Record</button><label class=check><input type=checkbox data-gcheck="Final scan" data-id="'+s.id+'" '+(s.gate.checks['Final scan']?'checked':'')+'><span>Final visual scan: nothing forgotten, unsafe, or blocking access</span><b>LOCK</b></label>';if(st===4)body='<h3>⑤ Archive Gate</h3><button class="btn ok" data-act=archive data-id="'+s.id+'">Archive Finished Job</button>';var ok=gateDone(s);return'<section class="card gate"><p class=muted>Stop '+(state.drive+1)+' / '+state.stops.length+'</p><h2>'+esc(s.name)+'</h2><p>'+esc(s.address)+' '+esc(s.notes)+'</p>'+stageBar(s)+body+'<div class=row><button class=btn data-act=prevStop>Back Stop</button><button class="btn '+(ok?'ok':'warn')+'" data-act=advanceGate data-id="'+s.id+'">Complete Gate</button><button class="btn pri" data-act=nextStop>Next Stop</button></div>'+(ok?'':'<div class="card bad">'+blockers(s).map(esc).join('<br>')+'</div>')+'</section>'}
function viewLedger(){return'<section class=card><h2>Archive Ledger</h2>'+(!state.ledger.length?'<p class=muted>No archived jobs yet.</p>':state.ledger.map(function(l){return'<details class=card><summary><b>'+esc(l.stop.name)+'</b> — '+esc(l.archivedAt)+'</summary><pre class=mono>'+esc(JSON.stringify(l,null,2))+'</pre></details>'}).join(''))+'</section>'}function viewData(){return'<section class=card><h2>Data / Backup</h2><p class=muted>Transparent state. Export only; import comes in the next module.</p><div class=row><button class="btn ok" data-act=backup>Download Backup JSON</button><button class="btn bad" data-act=clearData>Clear Browser Data</button></div><textarea class="input mono" style="min-height:360px" readonly>'+esc(JSON.stringify(state,null,2))+'</textarea></section>'}
function arrivalDone(s){return ARR.every(function(x){return !!s.gate.checks[x]})}function workDone(s){return !s.items.length||s.items.every(function(i){return i.done&&clean(i.actual)!==''})}function badItems(s){return s.items.filter(function(i){return (clean(i.actual)!==''&&num(i.actual)!==num(i.expected))||i.condition!=='OK'})}function exceptionDone(s){var b=badItems(s);return b.length?b.every(function(i){return clean(i.note)})&&s.gate.checks['Exceptions reviewed']:s.gate.checks['No exceptions']}function proofDone(s){return s.photos.length>0&&s.gate.checks['Final scan']}function gateDone(s){var st=s.gate.stage||0;return st===0?arrivalDone(s):st===1?workDone(s):st===2?exceptionDone(s):st===3?proofDone(s):!!s.archivedAt}function blockers(s){var st=s.gate.stage||0;if(st===0)return ARR.filter(function(x){return !s.gate.checks[x]}).map(function(x){return 'Missing arrival check: '+x});if(st===1)return s.items.filter(function(i){return !i.done||clean(i.actual)===''}).map(function(i){return 'Finish work item: '+i.name});if(st===2){var out=[],b=badItems(s);if(b.length){b.forEach(function(i){if(!clean(i.note))out.push('Exception note required: '+i.name)});if(!s.gate.checks['Exceptions reviewed'])out.push('Exception review checkbox required.')}else if(!s.gate.checks['No exceptions'])out.push('Check No exceptions.');return out}if(st===3){var o=[];if(!s.photos.length)o.push('Proof photo record missing.');if(!s.gate.checks['Final scan'])o.push('Final scan missing.');return o}return s.archivedAt?[]:['Archive before next stop.']}
function addPhoto(stopId,type){var rec={id:uid(),type:type||'proof',name:type+' photo record',time:new Date().toISOString()};if(stopId)findStop(stopId).photos.push(rec);else state.day.photos.push(rec);save();render()}function archive(id){var s=findStop(id);if(!proofDone(s)){toast('Proof gate is not complete.');return}s.archivedAt=new Date().toISOString();state.ledger.unshift({id:uid(),archivedAt:s.archivedAt,stop:copy(s)});save();render();toast('Archived: '+s.name)}function seed(){state.stops=[Object.assign(newStop(),{name:'Beach Club #127',address:'1440 Ocean Blvd Unit #127',customer:'Dana',order:'596730',items:[Object.assign(newItem(),{dir:'dropoff',name:'Loungers',expected:2}),Object.assign(newItem(),{dir:'pickup',name:'Umbrellas',expected:1})]})];state.inventory=[{id:uid(),name:'Loungers',available:2,returning:0,notes:''},{id:uid(),name:'Umbrellas',available:1,returning:1,notes:''}];state.selected=state.stops[0].id;state.tab='stops';save();render()}function backup(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='routeops-v1-backup.json';a.click()}function tests(){var rows=[];function ok(n,c){rows.push({test:n,result:c?'PASS':'FAIL'})}var s=newStop();s.items=[Object.assign(newItem(),{expected:1,actual:'1',done:true})];ARR.forEach(function(x){s.gate.checks[x]=true});s.gate.checks['No exceptions']=true;s.gate.checks['Final scan']=true;s.photos=[{}];ok('arrival gate',arrivalDone(s));ok('work gate',workDone(s));ok('exception gate',exceptionDone(s));ok('proof gate',proofDone(s));modal('<h2>Tests</h2>'+table(['test','result'],rows))}function table(h,rows){return'<div class=scroll><table><tr>'+h.map(function(x){return'<th>'+esc(x)+'</th>'}).join('')+'</tr>'+rows.map(function(r){return'<tr>'+h.map(function(x){return'<td>'+esc(r[x]||'')+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>'}function modal(html){$('modal').innerHTML='<div class=modal><div class=box><button class="btn sm" style="float:right" data-act=close>×</button>'+html+'</div></div>'}function close(){$('modal').innerHTML=''}function toast(msg){$('toast').innerHTML='<div class=card>'+esc(msg)+'</div>';setTimeout(function(){$('toast').innerHTML=''},2600)}
document.addEventListener('click',function(e){var b=e.target.closest('[data-act],[data-tab]');if(!b)return;var a=b.dataset.act,id=b.dataset.id;if(b.dataset.tab){state.tab=b.dataset.tab;save();render();return}if(a==='addStop'){var s=newStop();state.stops.push(s);state.selected=s.id;state.tab='stops';save();render()}if(a==='seed')seed();if(a==='selectStop'){state.selected=id;state.tab='stops';save();render()}if(a==='dupStop'){var d=copy(findStop(id));d.id=uid();d.name+=' Copy';d.archivedAt=null;state.stops.push(norm({stops:[d]}).stops[0]);state.selected=d.id;save();render()}if(a==='removeStop'){state.stops=state.stops.filter(function(s){return s.id!==id});state.selected=state.stops[0]&&state.stops[0].id;save();render()}if(a==='addItem'){findStop(id).items.push(newItem());save();render()}if(a==='removeItem'){var st=findStop(id);st.items=st.items.filter(function(i){return i.id!==b.dataset.iid});save();render()}if(a==='fillItems'){findStop(id).items.forEach(function(i){i.actual=i.actual||String(i.expected);i.done=true});save();render()}if(a==='addInv'){state.inventory.push({id:uid(),name:'Item',available:0,returning:0,notes:''});save();render()}if(a==='removeInv'){state.inventory=state.inventory.filter(function(r){return r.id!==b.dataset.rid});save();render()}if(a==='dayPhoto')addPhoto(null,'truck-load');if(a==='unlockDay'){state.day.open=true;state.tab='drive';save();render()}if(a==='proofPhoto')addPhoto(id,'proof');if(a==='advanceGate'){var gs=findStop(id);if(!gateDone(gs)){modal('<h2>Gate blocked</h2><ul>'+blockers(gs).map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul>');return}if((gs.gate.stage||0)<4)gs.gate.stage++;save();render()}if(a==='archive')archive(id);if(a==='nextStop'){var cur=state.stops[state.drive];if(!cur||!cur.archivedAt){toast('Archive current stop before next stop.');return}state.drive=Math.min(state.stops.length-1,state.drive+1);save();render()}if(a==='prevStop'){state.drive=Math.max(0,state.drive-1);save();render()}if(a==='tests')tests();if(a==='backup')backup();if(a==='reset'){localStorage.removeItem(KEY);state=norm(DEF);save();render()}if(a==='clearData'){localStorage.removeItem(KEY);state=norm(DEF);save();render();toast('RouteOps v1 browser data cleared.')}if(a==='close')close()});
document.addEventListener('change',function(e){var el=e.target;if(el.dataset.stop){findStop(el.dataset.id)[el.dataset.stop]=el.value;save();render()}if(el.dataset.item){var it=findItem(el.dataset.id,el.dataset.iid),f=el.dataset.item;it[f]=f==='done'?el.checked:(f==='expected'?num(el.value,1):el.value);save();render()}if(el.dataset.inv){var r=state.inventory.find(function(x){return x.id===el.dataset.rid}),f2=el.dataset.inv;r[f2]=(f2==='available'||f2==='returning')?num(el.value,0):el.value;save();render()}if(el.dataset.day){state.day.checks[el.dataset.day]=el.checked;save();render()}if(el.dataset.gcheck){findStop(el.dataset.id).gate.checks[el.dataset.gcheck]=el.checked;save();render()}if(el.dataset.drive){var di=findItem(el.dataset.id,el.dataset.iid),df=el.dataset.drive;di[df]=df==='done'?el.checked:el.value;save();render()}});window.RouteOpsV1={state:state,tests:tests,arrivalDone:arrivalDone,workDone:workDone,exceptionDone:exceptionDone,proofDone:proofDone};render();})();
</script></body></html>
