function $(id){return document.getElementById(id)}
function clean(v){return String(v==null?'':v).trim().replace(/[–—~=_]+/g,' - ').replace(/\s+/g,' ')}

function fuzzyGear(line){var s=normText(line);if(!s)return '';var best='',score=0;GEAR.forEach(function(g){var gl=normText(g),toks=gl.split(/\s+/).filter(function(t){return t.length>2&&!/^(and|extra|set|the)$/.test(t)}),hits=0;toks.forEach(function(t){if(s.indexOf(t)>=0)hits++});var sc=hits/Math.max(1,toks.length)+(s.indexOf(gl)>=0?1:0);if(sc>score&&hits>0){score=sc;best=g}});return score>=0.34?best:''}

function unpack(o){var a=[];function add(k,d){if(Array.isArray(o[k]))o[k].forEach(function(x){var y=copy(x);if(d)y.dir=d;a.push(y)})}add('items');add('gear');add('pickups','pickup');add('dropoffs','dropoff');add('pickup_load','pickup');add('pickup_load_items','pickup');add('load_items','pickup');add('unload_delivery','dropoff');add('unload_delivery_items','dropoff');add('delivery_items','dropoff');var root=pick(o,['item','gear_item','product'],'');if(root)a.push({item:root,dir:pick(o,['dir','direction'],'dropoff'),qty:pick(o,['qty','quantity'],1)});return a.map(normItem).filter(Boolean)}

function normStop(o,i){o=o||{};var cust=pick(o,['customer_name','customerName','client','guest','company'],typeof o.customer==='string'?o.customer:'');var addr=pick(o,['address','location','property_address','site'],'');var name=pick(o,['name','stop','job','property','unit'],'')||addr||cust||('Stop '+((i||0)+1));var tasks=Array.isArray(o.tasks)?o.tasks:(typeof o.tasks==='string'?o.tasks.split('|'):['Arrive','Verify items','Photo proof']);return{id:o.id||uid(),name:clean(name),order_id:clean(pick(o,['order_id','orderId','rt','ticket'],'')),customer_name:clean(cust),customer_phone:clean(pick(o,['customer_phone','phone'],'')),scheduled_time:clean(pick(o,['scheduled_time','time','window'],'')),address:clean(addr),lat:num(pick(o,['lat','latitude'],0),0),lng:num(pick(o,['lng','lon','longitude'],0),0),isDepot:!!(o.isDepot||o.depot),priority:o.priority==='High'?'High':'Normal',notes:clean(pick(o,['notes','instructions','driver_instructions'],'')),tasks:tasks.map(normTask),items:unpack(o),photos:o.photos||[],archivedAt:o.archivedAt||null}}
function normInv(r){if(!r)return null;var it=gear(pick(r,['item','gear','name'],''));var d=num(pick(r,['departing','depart','out','load'],0),0),ret=num(pick(r,['returning','return','in','pickup'],0),0);return it&&(d||ret)?{item:it,departing:d,returning:ret}:null}
function mergeInv(rows){var m={};(rows||[]).forEach(function(r){r=normInv(r);if(!r)return;m[r.item]=m[r.item]||{item:r.item,departing:0,returning:0};m[r.item].departing+=r.departing;m[r.item].returning+=r.returning});return Object.keys(m).sort().map(function(k){return m[k]})}
function hydrate(o){return{stops:(o.stops||[]).map(normStop).filter(function(s){return s.name||s.items.length}),inventory:mergeInv(o.inventory||o.inventory_summary||[]),ledger:o.ledger||[],routeOrder:o.routeOrder||[],selectedId:o.selectedId||null,tab:o.tab||'stops',driveIndex:o.driveIndex||0}}
function loadState(){try{var raw=JSON.parse(localStorage.getItem(STORE)||'null');if(raw&&raw.stops)return hydrate(raw)}catch(e){}return hydrate(SAMPLE)}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function rawStops(o){if(Array.isArray(o))return o;return o.stops||o.jobs||o.orders||o.records||(o.data&&o.data.stops)||[]}
function importPayload(x){if(typeof x==='string')x=JSON.parse(x.replace(/```json/gi,'').replace(/```/g,'').trim());var seen={};var stops=rawStops(x).filter(function(o){return o&&(o.name||o.address||o.customer_name||o.order_id||(o.items&&o.items.length)||(o.pickups&&o.pickups.length)||(o.dropoffs&&o.dropoffs.length))}).map(normStop).filter(function(s){var sig=s.name+'~'+s.order_id+'~'+s.items.map(function(i){return i.dir+i.item+i.qty}).join('|');if(seen[sig])return false;seen[sig]=true;return true});return{stops:stops,inventory:mergeInv(x.inventory_summary||x.inventory||[]),report:x.extraction_report||null}}
function parseCSV(text){var rows=[],row=[],cell='',q=false;for(var i=0;i<text.length;i++){var ch=text[i],nx=text[i+1];if(ch=='"'&&q&&nx=='"'){cell+='"';i++;continue}if(ch=='"'){q=!q;continue}if(ch==','&&!q){row.push(cell);cell='';continue}if((ch=='\n'||ch=='\r')&&!q){if(ch=='\r'&&nx=='\n')i++;row.push(cell);cell='';if(row.some(clean))rows.push(row);row=[];continue}cell+=ch}row.push(cell);if(row.some(clean))rows.push(row);var h=(rows[0]||[]).map(function(x){return clean(x).toLowerCase()});return rows.slice(1).map(function(r){var o={};h.forEach(function(k,i){o[k]=clean(r[i]||'')});return o})}
function csvPayload(rows){var map={};rows.forEach(function(r,i){var key=clean(r.name||r.stop||r.job||r.address);if(key){map[key]=map[key]||normStop(r,i);var it=normItem(r);if(it&&(r.item||r.gear))map[key].items.push(it)}});return{stops:Object.keys(map).map(function(k){return map[k]}),inventory:mergeInv(rows.map(function(r){return{item:r.item||r.gear||r.name,departing:r.departing,returning:r.returning}}))}}
function ordered(){var order=state.routeOrder.length?state.routeOrder:state.stops.map(function(_,i){return i});return order.map(function(i){return state.stops[i]}).filter(Boolean)}
function hasCoords(s){return isFinite(s.lat)&&isFinite(s.lng)&&!(s.lat===0&&s.lng===0)}
function dist(a,b){var R=3958.8,r=Math.PI/180,dlat=(b.lat-a.lat)*r,dlng=(b.lng-a.lng)*r,la1=a.lat*r,la2=b.lat*r,h=Math.sin(dlat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dlng/2)**2;return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}
function buildRoute(){var depot=Math.max(0,state.stops.findIndex(function(s){return s.isDepot}));var coords=state.stops.map(function(s,i){return{s:s,i:i}}).filter(function(x){return hasCoords(x.s)});if(coords.length<2){state.routeOrder=state.stops.map(function(_,i){return i});state.tab='route';save();render();return}var rem=coords.map(function(x){return x.i}).filter(function(i){return i!==depot}),order=[depot];while(rem.length){var cur=state.stops[order[order.length-1]],best=0,score=1e9;rem.forEach(function(idx,k){var sc=dist(cur,state.stops[idx]);if(state.stops[idx].items.some(function(it){return it.dir==='pickup'}))sc*=0.96;if(sc<score){score=sc;best=k}});order.push(rem.splice(best,1)[0])}var rest=state.stops.map(function(_,i){return i}).filter(function(i){return order.indexOf(i)<0});state.routeOrder=order.concat(rest);state.tab='route';save();render()}
function calcLoad(stops){var run={},need={},tot={};function rec(k){return tot[k]||(tot[k]={item:k,loadStart:0,pickup:0,dropoff:0,end:0,printedDeparting:'',printedReturning:'',delta:''})}stops.forEach(function(s){s.items.filter(function(i){return i.dir==='pickup'}).forEach(function(i){run[i.item]=(run[i.item]||0)+num(i.qty);rec(i.item).pickup+=num(i.qty)});s.items.filter(function(i){return i.dir==='dropoff'}).forEach(function(i){run[i.item]=(run[i.item]||0)-num(i.qty);rec(i.item).dropoff+=num(i.qty);if(run[i.item]<0){need[i.item]=(need[i.item]||0)-run[i.item];run[i.item]=0}})});Object.keys(need).forEach(function(k){rec(k).loadStart=need[k];rec(k).end=need[k]});stops.forEach(function(s){s.items.forEach(function(i){rec(i.item).end+=i.dir==='pickup'?num(i.qty):-num(i.qty)})});state.inventory.forEach(function(r){var row=rec(r.item);row.printedDeparting=r.departing;row.printedReturning=r.returning;row.delta=r.departing-row.loadStart});return Object.keys(tot).sort().map(function(k){return tot[k]})}

document.addEventListener('click',function(e){var b=e.target.closest('button,[data-act],[data-tab]');if(!b)return;var a=b.getAttribute('data-act'),id=b.getAttribute('data-id');if(b.getAttribute('data-tab')){state.tab=b.getAttribute('data-tab');save();render();return}if(a==='upload')$('file').click();else if(a==='paste')modal('<h2>Paste JSON</h2><textarea id="pastebox" class="input mono"></textarea><button class="btn success" data-act="previewPaste">Preview</button><button class="btn" data-act="example">Example</button>');else if(a==='schema')modal('<h2>Schema</h2><textarea class="input mono">{ "stops": [], "inventory_summary": [] }</textarea>');else if(a==='previewPaste'){try{preview(importPayload($('pastebox').value),'pasted JSON')}catch(err){modal('<h2>Bad JSON</h2><p>'+esc(err.message)+'</p>')}}else if(a==='example')$('pastebox').value=JSON.stringify(SAMPLE,null,2);else if(a==='applyReplace')apply(window.pending,'replace');else if(a==='applyAppend')apply(window.pending,'append');else if(a==='close')closeModal();else if(a==='build')buildRoute();else if(a==='add')addStop();else if(a==='shop')addShop();else if(a==='select'){state.selectedId=id;save();render()}else if(a==='editroute'){state.selectedId=id;state.tab='stops';save();render()}else if(a==='remove'){state.stops=state.stops.filter(function(s){return s.id!==id});state.selectedId=state.stops[0]&&state.stops[0].id;save();render()}else if(a==='dup'){var d=normStop(copy(findStop(id)));d.id=uid();d.name+=' Copy';state.stops.push(d);state.selectedId=d.id;save();render()}else if(a==='addtask'){findStop(id).tasks.push(normTask('New task'));save();render()}else if(a==='rmtask'){var st=findStop(id),tid=b.getAttribute('data-tid');st.tasks=st.tasks.filter(function(t){return t.id!==tid});save();render()}else if(a==='additem'){findStop(id).items.push(normItem({dir:'dropoff',item:'Adult Bikes',qty:1}));save();render()}else if(a==='rmitem'){var st2=findStop(id),iid=b.getAttribute('data-iid');st2.items=st2.items.filter(function(i){return i.id!==iid});save();render()}else if(a==='fill'){findStop(id).items.forEach(function(i){i.actual=i.actual||String(i.qty);i.done=true});save();render()}else if(a==='archive')archive(id);else if(a==='drivedone'){var ds=findStop(id),di=ds.items.find(function(i){return i.id===b.getAttribute('data-iid')});di.done=true;di.actual=di.actual||String(di.qty);save();render()}else if(a==='back'){state.driveIndex=Math.max(0,state.driveIndex-1);save();render()}else if(a==='next'){var os=ordered(),s=os[state.driveIndex],iss=issues(s);if(iss.length){modal('<h2>Hard stop</h2><ul>'+iss.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul>');return}if(!s.archivedAt){toastMsg('Archive this job first');return}state.driveIndex=Math.min(os.length-1,state.driveIndex+1);save();render()}else if(a==='tests')runTests();else if(a==='backup')backup();else if(a==='newday'){state.stops=SAMPLE.stops.map(normStop);state.inventory=[];state.ledger=[];state.tab='stops';save();render()}else if(a==='reset'){state=hydrate(SAMPLE);save();render()}else if(a==='ocrchoose')$('ocrLocal2').click();else if(a==='ocrrun')runOCR().catch(function(err){toastMsg('OCR failed: '+err.message)});else if(a==='ocrparse'){syncOCR();ocr.parsed=parseOCRText(ocr.text);ocr.status='Parsed text';ocr.progress=100;render()}else if(a==='ocradd'){syncOCR();ocr.parsed.stops.push({name:'New OCR Stop',order_id:'',address:'',customer_name:'',notes:'',tasks:['Arrive','Verify items','Photo proof'],items:[]});render()}else if(a==='ocrremove'){syncOCR();ocr.parsed.stops.splice(num(b.getAttribute('data-idx'),0),1);render()}else if(a==='ocrreplace'){syncOCR();apply({stops:ocr.parsed.stops,inventory:ocr.parsed.inventory_summary},'replace')}else if(a==='ocrappend'){syncOCR();apply({stops:ocr.parsed.stops,inventory:ocr.parsed.inventory_summary},'append')}else if(a==='ocrcopy'){syncOCR();navigator.clipboard&&navigator.clipboard.writeText(JSON.stringify(ocr.parsed,null,2));toastMsg('OCR JSON copied')}else if(a==='ocrtest'){ocr.text='Customers Departing Returning\nAdult Bikes 5 - Slipcovers ERA Fernandina 2 -\nBeach Cart 1 - Slipcovers Stay Better Vacations 13 10\nBike Locks 4 - Umbrella Anchor 5) 3\nBody Boards 10 1 Umbrella Tables 2 -\nKids Bikes 2 - Umbrellas Stay Better Vacations 3 e\nLoungers 12 7 Whistles - E';ocr.parsed=parseOCRText(ocr.text);ocr.status='Inventory test parsed: '+ocr.parsed.stops.length+' stops, '+ocr.parsed.inventory_summary.length+' inventory rows';ocr.progress=100;state.tab='ocr';render()}});
