<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RouteOps Utility</title><style>
body{margin:0;background:#0f172a;color:#f8fafc;font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:10px}.top{position:sticky;top:0;background:#111827f4;border-bottom:1px solid #334155;z-index:5}.topin{max-width:1180px;margin:auto;padding:10px;display:flex;justify-content:space-between;gap:8px}.card{background:#1f2937;border:1px solid #475569;border-radius:14px;padding:12px;margin:9px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{background:#273449;color:#fff;border:1px solid #64748b;border-radius:10px;padding:10px 12px;font-weight:800}.btn.sm{padding:6px 9px;font-size:12px}.pri{background:#2563eb}.ok{background:#15803d}.bad{background:#991b1b}.warn{background:#b45309}.tab.active{background:#d97706;color:#111827}.input{width:100%;min-height:40px;background:#111827;color:#fff;border:1px solid #64748b;border-radius:10px;padding:8px}textarea.input{min-height:120px}.grid{display:grid;grid-template-columns:330px 1fr;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;margin:2px;font-size:12px;font-weight:800;background:#334155}.pu{background:#14532d;color:#bbf7d0}.do{background:#7f1d1d;color:#fecaca}.sel{border-left:5px solid #60a5fa;background:#172033}.gate{border-left:6px solid #f59e0b}.check{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:#111827;border:1px solid #64748b;border-radius:10px;padding:10px;margin:7px 0}.item{display:grid;grid-template-columns:95px 1fr 70px 88px 115px auto;gap:7px;align-items:center;background:#273449;border-radius:10px;padding:8px;margin:7px 0}.route{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;background:#273449;border-radius:10px;padding:9px;margin:7px 0}.num{width:30px;height:30px;border-radius:8px;background:#d97706;color:#111827;display:grid;place-items:center;font-weight:900}.stage span </style></head><body><header class="top"><div class="topin"><div><b>RouteOps Utility</b><div class="muted" style="font-size:12px">zero rebuild · best path · propagation · ordered gates</div></div><div class="row"><button class="btn pri" data-act="opt">Best Path</button><button class="btn" data-act="add">+ Stop</button></div></div></header><main class="wrap"><section class="card"><div id="stats" class="row"></div></section><section class="card row"><input id="file" type="file" class="hidden" accept=".json,.csv"><button class="btn ok" data-act="upload">Upload JSON/CSV</button><button class="btn" data-act="paste">Paste JSON</button><button class="btn" data-act="schema">Schema</button><button class="btn tab" data-tab="dash">Dashboard</button><button class="btn tab" data-tab="stops">Stops</button><button class="btn tab" data-tab="inv">Inventory</button><button class="btn tab" data-tab="route">Route</button><button class="btn tab" data-tab="load">Load</button><button class="btn tab" data-tab="drive">Drive Gates</button><button class="btn tab" data-tab="ledger">Ledger</button><button class="btn warn" data-act="tests">Tests</button><button class="btn" data-act="backup">Backup</button><button class="btn bad" data-act="reset">Reset</button></section><div id="app"></div></main><div id="modal"></div><div id="toast" class="toast"></div><script>
(function(){'use strict';
var KEY='routeops_util_v1',GEAR=['Adult Bikes','Adult Bike Helmets','Beach Table','Bike Locks','Body Boards','Coolers','Cornhole','Ice Packs','Kids Bikes','Kids Life Jackets','Loungers','Neso Shade','Skim Boards','Slipcovers Hodnett Cooper','Slipcovers Lilmar Properties','Slipcovers Stay Better Vacations','Umbrella Anchor','Umbrella Tables','Umbrellas Hodnett Cooper','Umbrellas Lilmar Properties','Umbrellas Stay Better Vacations','Whistles'];
var DAY=['Route reviewed','Printed inventory reviewed','Load sheet reviewed','Truck loaded from load sheet','Truck/load photo recorded','Phone/water/tools ready'],ARR=['Park safely','Verify correct address/unit','Read notes/codes/instructions','Confirm customer/order if present'],STG=['Arrive','Work Items','Exceptions','Proof','Archive'];
var SAMPLE={schema:'routeops.utility.v1',stops:[{name:'Shop / Depot',isDepot:true,address:'Depot',items:[]},{name:'Coral Sands 306',address:'426 S Fletcher Ave',items:[{dir:'dropoff',item:'Loungers',qty:3},{dir:'dropoff',item:'Umbrella Anchor',qty:1},{dir:'dropoff',item:'Umbrellas Stay Better Vacations',qty:1},{dir:'dropoff',item:'Slipcovers Stay Better Vacations',qty:3}]},{name:'2185 S Fletcher Ave',address:'2185 S Fletcher Ave',items:[{dir:'dropoff',item:'Loungers',qty:2},{dir:'dropoff',item:'Umbrella Tables',qty:1},{dir:'dropoff',item:'Umbrella Anchor',qty:1},{dir:'dropoff',item:'Umbrellas Hodnett Cooper',qty:1},{dir:'dropoff',item:'Slipcovers Hodnett Cooper',qty:2}]},{name:'Beach Club pickup',address:'1440 Ocean Blvd',priority:'High',items:[{dir:'pickup',item:'Loungers',qty:2},{dir:'pickup',item:'Umbrellas Hodnett Cooper',qty:1}]}],inventory_summary:[{item:'Loungers',departing:37,returning:7},{item:'Umbrellas Hodnett Cooper',departing:7,returning:1},{item:'Slipcovers Hodnett Cooper',departing:26,returning:10}],ledger:[]};
var state=loadState();function $(id){return document.getElementById(id)}function clean(v){return String(v==null?'':v).trim().replace(/\s+/g,' ')}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function num(v,d){v=Number(String(v==null?'':v).replace(/[^0-9.-]/g,''));return Number.isFinite(v)?v:(d||0)}function uid(){return Math.random().toString(36).slice(2,10)}function clone(o){return JSON.parse(JSON.stringify(o||{}))}
function gear(v){v=clean(v);if(!v)return'';var l=v.toLowerCase(),i;for(i=0;i<GEAR.length;i++)if(GEAR[i].toLowerCase()===l)return GEAR[i];for(i=0;i<GEAR.length;i++){var g=GEAR[i].toLowerCase();if(g.indexOf(l)>=0||l.indexOf(g)>=0)return GEAR[i]}return v}function dir(v){v=clean(v).toLowerCase();return v.indexOf('pick')>=0||v.indexOf('return')>=0||v.indexOf('load')>=0?'pickup':'dropoff'}
function normItem(o){o=o||{};var it=gear(o.item||o.gear||o.name||'');if(!it)return null;return{id:o.id||uid(),dir:dir(o.dir||o.type||o.direction||'dropoff'),item:it,qty:Math.max(1,num(o.qty||o.quantity||o.count||1,1)),actual:o.actual||'',done:!!o.done,condition:o.condition||'OK',note:o.note||o.notes||''}}
function normStop(o,i){o=o||{};var raw=[].concat(o.items||[]);(o.pickups||[]).forEach(function(x){x=clone(x);x.dir='pickup';raw.push(x)});(o.dropoffs||[]).forEach(function(x){x=clone(x);x.dir='dropoff';raw.push(x)});return{id:o.id||uid(),name:clean(o.name||o.stop||o.job||o.address||'Stop '+((i||0)+1)),address:clean(o.address||o.location||''),customer_name:clean(o.customer_name||o.customerName||o.customer||''),order_id:clean(o.order_id||o.ticket||o.rt||''),priority:o.priority==='High'?'High':'Normal',isDepot:!!o.isDepot,lat:num(o.lat,0),lng:num(o.lng,0),notes:clean(o.notes||o.instructions||''),items:raw.map(normItem).filter(Boolean),photos:o.photos||[],gate:o.gate||{stage:0,checks:{}},archivedAt:o.archivedAt||null}}
function normInv(r){r=r||{};var it=gear(r.item||r.gear||r.name||'');return it?{item:it,departing:num(r.departing||r.out||r.dropoffs||0,0),returning:num(r.returning||r.in||r.pickups||0,0)}:null}function mergeInv(a){var m={};(a||[]).forEach(function(r){r=normInv(r);if(!r)return;m[r.item]=m[r.item]||{item:r.item,departing:0,returning:0};m[r.item].departing+=r.departing;m[r.item].returning+=r.returning});return Object.keys(m).sort().map(function(k){return m[k]})}
function hydrate(o){return{stops:(o.stops||[]).map(normStop),inventory:mergeInv(o.inventory||o.inventory_summary||[]),ledger:o.ledger||[],routeOrder:o.routeOrder||[],tab:o.tab||'dash',selected:o.selected||null,drive:o.drive||0,day:o.day||{open:false,checks:{},photos:[]}}}function loadState(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.stops)return hydrate(x)}catch(e){}return hydrate(SAMPLE)}function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function stats(){var pu=0,dr=0,ph=0;state.stops.forEach(function(s){ph+=s.photos.length;s.items.forEach(function(i){i.dir==='pickup'?pu+=num(i.qty):dr+=num(i.qty)})});var d=0,r=0;state.inventory.forEach(function(x){d+=x.departing;r+=x.returning});$('stats').innerHTML='<span class=pill>Stops '+state.stops.filter(function(s){return!s.isDepot}).length+'</span><span class="pill do">Drop '+dr+'</span><span class="pill pu">Pick '+pu+'</span><span class=pill>Inv out '+d+'</span><span class=pill>Returning '+r+'</span><span class=pill>Photos '+ph+'</span><span class="pill '+(state.day.open?'pu':'do')+'">Day '+(state.day.open?'OPEN':'LOCKED')+'</span>'}
function render(){if(!state.selected&&state.stops[0])state.selected=state.stops[0].id;stats();document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.tab===state.tab)});$('app').innerHTML=state.tab==='stops'?viewStops():state.tab==='inv'?viewInv():state.tab==='route'?viewRoute():state.tab==='load'?viewLoad():state.tab==='drive'?viewDrive():state.tab==='ledger'?viewLedger():viewDash()}
function viewDash(){var must=calcLoad(ordered()).filter(function(x){return x.loadStart>0});return'<section class=card><h2>Command Dashboard</h2><p class=muted>Clean utility rebuild: manual data → best path → load propagation → gated execution → ledger.</p><div class=grid2><div class=card><b>Best path</b><p>Depot first, pickups favored if useful, then closest address/coordinate cluster.</p></div><div class=card><b>Propagation</b><p>Route order drives load sheet, drive gates, and closeout ledger.</p></div></div></section><section class=card><h2>Load Before Leaving</h2>'+(must.length?table(['item','loadStart','dropoff','pickup','end'],must):'<p class=muted>No starting load required by this route.</p>')+'</section>'}
function viewStops(){var sel=state.stops.find(function(s){return s.id===state.selected})||state.stops[0];return'<div class=grid><section><div class="card row"><button class="btn pri" data-act=add>+ Stop</button><button class=btn data-act=depot>+ Depot</button></div>'+state.stops.map(function(s,i){return'<div class="card '+(s.id===state.selected?'sel':'')+'" data-act=select data-id="'+s.id+'"><b>'+(i+1)+'. '+esc(s.name)+'</b><p class=muted>'+esc(s.address||s.customer_name)+' '+(s.order_id?'· '+esc(s.order_id):'')+'</p>'+s.items.map(function(it){return'<span class="pill '+(it.dir==='pickup'?'pu':'do')+'">'+it.dir+' '+it.qty+' '+esc(it.item)+'</span>'}).join('')+'<div class=row><button class="btn sm" data-act=dup data-id="'+s.id+'">Duplicate</button><button class="btn sm bad" data-act=remove data-id="'+s.id+'">Remove</button></div></div>'}).join('')+'</section><section>'+(sel?editor(sel):'')+'</section></div>'}
function editor(s){return'<div class=card><h2>'+esc(s.name)+'</h2><div class=grid2><input class=input data-edit=name data-id="'+s.id+'" value="'+esc(s.name)+'"><select class=input data-edit=priority data-id="'+s.id+'"><option '+(s.priority==='Normal'?'selected':'')+'>Normal</option><option '+(s.priority==='High'?'selected':'')+'>High</option></select><input class=input data-edit=address data-id="'+s.id+'" value="'+esc(s.address)+'" placeholder=address><input class=input data-edit=customer_name data-id="'+s.id+'" value="'+esc(s.customer_name)+'" placeholder=customer><input class=input data-edit=order_id data-id="'+s.id+'" value="'+esc(s.order_id)+'" placeholder=order><select class=input data-edit=isDepot data-id="'+s.id+'"><option value=false '+(!s.isDepot?'selected':'')+'>Not depot</option><option value=true '+(s.isDepot?'selected':'')+'>Depot</option></select></div><textarea class=input data-edit=notes data-id="'+s.id+'" placeholder=notes>'+esc(s.notes)+'</textarea></div><div class=card><div class=row><h3>Items</h3><button class="btn sm" data-act=addItem data-id="'+s.id+'">+ Item</button><button class="btn sm" data-act=fill data-id="'+s.id+'">Fill Counts</button></div>'+s.items.map(function(it){return itemEditor(s.id,it)}).join('')+'</div>'}
function itemEditor(sid,it){return'<div class=item><select class=input data-item=dir data-id="'+sid+'" data-iid="'+it.id+'"><option '+(it.dir==='dropoff'?'selected':'')+'>dropoff</option><option '+(it.dir==='pickup'?'selected':'')+'>pickup</option></select><select class=input data-item=item data-id="'+sid+'" data-iid="'+it.id+'">'+GEAR.map(function(g){return'<option '+(g===it.item?'selected':'')+'>'+esc(g)+'</option>'}).join('')+'</select><input class=input type=number data-item=qty data-id="'+sid+'" data-iid="'+it.id+'" value="'+esc(it.qty)+'"><input class=input type=number data-item=actual data-id="'+sid+'" data-iid="'+it.id+'" placeholder=actual value="'+esc(it.actual)+'"><select class=input data-item=condition data-id="'+sid+'" data-iid="'+it.id+'">'+['OK','Dirty','Wet','Damaged','Missing'].map(function(c){return'<option '+(c===it.condition?'selected':'')+'>'+c+'</option>'}).join('')+'</select><button class="btn sm bad" data-act=rmItem data-id="'+sid+'" data-iid="'+it.id+'">×</button><label><input type=checkbox data-item=done data-id="'+sid+'" data-iid="'+it.id+'" '+(it.done?'checked':'')+'> Done</label><input class=input data-item=note data-id="'+sid+'" data-iid="'+it.id+'" placeholder=exception-note value="'+esc(it.note)+'"></div>'}
function viewInv(){return'<section class=card><div class=row><h2>Printed Inventory</h2><button class="btn sm" data-act=addInv>+ Row</button></div>'+state.inventory.map(function(r,i){return'<div class=item><input class=input data-inv=item data-i="'+i+'" value="'+esc(r.item)+'"><input class=input type=number data-inv=departing data-i="'+i+'" value="'+r.departing+'"><input class=input type=number data-inv=returning data-i="'+i+'" value="'+r.returning+'"><button class="btn sm bad" data-act=rmInv data-i="'+i+'">×</button></div>'}).join('')+'</section>'+viewLoad()}
function viewRoute(){var os=ordered();return'<section class=card><div class=row><h2>Best Path</h2><button class="btn pri" data-act=opt>Recalculate</button></div><p class=muted>Postulated path: depot first → useful pickups prioritized → shortest address/coordinate cluster → high priority boosted. Manual ↑/↓ still allowed.</p>'+os.map(function(s,i){return'<div class=route><div class=num>'+(i+1)+'</div><div><b>'+esc(s.name)+'</b><p class=muted>'+esc(s.address||s.customer_name)+'</p>'+s.items.map(function(it){return'<span class="pill '+(it.dir==='pickup'?'pu':'do')+'">'+it.dir+' '+it.qty+' '+esc(it.item)+'</span>'}).join('')+'</div><div><button class="btn sm" data-act=up data-id="'+s.id+'">↑</button><button class="btn sm" data-act=down data-id="'+s.id+'">↓</button></div></div>'}).join('')+'</section>'+viewLoad()}
function viewLoad(){return'<section class=card><h2>Load Propagation</h2><p class=muted>Calculated from current route order.</p>'+table(['item','loadStart','dropoff','pickup','end','printedDeparting','printedReturning','delta'],calcLoad(ordered()))+'</section>'}
function viewDrive(){if(!state.day.open)return dayGate();var os=ordered(),s=os[state.drive]||os[0];return s?stopGate(s,os):'<section class=card>No stops.</section>'}
function dayGate(){var done=DAY.every(function(x){return state.day.checks[x]})&&state.day.photos.length>0;return'<section class="card gate"><h2>⓪ Start-of-Day Gate</h2><p class=muted>Drive stays locked until load, route, safety, and truck photo are complete.</p>'+DAY.map(function(x){return'<label class=check><input type=checkbox data-day="'+esc(x)+'" '+(state.day.checks[x]?'checked':'')+'><span>'+esc(x)+'</span><b>'+(state.day.checks[x]?'✓':'LOCK')+'</b></label>'}).join('')+'<div class=card>Truck/load photos: '+state.day.photos.length+'</div><div class=row><button class="btn pri" data-act=dayPhoto>Add Truck Photo</button><button class="btn ok" data-act=unlock '+(done?'':'disabled')+'>Unlock Stop Gates</button><button class=btn data-tab=load>Review Load</button></div></section>'+viewLoad()}
function stageBar(s){var st=s.gate.stage||0;return'<div class=stage>'+STG.map(function(x,i){return'<span class="'+(i<st?'done':i===st?'now':'')+'">'+(i+1)+' '+x+'</span>'}).join('')+'</div>'}
function arrivalDone(s){return ARR.every(function(x){return s.gate.checks[x]})}function workDone(s){return !s.items.length||s.items.every(function(i){return i.done&&clean(i.actual)!==''})}function badItems(s){return s.items.filter(function(i){return(clean(i.actual)!==''&&num(i.actual)!==num(i.qty))||i.condition!=='OK'})}function exceptionDone(s){var b=badItems(s);return b.length?b.every(function(i){return clean(i.note)})&&s.gate.checks.exceptionsReviewed:s.gate.checks.noExceptions}function proofDone(s){return s.photos.length>0&&s.gate.checks.finalScan}function gateDone(s){var st=s.gate.stage||0;return st===0?arrivalDone(s):st===1?workDone(s):st===2?exceptionDone(s):st===3?proofDone(s):!!s.archivedAt}
function blockers(s){var st=s.gate.stage||0;if(st===0)return ARR.filter(function(x){return!s.gate.checks[x]}).map(function(x){return'Missing arrival check: '+x});if(st===1)return s.items.filter(function(i){return!i.done||clean(i.actual)===''}).map(function(i){return'Finish item: '+i.item});if(st===2){var out=[],b=badItems(s);if(b.length)b.forEach(function(i){if(!clean(i.note))out.push('Exception note required: '+i.item)});else if(!s.gate.checks.noExceptions)out.push('Check no exceptions found.');if(b.length&&!s.gate.checks.exceptionsReviewed)out.push('Exception review required.');return out}if(st===3){var o=[];if(!s.photos.length)o.push('Proof photo missing.');if(!s.gate.checks.finalScan)o.push('Final scan missing.');return o}return s.archivedAt?[]:['Archive before next stop.']}
function stopGate(s,os){var st=s.gate.stage||0,body='';if(st===0)body='<h3>① Arrival Gate</h3>'+ARR.map(function(x){return'<label class=check><input type=checkbox data-gcheck="'+esc(x)+'" data-id="'+s.id+'" '+(s.gate.checks[x]?'checked':'')+'><span>'+esc(x)+'</span><b>'+(s.gate.checks[x]?'✓':'LOCK')+'</b></label>'}).join('');if(st===1)body='<h3>② Work-Item Gate</h3>'+s.items.map(function(i){return'<div class=card><b>'+i.dir+' '+i.qty+' '+esc(i.item)+'</b><div class=row><input class=input style="max-width:120px" type=number data-drive=actual data-id="'+s.id+'" data-iid="'+i.id+'" value="'+esc(i.actual)+'" placeholder=actual><select class=input style="max-width:150px" data-drive=condition data-id="'+s.id+'" data-iid="'+i.id+'">'+['OK','Dirty','Wet','Damaged','Missing'].map(function(c){return'<option '+(c===i.condition?'selected':'')+'>'+c+'</option>'}).join('')+'</select><label class=pill><input type=checkbox data-drive=done data-id="'+s.id+'" data-iid="'+i.id+'" '+(i.done?'checked':'')+'> Done</label></div></div>'}).join('');if(st===2){var bad=badItems(s);body='<h3>③ Exception Gate</h3>'+(bad.length?bad.map(function(i){return'<label>'+esc(i.item)+' exception note<textarea class=input data-drive=note data-id="'+s.id+'" data-iid="'+i.id+'">'+esc(i.note)+'</textarea></label>'}).join('')+'<label class=check><input type=checkbox data-gcheck=exceptionsReviewed data-id="'+s.id+'" '+(s.gate.checks.exceptionsReviewed?'checked':'')+'><span>Exceptions reviewed / manager-ready</span><b>LOCK</b></label>':'<label class=check><input type=checkbox data-gcheck=noExceptions data-id="'+s.id+'" '+(s.gate.checks.noExceptions?'checked':'')+'><span>No mismatches, missing, dirty, wet, or damaged items found</span><b>LOCK</b></label>')}if(st===3)body='<h3>④ Proof Gate</h3><div class=card>Proof photos: '+s.photos.length+'</div><button class="btn pri" data-act=photo data-id="'+s.id+'">Add Proof Photo</button><label class=check><input type=checkbox data-gcheck=finalScan data-id="'+s.id+'" '+(s.gate.checks.finalScan?'checked':'')+'><span>Final visual scan: nothing forgotten, unsafe, or blocking access</span><b>LOCK</b></label>';if(st===4)body='<h3>⑤ Archive Gate</h3><button class="btn ok" data-act=archive data-id="'+s.id+'">Archive Finished Job</button>';var can=gateDone(s);return'<section class="card gate"><p class=muted>Stop '+(state.drive+1)+' / '+os.length+'</p><h2>'+esc(s.name)+'</h2><p>'+esc(s.address)+' '+esc(s.notes)+'</p>'+stageBar(s)+body+'<div class=row><button class=btn data-act=prev>Back Stop</button><button class="btn '+(can?'ok':'warn')+'" data-act=advance data-id="'+s.id+'">Complete Gate</button><button class="btn pri" data-act=next>Next Stop</button></div>'+(can?'':'<div class="card bad">'+blockers(s).map(esc).join('<br>')+'</div>')+'</section>'}
function viewLedger(){return'<section class=card><h2>Ledger</h2>'+(!state.ledger.length?'<p class=muted>No archived jobs yet.</p>':state.ledger.map(function(l){return'<details class=card><summary><b>'+esc(l.name)+'</b> — '+esc(l.archivedAt)+'</summary>'+table(['dir','item','qty','actual','condition'],l.items||[])+'</details>'}).join(''))+'</section>'}
function table(h,rows){return'<div class=scroll><table><tr>'+h.map(function(x){return'<th>'+esc(x)+'</th>'}).join('')+'</tr>'+rows.map(function(r){return'<tr>'+h.map(function(x){return'<td>'+esc(r[x]==null?'':r[x])+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>'}
function addr(s){var m=(s.address||s.name||'').match(/\d{2,5}/);return m?Number(m[0]):(s.isDepot?-1:999999)}function hasC(s){return s.lat&&s.lng}function miles(a,b){var R=3958.8,rad=Math.PI/180,dlat=(b.lat-a.lat)*rad,dlng=(b.lng-a.lng)*rad,la1=a.lat*rad,la2=b.lat*rad,h=Math.sin(dlat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dlng/2)**2;return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}function pd(a,b){if(hasC(a)&&hasC(b))return miles(a,b);return Math.min(50,Math.abs(addr(a)-addr(b))/250)}function pickupUtility(s,fut){var m={},u=0;s.items.forEach(function(i){if(i.dir==='pickup')m[i.item]=(m[i.item]||0)+num(i.qty)});fut.forEach(function(x){x.items.forEach(function(i){if(i.dir==='dropoff'&&m[i.item])u+=Math.min(m[i.item],num(i.qty))})});return u}
function computeOrder(){var depot=Math.max(0,state.stops.findIndex(function(s){return s.isDepot})),rem=state.stops.map(function(s,i){return i}).filter(function(i){return i!==depot}),ord=[depot];while(rem.length){var cur=state.stops[ord[ord.length-1]],best=0,score=1e9;rem.forEach(function(idx,pos){var fut=rem.filter(function(x){return x!==idx}).map(function(x){return state.stops[x]}),sc=pd(cur,state.stops[idx]);if(pickupUtility(state.stops[idx],fut)>0)sc*=.72;if(state.stops[idx].items.some(function(i){return i.dir==='pickup'}))sc*=.9;if(state.stops[idx].priority==='High')sc*=.85;if(sc<score){score=sc;best=pos}});ord.push(rem.splice(best,1)[0])}return ord}function ordered(){if(!state.routeOrder.length)state.routeOrder=computeOrder();return state.routeOrder.map(function(i){return state.stops[i]}).filter(Boolean)}function optimize(){state.routeOrder=computeOrder();state.drive=0;state.tab='route';save();render()}function calcLoad(stops){var run={},need={},tot={};function rec(k){return tot[k]||(tot[k]={item:k,loadStart:0,dropoff:0,pickup:0,end:0,printedDeparting:'',printedReturning:'',delta:''})}stops.forEach(function(s){s.items.forEach(function(i){var r=rec(i.item);if(i.dir==='pickup'){run[i.item]=(run[i.item]||0)+num(i.qty);r.pickup+=num(i.qty)}else{run[i.item]=(run[i.item]||0)-num(i.qty);r.dropoff+=num(i.qty);if(run[i.item]<0){need[i.item]=(need[i.item]||0)-run[i.item];run[i.item]=0}}})});Object.keys(need).forEach(function(k){rec(k).loadStart=need[k];rec(k).end=need[k]});stops.forEach(function(s){s.items.forEach(function(i){rec(i.item).end+=i.dir==='pickup'?num(i.qty):-num(i.qty)})});state.inventory.forEach(function(r){var row=rec(r.item);row.printedDeparting=r.departing;row.printedReturning=r.returning;row.delta=r.departing-row.loadStart});return Object.keys(tot).sort().map(function(k){return tot[k]})}
function importObj(x){if(typeof x==='string')x=JSON.parse(x.replace(/```json/gi,'').replace(/```/g,'').trim());return{stops:(x.stops||x.jobs||x.orders||[]).map(normStop),inventory:mergeInv(x.inventory_summary||x.inventory||[])}}function parseCSV(t){var rows=[],row=[],cell='',q=false;for(var i=0;i<t.length;i++){var ch=t[i],nx=t[i+1];if(ch==='"'&&q&&nx==='"'){cell+='"';i++;continue}if(ch==='"'){q=!q;continue}if(ch===','&&!q){row.push(cell);cell='';continue}if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&nx==='\n')i++;row.push(cell);cell='';if(row.some(clean))rows.push(row);row=[];continue}cell+=ch}row.push(cell);if(row.some(clean))rows.push(row);var h=(rows.shift()||[]).map(function(x){return clean(x).toLowerCase()});return rows.map(function(r){var o={};h.forEach(function(k,i){o[k]=clean(r[i]||'')});return o})}function csvPayload(rows){var map={};rows.forEach(function(r,i){var k=clean(r.name||r.stop||r.job||r.address);if(k){map[k]=map[k]||normStop(r,i);if(r.item||r.gear){var it=normItem({dir:r.dir||r.direction,item:r.item||r.gear,qty:r.qty||r.quantity});if(it)map[k].items.push(it)}}});return{stops:Object.keys(map).map(function(k){return map[k]}),inventory:mergeInv(rows.map(function(r){return{item:r.item||r.gear||r.name,departing:r.departing,returning:r.returning}}))}}
function preview(p,src){window.pending=p;modal('<h2>Preview '+esc(src)+'</h2><p>'+p.stops.length+' stops · '+p.inventory.length+' inventory rows</p><div class=row><button class="btn ok" data-act=applyR>Replace</button><button class="btn pri" data-act=applyA>Append/Merge</button><button class=btn data-act=close>Cancel</button></div>')}function apply(mode){var p=window.pending||{stops:[],inventory:[]};if(mode==='replace'){if(p.stops.length)state.stops=p.stops;if(p.inventory.length)state.inventory=p.inventory;state.day={open:false,checks:{},photos:[]};state.ledger=[]}else{state.stops=state.stops.concat(p.stops);state.inventory=mergeInv(state.inventory.concat(p.inventory))}state.routeOrder=[];state.routeOrder=computeOrder();state.tab='route';close();save();render()}function modal(x){$('modal').innerHTML='<div class=modal><div class=box><button class="btn sm" style="float:right" data-act=close>×</button>'+x+'</div></div>'}function close(){$('modal').innerHTML=''}function toast(x){$('toast').innerHTML='<div class=card>'+esc(x)+'</div>';setTimeout(function(){$('toast').innerHTML=''},2600)}function find(id){return state.stops.find(function(s){return s.id===id})}function photos(id,day){var input=document.createElement('input');input.type='file';input.accept='image/*';input.multiple=true;input.onchange=function(){[].slice.call(input.files||[]).forEach(function(f){var r={name:f.name,time:new Date().toISOString()};if(day)state.day.photos.push(r);else find(id).photos.push(r)});save();render()};input.click()}function archive(id){var s=find(id);if(!proofDone(s)){toast('Proof gate is not done');return}s.archivedAt=new Date().toISOString();state.ledger.unshift({name:s.name,address:s.address,archivedAt:s.archivedAt,items:JSON.parse(JSON.stringify(s.items)),photos:s.photos.length});save();render()}
function runTests(){var rows=[];function ok(n,c,d){rows.push({test:n,result:c?'PASS':'FAIL',detail:d||''})}var p=importObj(SAMPLE);ok('sample stops',p.stops.length===4,p.stops.length);ok('inventory rows',p.inventory.length===3,p.inventory.length);ok('best path len',computeOrder().length===state.stops.length,computeOrder().length);ok('load calc rows',calcLoad(ordered()).length>0);var s=normStop({name:'Gate',items:[{dir:'dropoff',item:'Loungers',qty:1,actual:'1',done:true}]});ARR.forEach(function(x){s.gate.checks[x]=true});s.gate.checks.noExceptions=true;s.gate.checks.finalScan=true;s.photos=[{}];ok('arrival gate',arrivalDone(s));ok('work gate',workDone(s));ok('exception gate',exceptionDone(s));ok('proof gate',proofDone(s));modal('<h2>Tests</h2>'+table(['test','result','detail'],rows))}
document.addEventListener('click',function(e){var b=e.target.closest('[data-act],[data-tab]');if(!b)return;var a=b.dataset.act,id=b.dataset.id;if(b.dataset.tab){state.tab=b.dataset.tab;save();render();return}if(a==='upload')$('file').click();if(a==='paste')modal('<h2>Paste JSON</h2><textarea id=paste class="input"></textarea><button class="btn ok" data-act=pasteGo>Preview</button><button class=btn data-act=example>Example</button>');if(a==='pasteGo')preview(importObj($('paste').value),'paste');if(a==='example')$('paste').value=JSON.stringify(SAMPLE,null,2);if(a==='schema')modal('<h2>Schema</h2><textarea class="input">'+esc(JSON.stringify(SAMPLE,null,2))+'</textarea>');if(a==='applyR')apply('replace');if(a==='applyA')apply('append');if(a==='close')close();if(a==='add'){var s=normStop({name:'New Stop '+(state.stops.length+1)});state.stops.push(s);state.selected=s.id;state.routeOrder=[];save();render()}if(a==='depot'){var d=normStop({name:'Shop / Depot',isDepot:true,address:'Depot'});state.stops.unshift(d);state.selected=d.id;state.routeOrder=[];save();render()}if(a==='remove'){state.stops=state.stops.filter(function(s){return s.id!==id});state.selected=state.stops[0]&&state.stops[0].id;state.routeOrder=[];save();render()}if(a==='dup'){var c=normStop(JSON.parse(JSON.stringify(find(id))));c.id=uid();c.name+=' Copy';state.stops.push(c);state.selected=c.id;state.routeOrder=[];save();render()}if(a==='select'){state.selected=id;state.tab='stops';save();render()}if(a==='addItem'){find(id).items.push(normItem({dir:'dropoff',item:'Loungers',qty:1}));state.routeOrder=[];save();render()}if(a==='rmItem'){var st=find(id);st.items=st.items.filter(function(i){return i.id!==b.dataset.iid});state.routeOrder=[];save();render()}if(a==='fill'){find(id).items.forEach(function(i){i.actual=i.actual||String(i.qty);i.done=true});save();render()}if(a==='addInv'){state.inventory.push({item:'Loungers',departing:0,returning:0});save();render()}if(a==='rmInv'){state.inventory.splice(Number(b.dataset.i),1);save();render()}if(a==='opt')optimize();if(a==='up'||a==='down')move(id,a==='up'?-1:1);if(a==='dayPhoto')photos(null,true);if(a==='unlock'){state.day.open=true;state.tab='drive';save();render()}if(a==='photo')photos(id,false);if(a==='advance'){var gs=find(id);if(!gateDone(gs)){modal('<h2>Gate blocked</h2><ul>'+blockers(gs).map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul>');return}if((gs.gate.stage||0)<4)gs.gate.stage++;save();render()}if(a==='archive')archive(id);if(a==='prev'){state.drive=Math.max(0,state.drive-1);save();render()}if(a==='next'){var cur=ordered()[state.drive];if(!cur.archivedAt){toast('Archive current stop first');return}state.drive=Math.min(ordered().length-1,state.drive+1);save();render()}if(a==='tests')runTests();if(a==='backup'){var blob=JSON.stringify({schema:'routeops.utility.v1',stops:state.stops,inventory_summary:state.inventory,ledger:state.ledger},null,2);var link=document.createElement('a');link.href=URL.createObjectURL(new Blob([blob],{type:'application/json'}));link.download='routeops-backup.json';link.click()}if(a==='reset'){localStorage.removeItem(KEY);state=hydrate(SAMPLE);save();render()}});
document.addEventListener('change',function(e){var el=e.target;if(el.id==='file'){var f=el.files[0];if(f)f.text().then(function(t){preview(/^\s*[\[{]/.test(t)?importObj(t):csvPayload(parseCSV(t)),f.name)}).catch(function(err){modal('<h2>Import failed</h2><p>'+esc(err.message)+'</p>')});el.value=''}if(el.dataset.edit){var s=find(el.dataset.id),f2=el.dataset.edit;s[f2]=f2==='isDepot'?el.value==='true':el.value;state.routeOrder=[];save();render()}if(el.dataset.item){var si=find(el.dataset.id),it=si.items.find(function(i){return i.id===el.dataset.iid}),fi=el.dataset.item;it[fi]=fi==='done'?el.checked:(fi==='qty'?num(el.value,1):el.value);if(fi==='item')it.item=gear(it.item);state.routeOrder=[];save();render()}if(el.dataset.inv){var r=state.inventory[Number(el.dataset.i)];r[el.dataset.inv]=el.dataset.inv==='item'?gear(el.value):num(el.value,0);save();render()}if(el.dataset.day){state.day.checks[el.dataset.day]=el.checked;save();render()}if(el.dataset.gcheck){find(el.dataset.id).gate.checks[el.dataset.gcheck]=el.checked;save();render()}if(el.dataset.drive){var ds=find(el.dataset.id),di=ds.items.find(function(i){return i.id===el.dataset.iid}),df=el.dataset.drive;di[df]=df==='done'?el.checked:el.value;save();render()}});
function move(id,d){if(!state.routeOrder.length)state.routeOrder=computeOrder();var ix=state.routeOrder.findIndex(function(i){return state.stops[i]&&state.stops[i].id===id});if(ix<0)return;var ni=Math.max(0,Math.min(state.routeOrder.length-1,ix+d)),tmp=state.routeOrder[ix];state.routeOrder[ix]=state.routeOrder[ni];state.routeOrder[ni]=tmp;save();render()}window.RouteOpsUtil={state:state,computeOrder:computeOrder,calcLoad:calcLoad,tests:runTests};render();})();
