</style></head><body><header class=top><div class=topin><div class=brand><div class=mark>RO</div><div><h1>RouteOps</h1><p>route propagation fixed</p></div></div><div class=row><button class="btn primary" data-act=build>Build Route</button><button class=btn data-act=add>+ Stop</button></div></div></header><main class=wrap><section class=card><div id=stats class=row></div></section><section class="card row"><input id=file class=hidden type=file accept=".json,.csv,application/json,text/csv"><button class="btn success" data-act=upload>Upload JSON/CSV</button><button class="btn primary" data-tab=ocr>OCR → Panels</button><button class=btn data-act=paste>Paste JSON</button><button class=btn data-tab=stops>Stops</button><button class=btn data-tab=route>Route</button><button class=btn data-tab=load>Load Sheet</button><button class=btn data-tab=drive>Drive</button><button class=btn data-act=tests>Tests</button><button class=btn data-act=backup>Backup</button><button class="btn danger" data-act=reset>Reset</button></section><div id=app></div></main><div id=modal></div><div id=toast class=toast></div><script>
(function(){'use strict';

var SAMPLE={stops:[{name:'Shop / Depot',isDepot:true,address:'0 Depot',items:[]},{name:'Coral Sands 306',address:'426 S Fletcher Ave',items:[{dir:'dropoff',item:'Loungers',qty:3},{dir:'dropoff',item:'Umbrella Anchor',qty:1},{dir:'dropoff',item:'Umbrellas Stay Better Vacations',qty:1},{dir:'dropoff',item:'Slipcovers Stay Better Vacations',qty:3}]},{name:'2185 S Fletcher Ave',address:'2185 S Fletcher Ave',items:[{dir:'dropoff',item:'Loungers',qty:2},{dir:'dropoff',item:'Umbrella Tables',qty:1},{dir:'dropoff',item:'Umbrella Anchor',qty:1},{dir:'dropoff',item:'Umbrellas ERA Fernandina',qty:1},{dir:'dropoff',item:'Slipcovers ERA Fernandina',qty:2}]},{name:'Amelia South M',address:'3350 S Fletcher Ave',items:[{dir:'dropoff',item:'Body Boards',qty:2},{dir:'dropoff',item:'Loungers',qty:3},{dir:'dropoff',item:'Skim Boards',qty:1},{dir:'dropoff',item:'Slipcovers Stay Better Vacations',qty:3}]},{name:'Amelia South E',address:'3350 S Fletcher Ave',items:[{dir:'dropoff',item:'Loungers',qty:2},{dir:'dropoff',item:'Umbrella Anchor',qty:1},{dir:'dropoff',item:'Umbrellas Stay Better Vacations',qty:1},{dir:'dropoff',item:'Slipcovers Stay Better Vacations',qty:2}]}],inventory_summary:[],ledger:[]};
var state=load(),ocr={files:[],text:'',parsed:{schema:'routeops.v21',stops:[],inventory_summary:[],extraction_report:{}},checks:{},status:'Ready.',progress:0};
function $(id){return document.getElementById(id)}function clean(v){return String(v==null?'':v).trim().replace(/[–—~=_]+/g,' - ').replace(/\s+/g,' ')}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function num(v,d){v=Number(String(v).replace(/[^0-9.-]/g,''));return Number.isFinite(v)?v:(d||0)}function uid(){return Math.random().toString(36).slice(2,10)}function cp(o){return JSON.parse(JSON.stringify(o||{}))}
function nt(s){return clean(s).toLowerCase().replace(/551|5si/g,'ssi').replace(/\bslip\s*covers\b/g,'slipcovers').replace(/stay better vacat\w*/g,'stay better vacations').replace(/fernandina beach realty and amelia vacations/g,'era fernandina').replace(/[^a-z0-9# ]+/g,' ').replace(/\s+/g,' ').trim()}function gear(v){var s=clean(v),l=nt(s),best=s,score=0;if(!s)return'';GEAR.forEach(function(g){var gl=nt(g);if(gl===l){best=g;score=99}else{var toks=gl.split(/\s+/).filter(function(t){return t.length>2}),hit=0;toks.forEach(function(t){if(l.indexOf(t)>=0)hit++});var sc=hit/Math.max(1,toks.length)+(l.indexOf(gl)>=0?1:0);if(sc>score&&hit){score=sc;best=g}}});return score>=.34?best:s}
function normItem(o){if(!o)return null;var it=gear(o.item||o.gear||o.name||'');if(!it)return null;var d=clean(o.dir||o.type||'dropoff').toLowerCase();return{id:o.id||uid(),dir:d.indexOf('pick')>=0||d.indexOf('return')>=0?'pickup':'dropoff',item:it,qty:Math.max(1,num(o.qty||o.quantity||o.count||1,1)),actual:o.actual||'',done:!!o.done}}
function normStop(o,i){o=o||{};var items=[].concat(o.items||[],(o.pickups||[]).map(function(x){x=cp(x);x.dir='pickup';return x}),(o.dropoffs||[]).map(function(x){x=cp(x);x.dir='dropoff';return x})).map(normItem).filter(Boolean);return{id:o.id||uid(),name:clean(o.name||o.stop||o.job||o.address||'Stop '+((i||0)+1)),address:clean(o.address||o.location||''),customer_name:clean(o.customer_name||o.customerName||''),order_id:clean(o.order_id||o.ticket||''),isDepot:!!o.isDepot,notes:clean(o.notes||''),items:items,photos:o.photos||[]}}
function normInv(r){if(!r)return null;var it=gear(r.item||r.gear||r.name||'');return it?{item:it,departing:num(r.departing||r.dropoffs||r.out||0,0),returning:num(r.returning||r.pickups||r.in||0,0)}:null}function mergeInv(rows){var m={};(rows||[]).forEach(function(r){r=normInv(r);if(!r)return;m[r.item]=m[r.item]||{item:r.item,departing:0,returning:0};m[r.item].departing+=r.departing;m[r.item].returning+=r.returning});return Object.keys(m).sort().map(function(k){return m[k]})}
function hydrate(o){return{stops:(o.stops||[]).map(normStop),inventory:mergeInv(o.inventory||o.inventory_summary||[]),routeOrder:o.routeOrder||[],selectedId:o.selectedId||null,tab:o.tab||'stops',driveIndex:o.driveIndex||0,ledger:o.ledger||[]}}function load(){try{var raw=JSON.parse(localStorage.getItem(STORE)||'null');if(raw&&raw.stops)return hydrate(raw)}catch(e){}return hydrate(SAMPLE)}function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function addrNum(s){var m=(s.address||s.name||'').match(/\b(\d{2,5})\b/);return m?Number(m[1]):s.isDepot?-1:999999}function computeRoute(stops){var a=(stops||state.stops).map(function(s,i){return{i:i,s:s}});a.sort(function(x,y){return (x.s.isDepot?-1:addrNum(x.s))-(y.s.isDepot?-1:addrNum(y.s))||x.s.name.localeCompare(y.s.name)});return a.map(function(x){return x.i})}function propagate(tab){state.routeOrder=computeRoute(state.stops);state.driveIndex=0;if(!state.selectedId&&state.stops[0])state.selectedId=state.stops[0].id;if(tab)state.tab=tab;save()}function ordered(){if(!state.routeOrder.length)propagate();return state.routeOrder.map(function(i){return state.stops[i]}).filter(Boolean)}
function totals(rows){var d=0,r=0;(rows||[]).forEach(function(x){d+=num(x.departing);r+=num(x.returning)});return{d:d,r:r,n:d-r}}function itemRows(stops){var m={};(stops||[]).forEach(function(s){s.items.forEach(function(i){m[i.item]=m[i.item]||{item:i.item,dropoff:0,pickup:0,net:0};if(i.dir==='pickup')m[i.item].pickup+=num(i.qty);else m[i.item].dropoff+=num(i.qty);m[i.item].net=m[i.item].dropoff-m[i.item].pickup})});return Object.keys(m).sort().map(function(k){return m[k]})}function table(h,rows){return'<div class=scroll><table><tr>'+h.map(function(x){return'<th>'+esc(x)+'</th>'}).join('')+'</tr>'+rows.map(function(r){return'<tr>'+h.map(function(x){return'<td>'+esc(r[x]??'')+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>'}
function invBox(rows,title){var t=totals(rows);return'<div class=card><h2>'+esc(title)+'</h2><div class=grid3><div class=stat><span class=muted>Drop-offs</span><b>'+t.d+'</b></div><div class=stat><span class=muted>Returning</span><b>'+t.r+'</b></div><div class=stat><span class=muted>Net</span><b>'+t.n+'</b></div></div>'+table(['Item','Drop-offs','Returning','Net'],(rows||[]).map(function(r){return{Item:r.item,'Drop-offs':r.departing,Returning:r.returning,Net:r.departing-r.returning}}))+'</div>'}
function nonPack(stops,title){var rows=itemRows(stops).map(function(r){return{Item:r.item,'Non-pack Drop-offs':r.dropoff,'Route Returns':r.pickup,'Net Needed':r.net}}),d=0,p=0;rows.forEach(function(r){d+=r['Non-pack Drop-offs'];p+=r['Route Returns']});return'<div class="card nonpack"><h2>'+esc(title)+'</h2><div class=grid3><div class=stat><span class=muted>Drop-offs</span><b>'+d+'</b></div><div class=stat><span class=muted>Returns</span><b>'+p+'</b></div><div class=stat><span class=muted>Net needed</span><b>'+(d-p)+'</b></div></div>'+table(['Item','Non-pack Drop-offs','Route Returns','Net Needed'],rows)+'</div>'}
function routeMath(stops){var order=computeRoute(stops),os=order.map(function(i){return stops[i]}).filter(Boolean),groups={},moves=[];os.forEach(function(s){var k=(s.address||s.name).replace(/\b(unit|#)\s*[a-z0-9]+/ig,'').toLowerCase();groups[k]=groups[k]||[];groups[k].push(s)});Object.keys(groups).forEach(function(k){if(groups[k].length>1)moves.push('Bundle same-property stops: '+groups[k].map(function(s){return s.name}).join(' + '))});if(!os.some(function(s){return s.items.some(function(i){return i.dir==='pickup'})}))moves.push('No pickup/load items found; load all drop-offs at shop.');return'<div class="card move"><h2>Routing Math</h2><p class=muted>This exact order propagates after import.</p>'+table(['Order','Stop','Address','Pieces'],os.map(function(s,i){return{Order:i+1,Stop:s.name,Address:s.address,Pieces:s.items.reduce(function(a,b){return a+num(b.qty)},0)}}))+'<ul>'+moves.map(function(m){return'<li>'+esc(m)+'</li>'}).join('')+'</ul></div>'}
function checkRows(){var out=[];(ocr.parsed.inventory_summary||[]).forEach(function(r){out.push({key:'D|'+r.item,label:'Drop-off/departing',item:r.item,qty:r.departing});out.push({key:'R|'+r.item,label:'Returning/pickup',item:r.item,qty:r.returning})});return out}function checkOk(){var r=checkRows();return !r.length||r.every(function(x){return ocr.checks[x.key]})}function checks(){var r=checkRows(),done=r.filter(function(x){return ocr.checks[x.key]}).length;if(!r.length)return'<div class="card gate"><b>No inventory checklist.</b><p class=muted>Stop-only import is allowed.</p></div>';return'<div class="card '+(done===r.length?'ok':'gate')+'"><div class=row><h2 style="margin-right:auto">Mandatory Inventory Checklist</h2><span class=pill>'+done+'/'+r.length+'</span><button class="btn success" data-act=checkall>Check all</button><button class=btn data-act=clearchecks>Clear</button></div>'+r.map(function(x){return'<label class=check><input type=checkbox data-ocheck="'+esc(x.key)+'" '+(ocr.checks[x.key]?'checked':'')+'><span><b>'+esc(x.label)+'</b><br>'+esc(x.item)+'</span><b>'+x.qty+'</b></label>'}).join('')+'</div>'}
function stats(){var t=totals(state.inventory);return'<span class=pill>Stops '+state.stops.filter(function(s){return !s.isDepot}).length+'</span><span class=pill>Route '+ordered().length+'</span><span class=pill>Inv drop '+t.d+'</span><span class=pill>Inv return '+t.r+'</span><span class=pill>Non-pack '+itemRows(state.stops).reduce(function(a,b){return a+b.dropoff},0)+'</span>'}function render(){if(!state.selectedId&&state.stops[0])state.selectedId=state.stops[0].id;$('stats').innerHTML=stats();document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.tab===state.tab)});$('app').innerHTML=state.tab==='ocr'?viewOCR():state.tab==='route'?viewRoute():state.tab==='load'?viewLoad():state.tab==='drive'?viewDrive():viewStops()}
function viewStops(){var sel=state.stops.find(function(s){return s.id===state.selectedId})||state.stops[0];return'<div class=grid><section>'+state.stops.map(function(s,i){return'<div class="card stop '+(s.id===state.selectedId?'sel':'')+'" data-act=select data-id="'+s.id+'"><b>'+(i+1)+'. '+esc(s.name)+'</b><p class=muted>'+esc(s.address||s.customer_name)+'</p>'+s.items.map(function(it){return'<span class="pill '+(it.dir==='pickup'?'pick':'drop')+'">'+it.qty+' '+esc(it.item)+'</span>'}).join('')+'<div class=row><button class=btn data-act=dup data-id="'+s.id+'">Duplicate</button><button class="btn danger" data-act=remove data-id="'+s.id+'">Remove</button></div></div>'}).join('')+'</section><section>'+(sel?editor(sel):'')+'</section></div>'}function editor(s){return'<div class=card><h2>'+esc(s.name)+'</h2><label>Name<input class=input data-edit=name data-id="'+s.id+'" value="'+esc(s.name)+'"></label><label>Address<input class=input data-edit=address data-id="'+s.id+'" value="'+esc(s.address)+'"></label><label>Notes<textarea class=input data-edit=notes data-id="'+s.id+'">'+esc(s.notes)+'</textarea></label></div><div class=card><h3>Gear</h3><button class=btn data-act=additem data-id="'+s.id+'">+ Gear</button>'+s.items.map(function(it){return'<div class=itemrow><select class=input data-item=dir data-id="'+s.id+'" data-iid="'+it.id+'"><option value=dropoff '+(it.dir==='dropoff'?'selected':'')+'>drop-off</option><option value=pickup '+(it.dir==='pickup'?'selected':'')+'>return/pickup</option></select><select class=input data-item=item data-id="'+s.id+'" data-iid="'+it.id+'">'+GEAR.map(function(g){return'<option '+(g===it.item?'selected':'')+'>'+esc(g)+'</option>'}).join('')+'</select><input class=input type=number data-item=qty data-id="'+s.id+'" data-iid="'+it.id+'" value="'+it.qty+'"><button class="btn danger" data-act=rmitem data-id="'+s.id+'" data-iid="'+it.id+'">×</button></div>'}).join('')+'</div>'}
function viewRoute(){var os=ordered();return'<section class=card><h2>Route Order</h2><p class=muted>Propagated route order from imported stops.</p>'+os.map(function(s,i){return'<div class=route><div class=num>'+(i+1)+'</div><div><b>'+esc(s.name)+'</b><p class=muted>'+esc(s.address||'')+'</p>'+s.items.map(function(it){return'<span class="pill '+(it.dir==='pickup'?'pick':'drop')+'">'+it.qty+' '+esc(it.item)+'</span>'}).join('')+'</div><button class=btn data-act=editroute data-id="'+s.id+'">Edit</button></div>'}).join('')+'</section>'+routeMath(os)}function viewLoad(){return invBox(state.inventory,'Printed Inventory')+nonPack(ordered(),'Non-Pack List From Propagated Route')+table(['item','dropoff','pickup','net'],itemRows(ordered()))}function viewDrive(){var os=ordered();return'<div class=card><h2>Drive Mode</h2><p class=muted>Uses propagated route.</p>'+os.map(function(s,i){return'<div class=route><div class=num>'+(i+1)+'</div><div><b>'+esc(s.name)+'</b><p class=muted>'+esc(s.address)+'</p></div></div>'}).join('')+'</div>'}
