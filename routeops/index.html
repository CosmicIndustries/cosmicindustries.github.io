<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RouteOps Tested</title><style>
body{margin:0;background:#0f172a;color:#f8fafc;font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}.wrap{max-width:1100px;margin:auto;padding:12px}.card{background:#1f2937;border:1px solid #475569;border-radius:12px;padding:12px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#273449;color:#f8fafc;border:1px solid #64748b;border-radius:10px;padding:10px;font-weight:800}.pri{background:#2563eb}.ok{background:#15803d}.bad{background:#991b1b}.warn{background:#b45309}.inp{width:100%;min-height:40px;background:#111827;color:#f8fafc;border:1px solid #64748b;border-radius:8px;padding:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#334155;margin:2px;font-size:12px}.pu{background:#14532d}.do{background:#7f1d1d}.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:12px;z-index:9}.box{max-width:900px;width:100%;max-height:90vh;overflow:auto;background:#1f2937;border:1px solid #64748b;border-radius:12px;padding:14px}table{width:100%;border-collapse:collapse}td,th{border-top:1px solid #475569;padding:7px;text-align:left}.side{display:grid;grid-template-columns:320px 1fr;gap:12px}@media(max-width:800px){.grid,.side{grid-template-columns:1fr}.btn{flex:1 1 120px}}.mut{color:#cbd5e1}.testpass{color:#86efac}.testfail{color:#fecaca}</style></head><body><div class="wrap"><h1>RouteOps Work Board</h1><p class="mut">Dry-tested import core · full-page OCR contract · printed inventory table.</p><div class="card row"><input id="file" type="file" accept=".json,.csv" hidden><input id="ocr" type="file" accept="image/*" multiple hidden><button class="btn ok" onclick="file.click()">Upload JSON/CSV</button><button class="btn pri" onclick="ocrModal()">OCR Page(s)</button><button class="btn" onclick="pasteModal()">Paste OCR JSON</button><button class="btn" onclick="schemaModal()">Schema</button><button class="btn" onclick="tests()">Run Dry Tests</button><button class="btn" onclick="addStop()">+ Stop</button><button class="btn pri" onclick="buildRouteUI()">Build Route</button><button class="btn" onclick="exportBackup()">Backup</button><button class="btn bad" onclick="resetAll()">Reset</button></div><div id="stats" class="card row"></div><div id="app"></div></div><div id="modal"></div><script>
const LS='ro_v6',LI='ro_inv_v6',LL='ro_led_v6',LW='ro_hook_v6';
const G=['Adult Bikes','Adult Bike Helmets','Adult Bikes Beach Club Bikes','Bike Locks','Bike Baskets','Beach Table','Body Boards','Coolers','Cornhole','Ice Packs','Kids Bikes','Kids Life Jackets','Loungers','Neso Shade','Skim Boards','Slipcovers Hodnett Cooper','Slipcovers Lilmar Properties','Umbrella Anchor','Umbrella Tables','Umbrellas Hodnett Cooper','Umbrellas Lilmar Properties','Whistles'];
const TASKS=['Arrive','Verify items','Photo proof'];
const EX={schema:'routeops.v6',route_name:'Route 2',stops:[{name:'Beach Club #127',order_id:'596730',address:'1440 Ocean Blvd Unit #127 Saint Simons Island',customer_name:'Dana Habershaw',notes:'Gate #2365; Kaba 109*204058; do not use luggage carts.',items:[{dir:'pickup',item:'Slipcovers Hodnett Cooper',qty:4},{dir:'pickup',item:'Umbrellas Hodnett Cooper',qty:2},{dir:'pickup',item:'Loungers',qty:1},{dir:'pickup',item:'Umbrella Tables',qty:1},{dir:'pickup',item:'Umbrella Anchor',qty:2}]},{name:'Beach Club #130',order_id:'603694',address:'1440 Ocean Blvd Unit #130 Saint Simons Island',customer_name:'Jennifer Rewczuk',items:[{dir:'dropoff',item:'Slipcovers Hodnett Cooper',qty:2},{dir:'dropoff',item:'Umbrellas Hodnett Cooper',qty:1},{dir:'dropoff',item:'Loungers',qty:2},{dir:'dropoff',item:'Umbrella Tables',qty:1},{dir:'dropoff',item:'Umbrella Anchor',qty:2}]}],inventory_summary:[{item:'Adult Bikes',departing:10,returning:16},{item:'Slipcovers Hodnett Cooper',departing:37,returning:10},{item:'Loungers',departing:37,returning:7}]};
const PROMPT=`Extract ALL route sheet data from every image in images[]. Return JSON only: {"schema":"routeops.v6","stops":[{"name":"","order_id":"","address":"","customer_name":"","customer_phone":"","scheduled_time":"","priority":"Normal","lat":0,"lng":0,"notes":"","tasks":["Arrive","Verify items","Photo proof"],"items":[{"dir":"pickup or dropoff","item":"gear name","qty":1}]}],"inventory_summary":[{"item":"gear name","departing":0,"returning":0}]}. Scan each page top-to-bottom and left-to-right. Extract every P/D job box, every Pickup & Load box, every Unload & Delivery box, and the full Customers Departing/Returning inventory table. Preserve Beach Club unit numbers, order IDs, customer names, gate/Kaba codes, and driver instructions. Do not output blank stops. Match gear names to the provided gear list.`;
let stops=load(LS)||normImport(EX).stops, inv=load(LI)||[], led=load(LL)||[], route=[];
function uid(){return Math.random().toString(36).slice(2,9)}function clean(v){return String(v??'').trim().replace(/\s+/g,' ')}function n(v,d=0){let x=Number(v);return Number.isFinite(x)?x:d}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function pick(o,ks,d=''){for(let k of ks)if(o&&o[k]!=null&&clean(o[k])!=='')return o[k];return d}function gear(v){let s=clean(v);if(!s)return'';return G.find(g=>g.toLowerCase()===s.toLowerCase())||G.find(g=>g.toLowerCase().includes(s.toLowerCase())||s.toLowerCase().includes(g.toLowerCase()))||s}
function hasData(o){return !!(o&&(Array.isArray(o.items)&&o.items.length||Array.isArray(o.pickups)&&o.pickups.length||Array.isArray(o.dropoffs)&&o.dropoffs.length||['name','stop','job','property','unit','address','customer_name','customerName','client','guest','company','order_id','rt','ticket'].some(k=>clean(o[k]))))}
function item(x){if(!x)return null;let it=gear(pick(x,['item','gear','gear_item','product','name'],''));if(!it)return null;let raw=String(pick(x,['dir','direction','type','action'],'dropoff')).toLowerCase();let dir=raw.includes('pick')||raw.includes('load')||raw.includes('return')?'pickup':'dropoff';return{id:x.id||uid(),dir,item:it,qty:Math.max(1,n(pick(x,['qty','quantity','count','expected'],1),1)),actual:x.actual??'',condition:x.condition||'OK',done:!!x.done,notes:x.notes||''}}
function unpack(o){let a=[];if(Array.isArray(o.items))a=a.concat(o.items);if(Array.isArray(o.pickups))a=a.concat(o.pickups.map(x=>({...x,dir:'pickup'})));if(Array.isArray(o.dropoffs))a=a.concat(o.dropoffs.map(x=>({...x,dir:'dropoff'})));let root=pick(o,['item','gear_item'],'');if(root)a.push({item:root,dir:pick(o,['dir','direction'],'dropoff'),qty:pick(o,['qty','quantity'],1)});return a.map(item).filter(Boolean)}
function stop(o,i=0,manual=false){let cust=clean(pick(o,['customer_name','customerName','client','guest','company'],typeof o.customer==='string'?o.customer:''));let addr=clean(pick(o,['address','location','property_address','site'],''));let name=clean(pick(o,['name','stop','job','property','unit'],''));if(!name&&(manual||addr||cust))name=addr||cust||`Stop ${i+1}`;let tasks=Array.isArray(o.tasks)?o.tasks:TASKS;return{id:o.id||uid(),name,order_id:clean(pick(o,['order_id','orderId','rt','ticket'],'')),customer_name:cust,customer_phone:clean(pick(o,['customer_phone','phone'],'')),scheduled_time:clean(pick(o,['scheduled_time','time','window'],'')),address:addr,lat:n(pick(o,['lat','latitude'],0),0),lng:n(pick(o,['lng','lon','longitude'],0),0),priority:String(o.priority||'Normal')==='High'?'High':'Normal',notes:clean(pick(o,['notes','instructions','driver_instructions'],'')),tasks:tasks.map(t=>({id:t.id||uid(),text:clean(typeof t==='string'?t:t.text)||'Task',done:!!t.done})),items:unpack(o),photos:o.photos||[],archivedAt:o.archivedAt||null}}
function invrow(r){let it=gear(pick(r,['item','gear','gear_item','name','Gear/Item'],''));let d=n(pick(r,['departing','Departing','depart','out','delivery','load'],0),0), ret=n(pick(r,['returning','Returning','return','in','pickup'],0),0);return it&&(d||ret)?{item:it,departing:d,returning:ret}:null}
function mergeInv(rows){let m=new Map();for(let r of rows.map(invrow).filter(Boolean)){let o=m.get(r.item)||{item:r.item,departing:0,returning:0};o.departing+=r.departing;o.returning+=r.returning;m.set(r.item,o)}return[...m.values()].sort((a,b)=>a.item.localeCompare(b.item))}
function parseJ(x){if(typeof x==='string')return JSON.parse(x.replace(/```json|```/g,'').trim());return x}function rawStops(o){o=parseJ(o);return Array.isArray(o)?o:o.stops||o.jobs||o.orders||o.records||o.data?.stops||o.route?.stops||o.routes?.[0]?.stops||[]}function rawInv(o){o=parseJ(o);return o.inventory_summary||o.inventory||o.route_inventory||o.data?.inventory_summary||[]}
function normImport(x){let o=parseJ(x), seen=new Set();let ss=rawStops(o).filter(hasData).map((r,i)=>stop(r,i,false)).filter(s=>s.name||s.address||s.customer_name||s.order_id||s.items.length).filter(s=>{let sig=[s.name,s.order_id,s.address,s.items.map(i=>i.dir+i.item+i.qty).join('|')].join('~');if(seen.has(sig))return false;seen.add(sig);return true});return{stops:ss,inventory:mergeInv(rawInv(o))}}
function parseCSV(t){let rows=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let ch=t[i],nx=t[i+1];if(ch=='"'&&q&&nx=='"'){c+='"';i++;continue}if(ch=='"'){q=!q;continue}if(ch==','&&!q){r.push(c);c='';continue}if((ch=='\n'||ch=='\r')&&!q){if(ch=='\r'&&nx=='\n')i++;r.push(c);c='';if(r.some(clean))rows.push(r);r=[];continue}c+=ch}r.push(c);if(r.some(clean))rows.push(r);let h=(rows[0]||[]).map(x=>clean(x).toLowerCase());return rows.slice(1,201).map(row=>{let o={};h.forEach((k,i)=>o[k]=clean(row[i]||''));return o})}
function csvStops(rows){let m=new Map();rows.forEach((r,i)=>{let k=clean(r.name||r.stop||r.job||r.address).toLowerCase();if(!k)return;if(!m.has(k))m.set(k,stop(r,i,false));let it=item(r);if(it&&pick(r,['item','gear'],''))m.get(k).items.push(it)});return[...m.values()].filter(s=>s.name||s.items.length)}function csvInv(rows){return mergeInv(rows.map(r=>({item:r.item||r.gear||r.name,departing:r.departing,returning:r.returning})))}
function load(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}function save(){localStorage.setItem(LS,JSON.stringify(stops));localStorage.setItem(LI,JSON.stringify(inv));localStorage.setItem(LL,JSON.stringify(led))}
function stats(){let pu=stops.reduce((a,s)=>a+s.items.filter(i=>i.dir==='pickup').reduce((x,i)=>x+n(i.qty),0),0),d=stops.reduce((a,s)=>a+s.items.filter(i=>i.dir==='dropoff').reduce((x,i)=>x+n(i.qty),0),0);stats.innerHTML=`<span class="pill">Stops ${stops.length}</span><span class="pill pu">Pickup ${pu}</span><span class="pill do">Dropoff ${d}</span><span class="pill">Inventory ${inv.length}</span>`}
function render(){stats();let html='<div class="side"><div class="card"><h2>Stops</h2>';stops.forEach((s,i)=>html+=`<div class="card"><b>${i+1}. ${esc(s.name)}</b><p class="mut">${esc(s.customer_name)} ${s.order_id?'· '+esc(s.order_id):''}</p><div>${s.items.map(it=>`<span class="pill ${it.dir==='pickup'?'pu':'do'}">${it.dir} ${it.qty} ${esc(it.item)}</span>`).join('')}</div><div class="row"><button class="btn" onclick="edit(${i})">Edit</button><button class="btn bad" onclick="stops.splice(${i},1);save();render()">Remove</button></div></div>`);html+='</div><div id="main">'+loadHTML()+'</div></div>';app.innerHTML=html}
function loadHTML(){let calc=calcLoad(stops);return`<div class="card"><h2>Printed Inventory</h2>${inv.length?table(['Item','Departing','Returning','Net'],inv.map(r=>[r.item,r.departing,r.returning,r.departing-r.returning])):'<p class="warn card">No inventory_summary imported yet.</p>'}</div><div class="card"><h2>Calculated Load</h2>${table(['Item','Load Start','Pickup','Dropoff','End'],calc.map(r=>[r.item,r.loadStart,r.pickup,r.dropoff,r.end]))}</div>`}
function table(h,rows){return`<div style="overflow:auto"><table><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function calcLoad(ss){let load={},zero={},tot={};for(let s of ss){for(let i of s.items.filter(x=>x.dir==='pickup'))zero[i.item]=(zero[i.item]||0)+n(i.qty);for(let i of s.items.filter(x=>x.dir==='dropoff')){zero[i.item]=(zero[i.item]||0)-n(i.qty);if(zero[i.item]<0){load[i.item]=(load[i.item]||0)-zero[i.item];zero[i.item]=0}}}for(let [k,v] of Object.entries(load))tot[k]={item:k,loadStart:v,pickup:0,dropoff:0,end:v};for(let s of ss)for(let i of s.items){let r=tot[i.item]||(tot[i.item]={item:i.item,loadStart:0,pickup:0,dropoff:0,end:0});if(i.dir==='pickup'){r.pickup+=n(i.qty);r.end+=n(i.qty)}else{r.dropoff+=n(i.qty);r.end-=n(i.qty)}}return Object.values(tot)}
function edit(i){let s=stops[i];show(`<h2>Edit Stop</h2><input id="en" class="inp" value="${esc(s.name)}"><input id="ec" class="inp" value="${esc(s.customer_name)}"><textarea id="eno" class="inp">${esc(s.notes)}</textarea><textarea id="gearbox" class="inp">${s.items.map(it=>`${it.dir} ${it.item} ${it.qty}`).join('\n')}</textarea><button class="btn ok" onclick="saveEdit(${i})">Save</button><button class="btn" onclick="closeM()">Close</button>`)}
function saveEdit(i){let s=stops[i];s.name=en.value;s.customer_name=ec.value;s.notes=eno.value;s.items=gearbox.value.split(/\n+/).map(clean).filter(Boolean).map(line=>{let p=line.split(/\s+/),dir=p[0].toLowerCase().startsWith('p')?'pickup':'dropoff',qty=n(p.at(-1),1),it=p.slice(1,-1).join(' ');return item({dir,item:it,qty})}).filter(Boolean);save();closeM();render()}
function addStop(){stops.push(stop({name:`New Stop ${stops.length+1}`},0,true));save();render()}
function buildRouteUI(){route=[...stops];show(`<h2>Route Order</h2>${route.map((s,i)=>`<p><b>${i+1}. ${esc(s.name)}</b> ${esc(s.address)}</p>`).join('')}<button class="btn" onclick="closeM()">Close</button>`)}
function preview(payload,src){let ss=payload.stops||[], ii=payload.inventory||[];if(!ss.length&&!ii.length)return show('<h2>No valid data</h2><p>Blank rows ignored. Need stops[] and/or inventory_summary[].</p><button class="btn" onclick="closeM()">Close</button>');window.pending={ss,ii};show(`<h2>Import Preview</h2><p>${esc(src)}: ${ss.length} stop(s), ${ii.length} inventory row(s)</p>${ss.length?table(['Name','Order','Customer','Items'],ss.slice(0,12).map(s=>[s.name,s.order_id,s.customer_name,s.items.length])):''}${ii.length?table(['Item','Departing','Returning'],ii.slice(0,20).map(r=>[r.item,r.departing,r.returning])):''}<button class="btn ok" onclick="apply('replace')">Replace</button><button class="btn pri" onclick="apply('append')">Append/Merge</button><button class="btn" onclick="closeM()">Cancel</button>`)}
function apply(mode){let p=window.pending;if(mode==='replace'){if(p.ss.length)stops=p.ss;if(p.ii.length)inv=p.ii}else{stops=stops.concat(p.ss);inv=mergeInv(inv.concat(p.ii))}save();closeM();render()}
function pasteModal(){show(`<h2>Paste OCR JSON</h2><textarea id="paste" class="inp" placeholder='{"schema":"routeops.v6","stops":[],"inventory_summary":[]}'></textarea><button class="btn ok" onclick="try{preview(normImport(paste.value),'pasted JSON')}catch(e){alert(e.message)}">Preview</button><button class="btn" onclick="paste.value=JSON.stringify(EX,null,2)">Example</button><button class="btn" onclick="closeM()">Close</button>`)}
function schemaModal(){show(`<h2>Schema / Prompt</h2><textarea class="inp" style="min-height:240px">${esc(PROMPT)}</textarea><textarea class="inp" style="min-height:220px">${esc(JSON.stringify(EX,null,2))}</textarea><button class="btn" onclick="closeM()">Close</button>`)}
function ocrModal(){show(`<h2>OCR Page(s)</h2><p class="mut">Choose all page photos together. Your webhook must read images[] and return routeops.v6 JSON.</p><input id="hook" class="inp" value="${esc(localStorage.getItem(LW)||'')}" placeholder="https://.../webhook/routeops-ocr"><button class="btn pri" onclick="localStorage.setItem(LW,hook.value);closeM();ocr.click()">Choose Images</button><button class="btn" onclick="schemaModal()">Use Schema</button>`)}
async function ocrSend(files){files=[...files];let url=localStorage.getItem(LW);if(!url)return ocrModal();let images=[];for(let f of files){let data_url=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});images.push({name:f.name,type:f.type,data_url})}let res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({schema:'routeops.v6',prompt:PROMPT,gear:G,images,image:images[0]})});let out=await res.json();preview(normImport(out.json||out.result||out),'OCR webhook')}
function tests(){let t=[],ok=(n,c,d='')=>t.push([n,!!c,d]);let b=normImport({stops:[{}, {name:'',items:[]}],inventory_summary:[]});ok('blank OCR rows filtered',b.stops.length===0,b.stops.length);let s=normImport(EX);ok('sample stops=2',s.stops.length===2,s.stops.length);ok('inventory rows=3',s.inventory.length===3,s.inventory.length);let csv=parseCSV('name,item,qty,departing,returning\nBeach Club #1,Adult Bikes,2,,\n,Adult Bikes,,10,16');ok('csv stop only rows',csvStops(csv).length===1,csvStops(csv).length);ok('csv inventory rows',csvInv(csv).length===1,JSON.stringify(csvInv(csv)));show(`<h2>Dry Tests</h2>${table(['Test','Status','Details'],t.map(x=>[x[0],x[1]?'PASS':'FAIL',x[2]]))}<button class="btn" onclick="closeM()">Close</button>`)}
function exportBackup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({schema:'routeops.v6',stops,inventory_summary:inv,ledger:led},null,2)],{type:'application/json'}));a.download='routeops-backup.json';a.click()}function resetAll(){stops=normImport(EX).stops;inv=[];led=[];save();render()}function show(h){modal.innerHTML=`<div class="modal"><div class="box">${h}</div></div>`}function closeM(){modal.innerHTML=''}
file.onchange=async e=>{let f=e.target.files[0];if(!f)return;let text=await f.text();try{if(f.name.toLowerCase().endsWith('.json')||text.trim()[0]=='{'||text.trim()[0]=='[')preview(normImport(text),f.name);else{let rows=parseCSV(text);preview({stops:csvStops(rows),inventory:csvInv(rows)},f.name)}}catch(err){show(`<h2>Import failed</h2><p>${esc(err.message)}</p><button class="btn" onclick="closeM()">Close</button>`)}file.value=''};ocr.onchange=e=>ocrSend(e.target.files).catch(err=>show(`<h2>OCR failed</h2><p>${esc(err.message)}</p><button class="btn" onclick="closeM()">Close</button>`));window.addStop=addStop;window.buildRouteUI=buildRouteUI;window.pasteModal=pasteModal;window.schemaModal=schemaModal;window.ocrModal=ocrModal;window.tests=tests;window.exportBackup=exportBackup;window.resetAll=resetAll;window.edit=edit;window.saveEdit=saveEdit;window.apply=apply;window.closeM=closeM;window.preview=preview;window.normImport=normImport;window.EX=EX;testBtn.onclick=tests;render();
</script></body></html>
