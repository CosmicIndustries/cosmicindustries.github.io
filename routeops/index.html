<style>

*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#1f2937,#111827 45%,#0f172a);color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{max-width:1120px;margin:auto;padding:10px}.top{position:sticky;top:0;z-index:5;background:#0f172af5;border-bottom:1px solid #334155}.topin{max-width:1120px;margin:auto;padding:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{display:flex;gap:10px;align-items:center}.mark{width:42px;height:42px;border-radius:10px;background:var(--orange);color:#111827;display:grid;place-items:center;font-weight:900}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}.card{background:var(--panel);border:1px solid rgba(148,163,184,.25);border-radius:14px;padding:12px;margin:10px 0}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.btn{border:1px solid rgba(148,163,184,.35);border-radius:10px;background:var(--panel2);color:var(--text);padding:10px 12px;font-weight:800;min-height:40px}.sm{min-height:32px;padding:6px 9px;font-size:12px}.primary{background:var(--blue)}.success{background:var(--green)}.danger{background:var(--red)}.warning{background:#b45309}.active{background:var(--orange);color:#111827}.input{width:100%;min-height:42px;background:#111827;color:var(--text);border:1px solid rgba(148,163,184,.35);border-radius:10px;padding:9px}textarea.input{min-height:120px;resize:vertical}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.muted{color:var(--muted)}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;margin:2px;font-size:12px;font-weight:800;background:#334155}.pickup{background:#14532d;color:#bbf7d0}.dropoff{background:#7f1d1d;color:#fecaca}.grid{display:grid;grid-template-columns:330px 1fr;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stop{border-left:4px solid transparent}.sel{border-left-color:#60a5fa;background:#172033}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{border-top:1px solid rgba(148,163,184,.16);padding:8px;text-align:left;font-size:13px}th{background:#334155}.modal{position:fixed;inset:0;background:#000c;z-index:50;display:grid;place-items:center;padding:12px}.box{width:min(920px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid #64748b;border-radius:14px;padding:14px}.toast{position:fixed;left:12px;right:12px;bottom:12px;z-index:60}.progress{height:12px;background:#111827;border:1px solid #475569;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--orange);width:0}.stat{border-radius:14px;padding:12px;background:#111827;border:1px solid rgba(148,163,184,.24)}.stat b{display:block;font-size:24px}.check{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;background:#111827;border:1px solid rgba(148,163,184,.25);border-radius:12px;padding:10px;margin:7px 0}.check.done{border-color:#22c55e;background:#052e16}.check.warn{border-color:#f59e0b;background:#451a03}.itemrow{display:grid;grid-template-columns:110px 1fr 78px auto;gap:8px;align-items:center;background:#273449;border:1px solid rgba(148,163,184,.18);border-radius:12px;padding:8px;margin:7px 0}.route{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:#273449;border:1px solid rgba(148,163,184,.18);border-radius:12px;padding:10px;margin:7px 0}.num{width:34px;height:34px;border-radius:10px;background:var(--orange);color:#111827;display:grid;place-items:center;font-weight:900}.callout{border-left:5px solid var(--gold);background:#451a0333}.okay{border-left:5px solid #22c55e}.badcall{border-left:5px solid #ef4444}.nonpack{border-left:5px solid #38bdf8;background:#082f4933}.move{border-left:5px solid #a78bfa;background:#2e106533}
@media(max-width:860px){.topin{align-items:flex-start}.grid,.grid2,.grid3{grid-template-columns:1fr}.row>.btn{flex:1 1 132px}.wrap{padding:8px}.card{padding:10px;margin:8px 0}.brand h1{font-size:18px}.itemrow{grid-template-columns:1fr}.check{grid-template-columns:auto 1fr}}
</style>

<body>
<header class="top"><div class="topin"><div class="brand"><div class="mark">RO</div><div><h1>RouteOps</h1><p>inventory gate + delivery stop OCR + non-pack math</p></div></div><div class="row"><button class="btn primary" data-act="build">Build Route</button><button class="btn" data-act="add">+ Stop</button></div></div></header>
<main class="wrap">
<section class="card"><div id="stats" class="row"></div></section>
<section class="card row">
<input id="file" class="hidden" type="file" accept=".json,.csv,application/json,text/csv">
<input id="ocrLocal" class="hidden" type="file" accept="image/*" multiple>
<button class="btn success" data-act="upload">Upload JSON/CSV</button>
<button class="btn primary" data-tab="ocr">OCR → Panels</button>
<button class="btn" data-act="paste">Paste JSON</button>
<button class="btn" data-act="shop">+ Shop</button>
<button class="btn" data-tab="stops">Stops</button>
<button class="btn" data-tab="route">Route</button>
<button class="btn" data-tab="load">Load Sheet</button>
<button class="btn" data-tab="drive">Drive</button>
<button class="btn" data-tab="ledger">Ledger</button>
<button class="btn" data-act="tests">Tests</button>
<button class="btn" data-act="backup">Backup</button>
<button class="btn danger" data-act="reset">Reset</button>
</section>
<div id="app"></div>
</main>
<div id="modal"></div><div id="toast" class="toast"></div>
<script>
(function(){
'use strict';
var STORE='routeops_v19_delivery_nonpack';
var GEAR=['Adult Bikes','Adult Bike Helmets','Adult Life Jackets','Adult XL Life Jackets','Beach Cart','Beach Table','Bike Baskets','Bike Hitches','Bike Locks','Body Boards','Coolers','Cornhole','Ice Packs','Kids Bikes','Kids Life Jackets','Loungers','Neso Shade','Paddle Boards','Skim Boards','Slipcovers ERA Fernandina','Slipcovers Hodnett Cooper','Slipcovers Lilmar Properties','Slipcovers Stay Better Vacations','Umbrella Anchor','Umbrella Tables','Umbrellas ERA Fernandina','Umbrellas Hodnett Cooper','Umbrellas Lilmar Properties','Umbrellas Stay Better Vacations','Whistles'];
var SAMPLE={stops:[{name:'Shop / Depot',isDepot:true,customer_name:'VayKLife',items:[]},{name:'Beach Club #127',order_id:'596730',customer_name:'Dana Habershaw',address:'1440 Ocean Blvd Unit #127',notes:'Gate #2365; Kaba 109*204058',items:[{dir:'pickup',item:'Slipcovers Hodnett Cooper',qty:4},{dir:'pickup',item:'Umbrellas Hodnett Cooper',qty:2}]},{name:'Beach Club #130',order_id:'603694',customer_name:'Jennifer Rewczuk',address:'1440 Ocean Blvd Unit #130',items:[{dir:'dropoff',item:'Slipcovers Hodnett Cooper',qty:2},{dir:'dropoff',item:'Umbrellas Hodnett Cooper',qty:1}]}],inventory_summary:[{item:'Adult Bikes',departing:10,returning:16},{item:'Slipcovers Hodnett Cooper',departing:37,returning:10}],ledger:[]};
var state=loadState();
var ocr={files:[],text:'',parsed:{schema:'routeops.v19',stops:[],inventory_summary:[],extraction_report:{warnings:[]}},checks:{},status:'Ready.',progress:0};
function $(id){return document.getElementById(id)}
function clean(v){return String(v==null?'':v).trim().replace(/[–—~=_]+/g,' - ').replace(/\s+/g,' ')}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v,d){v=Number(String(v).replace(/[^0-9.-]/g,''));return Number.isFinite(v)?v:(d||0)}
function uid(){return Math.random().toString(36).slice(2,10)}
function copy(o){return JSON.parse(JSON.stringify(o||{}))}
function normText(s){return clean(s).toLowerCase().replace(/551/g,'ssi').replace(/5si/g,'ssi').replace(/\bslip\s*covers\b/g,'slipcovers').replace(/stay better vacat\w*/g,'stay better vacations').replace(/fernandina beach realty and amelia vacations/g,'era fernandina').replace(/[^a-z0-9# ]+/g,' ').replace(/\s+/g,' ').trim()}
function gear(v){var s=clean(v),l=normText(s),best=s,score=0;if(!s)return'';GEAR.forEach(function(g){var gl=normText(g);if(gl===l){best=g;score=99}else{var toks=gl.split(/\s+/).filter(function(t){return t.length>2}),hits=0;toks.forEach(function(t){if(l.indexOf(t)>=0)hits++});var sc=hits/Math.max(1,toks.length)+(l.indexOf(gl)>=0?1:0);if(sc>score&&hits){score=sc;best=g}}});return score>=0.34?best:s}
function direction(v){v=clean(v).toLowerCase();return v.indexOf('pick')>=0||v.indexOf('load')>=0||v.indexOf('return')>=0?'pickup':'dropoff'}
function normItem(o){if(!o)return null;var it=gear(o.item||o.gear||o.name||'');if(!it)return null;return{id:o.id||uid(),dir:direction(o.dir||o.direction||o.type||'dropoff'),item:it,qty:Math.max(1,num(o.qty||o.quantity||o.count||1,1)),actual:o.actual||'',condition:o.condition||'OK',done:!!o.done,notes:o.notes||''}}
function normStop(o,i){o=o||{};var items=[].concat(o.items||[],(o.pickups||[]).map(function(x){x=copy(x);x.dir='pickup';return x}),(o.dropoffs||[]).map(function(x){x=copy(x);x.dir='dropoff';return x})).map(normItem).filter(Boolean);var name=clean(o.name||o.stop||o.job||o.property||o.address||o.customer_name||('Stop '+((i||0)+1)));return{id:o.id||uid(),name:name,order_id:clean(o.order_id||o.orderId||o.rt||o.ticket||''),customer_name:clean(o.customer_name||o.customerName||o.client||o.guest||''),address:clean(o.address||o.location||''),isDepot:!!(o.isDepot||o.depot),notes:clean(o.notes||o.instructions||''),tasks:(Array.isArray(o.tasks)?o.tasks:['Arrive','Verify items','Photo proof']).map(function(t){return typeof t==='string'?{id:uid(),text:t,done:false}:t}),items:items,photos:o.photos||[],archivedAt:o.archivedAt||null}}
function normInv(r){if(!r)return null;var it=gear(r.item||r.gear||r.name||'');var d=num(r.departing||r.depart||r.dropoffs||r.out||0,0),ret=num(r.returning||r.return||r.pickups||r.in||0,0);return it?{item:it,departing:d,returning:ret}:null}
function mergeInv(rows){var m={};(rows||[]).forEach(function(r){r=normInv(r);if(!r||!r.item)return;m[r.item]=m[r.item]||{item:r.item,departing:0,returning:0};m[r.item].departing+=r.departing;m[r.item].returning+=r.returning});return Object.keys(m).sort().map(function(k){return m[k]})}
function hydrate(o){return{stops:(o.stops||[]).map(normStop),inventory:mergeInv(o.inventory||o.inventory_summary||[]),ledger:o.ledger||[],routeOrder:o.routeOrder||[],selectedId:o.selectedId||null,tab:o.tab||'stops',driveIndex:o.driveIndex||0}}
function loadState(){try{var raw=JSON.parse(localStorage.getItem(STORE)||'null');if(raw&&raw.stops)return hydrate(raw)}catch(e){}return hydrate(SAMPLE)}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function importPayload(x){if(typeof x==='string')x=JSON.parse(x.replace(/```json/gi,'').replace(/```/g,'').trim());return{stops:(x.stops||x.jobs||x.orders||[]).map(normStop),inventory:mergeInv(x.inventory_summary||x.inventory||[]),report:x.extraction_report||null}}
function parseCSV(text){var rows=[],r=[],c='',q=false;for(var i=0;i<text.length;i++){var ch=text[i],nx=text[i+1];if(ch=='"'&&q&&nx=='"'){c+='"';i++;continue}if(ch=='"'){q=!q;continue}if(ch===','&&!q){r.push(c);c='';continue}if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&nx==='\n')i++;r.push(c);c='';if(r.some(clean))rows.push(r);r=[];continue}c+=ch}r.push(c);if(r.some(clean))rows.push(r);var h=(rows[0]||[]).map(function(x){return clean(x).toLowerCase()});return rows.slice(1).map(function(row){var o={};h.forEach(function(k,i){o[k]=clean(row[i]||'')});return o})}
function csvPayload(rows){return{stops:[],inventory:mergeInv(rows.map(function(r){return{item:r.item||r.gear||r.name,departing:r.departing,returning:r.returning}}))}}
function ordered(){var order=state.routeOrder.length?state.routeOrder:state.stops.map(function(_,i){return i});return order.map(function(i){return state.stops[i]}).filter(Boolean)}
function addressNum(s){var a=(s.address||s.name||'').match(/\b(\d{2,5})\b/);return a?Number(a[1]):999999}
function buildRoute(){state.routeOrder=state.stops.map(function(_,i){return i}).sort(function(a,b){return addressNum(state.stops[a])-addressNum(state.stops[b])});state.tab='route';save();render()}
function invTotals(rows){var d=0,r=0;(rows||[]).forEach(function(x){d+=num(x.departing);r+=num(x.returning)});return{dropoffs:d,returning:r,net:d-r}}
function inventoryRows(rows){return(rows||[]).map(function(r){return{Item:r.item,'Drop-offs / Departing':r.departing,'Returning / Pickups':r.returning,'Net Out':r.departing-r.returning}})}
function table(head,rows){return'<div class="scroll"><table><tr>'+head.map(function(h){return'<th>'+esc(h)+'</th>'}).join('')+'</tr>'+rows.map(function(r){return'<tr>'+head.map(function(h){return'<td>'+esc(r[h]==null?'':r[h])+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>'}
function invSummary(rows,title){var t=invTotals(rows);return'<div class="card"><h2>'+esc(title||'Inventory')+'</h2><p class="muted">Drop-offs = departing / leaving shop. Returning = coming back / pickups.</p><div class="grid3"><div class="stat"><span class="muted">Drop-offs</span><b>'+t.dropoffs+'</b></div><div class="stat"><span class="muted">Returning</span><b>'+t.returning+'</b></div><div class="stat"><span class="muted">Net out</span><b>'+t.net+'</b></div></div>'+table(['Item','Drop-offs / Departing','Returning / Pickups','Net Out'],inventoryRows(rows))+'</div>'}
function routeItemRows(stops){var m={};function rec(k){return m[k]||(m[k]={item:k,dropoff:0,pickup:0,net:0})}(stops||[]).forEach(function(s){s.items.forEach(function(i){var r=rec(i.item);if(i.dir==='pickup')r.pickup+=num(i.qty);else r.dropoff+=num(i.qty);r.net=r.dropoff-r.pickup})});return Object.keys(m).sort().map(function(k){return m[k]})}
function nonPackSummary(stops,title){var rows=routeItemRows(stops).map(function(r){return{Item:r.item,'Non-pack Drop-offs':r.dropoff,'Route Returns':r.pickup,'Net Needed':r.net}});var d=0,p=0;rows.forEach(function(r){d+=r['Non-pack Drop-offs'];p+=r['Route Returns']});return'<div class="card nonpack"><h2>'+esc(title||'Stop-Page Non-Pack List')+'</h2><p class="muted">These came from delivery/stop pages, not the printed inventory page. Use this as loose/non-pack route load.</p><div class="grid3"><div class="stat"><span class="muted">Non-pack drop-offs</span><b>'+d+'</b></div><div class="stat"><span class="muted">Route returns</span><b>'+p+'</b></div><div class="stat"><span class="muted">Net needed</span><b>'+(d-p)+'</b></div></div>'+table(['Item','Non-pack Drop-offs','Route Returns','Net Needed'],rows)+'</div>'}
function routeMathUI(stops){stops=stops||[];var sorted=stops.slice().sort(function(a,b){return addressNum(a)-addressNum(b)}),groups={},moves=[];sorted.forEach(function(s){var key=(s.address||s.name).replace(/\b(unit|#)\s*[a-z0-9]+/ig,'').toLowerCase();groups[key]=groups[key]||[];groups[key].push(s)});Object.keys(groups).forEach(function(k){if(groups[k].length>1)moves.push('Bundle same-property stops: '+groups[k].map(function(s){return s.name}).join(' + '))});var hasPickup=stops.some(function(s){return s.items.some(function(i){return i.dir==='pickup'})});if(!hasPickup)moves.push('No pickup/load items on this page, so nothing can be re-used later. Load all listed drop-offs at shop.');return'<div class="card move"><h2>Routing Math / Move-Arounds</h2><p class="muted">Address sort is north-to-south by street number when available.</p>'+table(['Order','Stop','Address','Pieces'],sorted.map(function(s,i){return{Order:i+1,Stop:s.name,Address:s.address,Pieces:s.items.reduce(function(a,b){return a+num(b.qty)},0)}}))+'<ul>'+moves.map(function(m){return'<li>'+esc(m)+'</li>'}).join('')+'</ul></div>'}
function invChecklistRows(rows){var out=[];(rows||[]).forEach(function(r){out.push({key:'D|'+r.item,label:'Drop-off / departing',item:r.item,qty:r.departing});out.push({key:'R|'+r.item,label:'Returning / pickup',item:r.item,qty:r.returning})});return out}
function checklistComplete(){var rows=invChecklistRows(ocr.parsed.inventory_summary);return rows.length&&rows.every(function(x){return !!ocr.checks[x.key]})}
function missingChecklist(){return invChecklistRows(ocr.parsed.inventory_summary).filter(function(x){return !ocr.checks[x.key]})}
function checklistUI(){var rows=invChecklistRows(ocr.parsed.inventory_summary),done=rows.filter(function(x){return ocr.checks[x.key]}).length,cls=rows.length&&done===rows.length?'okay':'callout';if(!rows.length)return'<div class="card callout"><b>No parsed inventory checklist yet.</b><p class="muted">Parse the inventory page first, then every parsed drop-off and return gets a required checkbox.</p></div>';return'<div class="card '+cls+'"><div class="row"><h2 style="margin-right:auto">Mandatory Inventory Checklist</h2><span class="pill">'+done+' / '+rows.length+' checked</span><button class="btn success sm" data-act="checkall">Check all</button><button class="btn sm" data-act="clearchecks">Clear</button></div><p class="muted">Import is locked until every parsed inventory drop-off and returning line is checked.</p>'+rows.map(function(x){var z=!!ocr.checks[x.key];return'<label class="check '+(z?'done':'warn')+'"><input type="checkbox" data-ocheck="'+esc(x.key)+'" '+(z?'checked':'')+'><span><b>'+esc(x.label)+'</b><br>'+esc(x.item)+'</span><b>'+x.qty+'</b></label>'}).join('')+'</div>'}
function stats(){var t=invTotals(state.inventory);return'<span class="pill">Stops '+state.stops.filter(function(s){return !s.isDepot}).length+'</span><span class="pill">Inv drop-offs '+t.dropoffs+'</span><span class="pill">Inv returning '+t.returning+'</span><span class="pill">Non-pack pieces '+routeItemRows(state.stops).reduce(function(a,b){return a+b.dropoff},0)+'</span>'}
function render(){if(!state.selectedId&&state.stops[0])state.selectedId=state.stops[0].id;$('stats').innerHTML=stats();[].forEach.call(document.querySelectorAll('[data-tab]'),function(b){b.classList.toggle('active',b.getAttribute('data-tab')===state.tab)});$('app').innerHTML=state.tab==='ocr'?viewOCR():state.tab==='route'?viewRoute():state.tab==='load'?viewLoad():state.tab==='drive'?viewDrive():state.tab==='ledger'?viewLedger():viewStops()}
function viewStops(){var sel=state.stops.find(function(s){return s.id===state.selectedId})||state.stops[0];return'<div class="grid"><section>'+state.stops.map(function(s,i){return'<div class="card stop '+(s.id===state.selectedId?'sel':'')+'" data-act="select" data-id="'+s.id+'"><b>'+(i+1)+'. '+esc(s.name)+'</b><p class="muted">'+esc(s.customer_name)+' '+(s.order_id?'· '+esc(s.order_id):'')+'</p>'+s.items.map(function(it){return'<span class="pill '+(it.dir==='pickup'?'pickup':'dropoff')+'">'+(it.dir==='pickup'?'return':'drop')+' '+it.qty+' '+esc(it.item)+'</span>'}).join('')+'<div class="row"><button class="btn sm" data-act="dup" data-id="'+s.id+'">Duplicate</button><button class="btn sm danger" data-act="remove" data-id="'+s.id+'">Remove</button></div></div>'}).join('')+'</section><section>'+(sel?editor(sel):'<div class="card">No stop</div>')+'</section></div>'}
function editor(s){return'<div class="card"><h2>'+esc(s.name)+'</h2><label>Name<input class="input" data-edit="name" data-id="'+s.id+'" value="'+esc(s.name)+'"></label><label>Customer<input class="input" data-edit="customer_name" data-id="'+s.id+'" value="'+esc(s.customer_name)+'"></label><label>Address<input class="input" data-edit="address" data-id="'+s.id+'" value="'+esc(s.address)+'"></label><label>Notes<textarea class="input" data-edit="notes" data-id="'+s.id+'">'+esc(s.notes)+'</textarea></label></div><div class="card"><h3>Gear</h3><button class="btn sm" data-act="additem" data-id="'+s.id+'">+ Gear</button>'+s.items.map(function(it){return'<div class="itemrow"><select class="input" data-item="dir" data-id="'+s.id+'" data-iid="'+it.id+'"><option value="dropoff" '+(it.dir==='dropoff'?'selected':'')+'>drop-off</option><option value="pickup" '+(it.dir==='pickup'?'selected':'')+'>return/pickup</option></select><select class="input" data-item="item" data-id="'+s.id+'" data-iid="'+it.id+'">'+GEAR.map(function(g){return'<option '+(g===it.item?'selected':'')+'>'+esc(g)+'</option>'}).join('')+'</select><input class="input" type="number" data-item="qty" data-id="'+s.id+'" data-iid="'+it.id+'" value="'+esc(it.qty)+'"><button class="btn sm danger" data-act="rmitem" data-id="'+s.id+'" data-iid="'+it.id+'">×</button></div>'}).join('')+'</div>'}
function viewRoute(){var os=ordered().slice().sort(function(a,b){return addressNum(a)-addressNum(b)});return'<section class="card"><h2>Route Order</h2>'+os.map(function(s,i){return'<div class="route"><div class="num">'+(i+1)+'</div><div><b>'+esc(s.name)+'</b><p class="muted">'+esc(s.address||s.customer_name)+'</p>'+s.items.map(function(it){return'<span class="pill '+(it.dir==='pickup'?'pickup':'dropoff')+'">'+it.qty+' '+esc(it.item)+'</span>'}).join('')+'</div><button class="btn sm" data-act="editroute" data-id="'+s.id+'">Edit</button></div>'}).join('')+'</section>'+routeMathUI(os)}</section>'}

function viewOCR(){return'<section class="card"><h2>OCR → Inventory + Delivery Stop Pages</h2><p class="muted">Parse inventory pages and delivery pages. Delivery-page items show as non-pack route load.</p><input id="ocrChooser" class="hidden" type="file" accept="image/*" multiple><div class="row"><button class="btn primary" data-act="ocrchoose">1. Choose Photo(s)</button><button class="btn success" data-act="ocrrun">2. Run OCR</button><button class="btn" data-act="ocrparse">3. Parse Text</button><button class="btn warning" data-act="ocrtest">Test Inventory</button><button class="btn warning" data-act="stoptest">Test Stops</button><button class="btn success" data-act="ocrreplace">Import Replace</button><button class="btn primary" data-act="ocrappend">Import Append</button></div><p class="muted">'+esc(ocr.files.length+' photo(s). '+ocr.status)+'</p><div class="progress"><div class="bar" style="width:'+ocr.progress+'%"></div></div></section><section class="grid2"><div class="card"><h3>OCR Text</h3><textarea id="ocrText" class="input mono">'+esc(ocr.text)+'</textarea></div><div class="card"><h3>JSON</h3><textarea id="ocrJson" class="input mono" readonly>'+esc(JSON.stringify(ocr.parsed,null,2))+'</textarea></div></section>'+invSummary(ocr.parsed.inventory_summary,'OCR Inventory Preview')+checklistUI()+nonPackSummary(ocr.parsed.stops,'OCR Stop-Page Non-Pack List')+routeMathUI(ocr.parsed.stops)+'<section class="card"><h3>Edit Inventory Rows</h3><p class="muted">Format: Item, drop-offs, returning</p><textarea class="input mono" data-ocrinv="1">'+esc(invToText(ocr.parsed.inventory_summary))+'</textarea></section><section class="card"><h3>Stop Panels Preview</h3>'+ocrPanels()+'</section>'}
function ocrPanels(){if(!ocr.parsed.stops.length)return'<p class="muted">No stop panels yet.</p>';return ocr.parsed.stops.map(function(s,i){return'<div class="card"><h3>Stop '+(i+1)+': '+esc(s.name)+'</h3><label>Name<input class="input" data-ocrfield="name" data-idx="'+i+'" value="'+esc(s.name)+'"></label><label>Address<input class="input" data-ocrfield="address" data-idx="'+i+'" value="'+esc(s.address||'')+'"></label><label>Items<textarea class="input mono" data-ocritems="'+i+'">'+esc(itemsToText(s.items||[]))+'</textarea></label></div>'}).join('')}
function invToText(rows){return(rows||[]).map(function(r){return r.item+', '+r.departing+', '+r.returning}).join('\n')}
function itemsToText(items){return(items||[]).map(function(i){return i.dir+' '+i.qty+' '+i.item}).join('\n')}
function textToItems(text){return String(text||'').split(/\n+/).map(clean).filter(Boolean).map(function(line){var p=line.split(/\s+/),d=p[0].indexOf('pick')>=0?'pickup':'dropoff',q=num(p[1],1),name=p.slice(2).join(' ');return{dir:d,item:gear(name),qty:q}})}
function textToInv(text){return mergeInv(String(text||'').split(/\n+/).map(clean).filter(Boolean).map(function(line){var p=line.split(',').map(clean);return p.length>=3?{item:gear(p[0]),departing:num(p[1],0),returning:num(p[2],0)}:null}).filter(Boolean))}
function prepText(t){return String(t||'').replace(/\r/g,'\n').replace(/(Coral\s+Sands\s*\d+\s*\|[^\n]+)/gi,'\n$1\n').replace(/(\d{3,5}\s+S\.?\s*Fletcher\s+Ave[^\n]*\|[^\n]+)/gi,'\n$1\n').replace(/(Amelia\s+South\s+[A-Z0-9]+\s*\|[^\n]+)/gi,'\n$1\n').replace(/(Beach\s*Club\s*#?\s*\d{2,4}[^\n]*)/gi,'\n$1\n').replace(/(Pickup\s*&?\s*Load|Unload\s*&?\s*Delivery|Customers?\s+Departing|Departing\s+Returning|Gear\/Item\s+Departing\s+Returning)/gi,'\n$1\n')}
function lines(t){return prepText(t).split('\n').map(clean).filter(Boolean)}
function isInvHead(l){return /inventory|customers?\s+departing|departing\s+returning|gear\/item\s+departing/i.test(l)}
function stopHeader(l){return /coral\s+sands|amelia\s+south|beach\s*club\s*#?\s*\d|\d{3,5}\s+s\.?\s*fletcher/i.test(l)}
function makeStopFromHeader(l,pending){var parts=l.split('|').map(clean),name=parts[0]||l,addr=parts[1]||'';if(!addr&&/\d{3,5}\s+s/i.test(l))addr=l;return{name:name,order_id:pending||'',address:addr,customer_name:'',notes:'',tasks:['Arrive','Verify items','Photo proof'],items:[]}}
function orderId(l){var m=l.match(/\b(\d{6})\b/);return m?m[1]:''}
function findGearHits(line){var n=normText(line),hits=[];GEAR.slice().sort(function(a,b){return b.length-a.length}).forEach(function(g){var gn=normText(g),idx=n.indexOf(gn);if(idx>=0)hits.push({gear:g,index:idx,len:gn.length})});hits.sort(function(a,b){return a.index-b.index||b.len-a.len});var kept=[];hits.forEach(function(h){if(!kept.some(function(k){return h.index<k.index+k.len&&k.index<h.index+h.len}))kept.push(h)});return kept}
function readTok(t){if(!t||/^[-~=]+$/.test(t))return 0;if(/^[ilI|]$/.test(t))return 1;if(/^[oOeE]$/.test(t))return 0;var m=String(t).match(/\d{1,3}/);return m?Number(m[0]):0}
function parseInventoryLine(line){var hits=findGearHits(line),n=normText(line),rows=[];hits.forEach(function(h,i){var next=hits[i+1]?hits[i+1].index:n.length,seg=n.slice(h.index+h.len,next),toks=seg.split(/\s+/).filter(Boolean),counts=[];for(var j=0;j<toks.length&&counts.length<2;j++){if(/^(adult|bike|bikes|slipcovers|umbrella|umbrellas|beach|kids|neso|paddle|boards|loungers|coolers|body|cornhole|whistles)/.test(toks[j]))break;if(/^(\d{1,3}|[ilI|oOeE]|[-~=]+|\d{1,3}\W)$/.test(toks[j]))counts.push(readTok(toks[j]))}if(counts.length)rows.push({item:h.gear,departing:counts[0]||0,returning:counts.length>1?counts[1]:0})});return rows}
function itemFromDeliveryLine(line,mode){var g=gear(line);if(g===line)return null;var before=line.slice(0,Math.max(0,normText(line).indexOf(normText(g))));var m=before.match(/\b(\d{1,2})\b/);var q=m?Number(m[1]):1;return{dir:mode,item:g,qty:q}}
function parseOCRText(text){var ls=lines(text),zones=[],inv=[],stops=[],cur=null,mode=null,pendingOrder='';ls.forEach(function(l,i){if(isInvHead(l))zones.push(i)});ls.forEach(function(l,i){if(zones.some(function(z){return i>=z&&i<=z+120}))parseInventoryLine(l).forEach(function(r){inv.push(r)})});function push(){if(cur&&(cur.name||cur.items.length))stops.push(cur)}ls.forEach(function(l){if(isInvHead(l)||parseInventoryLine(l).length)return;var oid=orderId(l);if(oid&&!/rt/i.test(l)){pendingOrder=oid;if(cur&&!cur.order_id)cur.order_id=oid}if(stopHeader(l)){push();cur=makeStopFromHeader(l,pendingOrder);pendingOrder='';mode=null;return}if(!cur)return;if(/pickup\s*&?\s*load/i.test(l)){mode='pickup';return}if(/unload\s*&?\s*delivery/i.test(l)){mode='dropoff';return}if(/driver\s+instructions/i.test(l)||/deliver gear|code for all units|address pic|do not leave/i.test(l)){cur.notes=(cur.notes?cur.notes+'; ':'')+l;return}if(/stay better|era fernandina|chelsey|naomi|steph|paul/i.test(l)&&!cur.customer_name){if(!/vacations|realty/i.test(l))cur.customer_name=l}if(!mode)return;if(/^[-–—]+$/.test(l))return;var it=itemFromDeliveryLine(l,mode);if(it)cur.items.push(it)});push();return{schema:'routeops.v19',extraction_report:{pages_seen:ocr.files.length,ocr_lines:ls.length,stops_found:stops.length,inventory_rows_found:mergeInv(inv).length,warnings:[]},stops:stops,inventory_summary:mergeInv(inv)}}
async function canvasFor(file){var img=await new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){res(im)};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)});var max=1800,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c}
async function runOCR(){if(!ocr.files.length){toastMsg('Choose page photos first');return}if(!window.Tesseract){toastMsg('OCR library still loading');return}var texts=[];for(var i=0;i<ocr.files.length;i++){ocr.status='OCR page '+(i+1)+' / '+ocr.files.length;ocr.progress=10+(i/ocr.files.length)*80;render();var out=await Tesseract.recognize(await canvasFor(ocr.files[i]),'eng');texts.push(out.data.text||'')}ocr.text=texts.join('\n\n');ocr.parsed=parseOCRText(ocr.text);ocr.checks={};ocr.status='Parsed '+ocr.parsed.stops.length+' stops and '+ocr.parsed.inventory_summary.length+' inventory rows.';ocr.progress=100;render()}

function apply(payload,mode){if(mode==='replace'){if(payload.stops.length)state.stops=payload.stops.map(normStop);if(payload.inventory.length)state.inventory=mergeInv(payload.inventory)}else{state.stops=state.stops.concat(payload.stops.map(normStop));state.inventory=mergeInv(state.inventory.concat(payload.inventory))}state.selectedId=state.stops[0]&&state.stops[0].id;state.tab='stops';save();closeModal();render();toastMsg('Imported '+payload.stops.length+' stops, '+payload.inventory.length+' inventory rows')}

document.addEventListener('click',function(e){var b=e.target.closest('button,[data-act],[data-tab]');if(!b)return;var a=b.dataset.act,id=b.dataset.id;if(b.dataset.tab){state.tab=b.dataset.tab;save();render();return}if(a==='upload')$('file').click();else if(a==='paste')modal('<h2>Paste JSON</h2><textarea id="pastebox" class="input mono"></textarea><button class="btn success" data-act="previewPaste">Preview</button><button class="btn" data-act="example">Example</button>');else if(a==='previewPaste'){try{preview(importPayload($('pastebox').value),'pasted JSON')}catch(err){modal('<h2>Bad JSON</h2><p>'+esc(err.message)+'</p>')}}else if(a==='example')$('pastebox').value=JSON.stringify(SAMPLE,null,2);else if(a==='applyReplace')apply(window.pending,'replace');else if(a==='applyAppend')apply(window.pending,'append');else if(a==='close')closeModal();else if(a==='build')buildRoute();else if(a==='add')addStop();else if(a==='shop')addShop();else if(a==='select'){state.selectedId=id;save();render()}else if(a==='editroute'){state.selectedId=id;state.tab='stops';save();render()}else if(a==='dup'){var d=normStop(copy(findStop(id)));d.id=uid();d.name+=' Copy';state.stops.push(d);state.selectedId=d.id;save();render()}else if(a==='remove'){state.stops=state.stops.filter(function(s){return s.id!==id});state.selectedId=state.stops[0]&&state.stops[0].id;save();render()}else if(a==='additem'){findStop(id).items.push(normItem({dir:'dropoff',item:'Adult Bikes',qty:1}));save();render()}else if(a==='rmitem'){var s=findStop(id),iid=b.dataset.iid;s.items=s.items.filter(function(i){return i.id!==iid});save();render()}else if(a==='tests')runTests();else if(a==='backup')download('routeops-backup.json',JSON.stringify({schema:'routeops.v19',stops:state.stops,inventory_summary:state.inventory,ledger:state.ledger},null,2),'application/json');else if(a==='reset'){state=hydrate(SAMPLE);ocr.checks={};save();render()}else if(a==='ocrchoose')$('ocrChooser').click();else if(a==='ocrrun')runOCR().catch(functi document.addEventListener('change',function(e){var el=e.target;if(el.id==='file'){handleFile(el.files[0]).catch(function(err){modal('<h2>Import failed</h2><p>'+esc(err.message)+'</p>')});el.value=''}else if(el.id==='ocrChooser'){ocr.files=[].slice.call(el.files||[]);ocr.status='Selected '+ocr.files.length+' photo(s)';ocr.progress=0;render();el.value=''}else if(el.dataset.edit){var s=findStop(el.dataset.id);s[el.dataset.edit]=el.value;save();render()}else if(el.dataset.item){var st=findStop(el.dataset.id),iid=el.dataset.iid;st.items.forEach(function(i){if(i.id===iid)i[el.dataset.item]=el.dataset.item==='qty'?num(el.value,1):el.value});save();render()}else if(el.dataset.ocheck){ocr.checks[el.dataset.ocheck]=el.checked;render()}});
