<header class="top"><div class="topin"><div><b>RouteOps v30</b><div style="color:#cbd5e1;font-size:12px">full-page strip OCR + route propagation + inventory ledger</div></div><div class="row"><button class="btn pri" data-act="route">Build Route</button><button class="btn" data-act="add">+ Stop</button></div></div></header>
<main class="wrap"><section class="card"><div id="stats" class="row"></div></section><section class="card row"><input id="file" type="file" class="hidden" accept=".json,.csv"><input id="imgs" type="file" class="hidden" accept="image/*" multiple><button class="btn ok" data-act="upload">Upload JSON/CSV</button><button class="btn pri" data-tab="ocr">OCR Lab</button><button class="btn" data-act="paste">Paste JSON</button><button class="btn" data-tab="stops">Stops</button><button class="btn" data-tab="route">Route</button><button class="btn" data-tab="load">Load Sheet</button><button class="btn" data-tab="drive">Drive</button><button class="btn" data-tab="ledger">Ledger</button><button class="btn warn" data-act="tests">Tests</button><button class="btn" data-act="backup">Backup</button><button class="btn bad" data-act="reset">Reset</button></section><div id="app"></div></main><div id="modal"></div><div id="toast" class="toast"></div>
<script>
(function(){'use strict';
var KEY='routeops_v30',GEAR=['Adult Bikes','Beach Cart','Beach Table','Bike Locks','Body Boards','Coolers','Cornhole','Ice Packs','Kids Bikes','Kids Life Jackets','Loungers','Neso Shade','Skim Boards','Slipcovers ERA Fernandina','Slipcovers Hodnett Cooper','Slipcovers Stay Better Vacations','Umbrella Anchor','Umbrella Tables','Umbrellas ERA Fernandina','Umbrellas Hodnett Cooper','Umbrellas Stay Better Vacations','Whistles'];
var SAMPLE={stops:[{name:'Shop / Depot',isDepot:true,address:'0 Depot',items:[]},{name:'Coral Sands 306',address:'426 S Fletcher Ave',items:[{dir:'dropoff',item:'Loungers',qty:3},{dir:'dropoff',item:'Umbrella Anchor',qty:1},{dir:'dropoff',item:'Umbrellas Stay Better Vacations',qty:1},{dir:'dropoff',item:'Slipcovers Stay Better Vacations',qty:3}]},{name:'2185 S Fletcher Ave',address:'2185 S Fletcher Ave',items:[{dir:'dropoff',item:'Loungers',qty:2},{dir:'dropoff',item:'Umbrella Tables',qty:1},{dir:'dropoff',item:'Umbrella Anchor',qty:1},{dir:'dropoff',item:'Umbrellas ERA Fernandina',qty:1},{dir:'dropoff',item:'Slipcovers ERA Fernandina',qty:2}]}],inventory_summary:[{item:'Adult Bikes',departing:10,returning:16},{item:'Slipcovers Hodnett Cooper',departing:37,returning:10},{item:'Loungers',departing:37,returning:7}],ledger:[]};
var state=load(),ocr={files:[],text:'',parsed:{stops:[],inventory_summary:[],extraction_report:{}},progress:0,status:'Ready'};
function $(id){return document.getElementById(id)}function clean(v){return String(v==null?'':v).trim().replace(/[–—~=_]+/g,' - ').replace(/\s+/g,' ')}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function num(v,d){v=Number(String(v).replace(/[^0-9.-]/g,''));return Number.isFinite(v)?v:(d||0)}function uid(){return Math.random().toString(36).slice(2,10)}function cp(o){return JSON.parse(JSON.stringify(o||{}))}
function nt(s){return clean(s).toLowerCase().replace(/551|5si/g,'ssi').replace(/\bslip\s*covers\b/g,'slipcovers').replace(/stay better vacat\w*/g,'stay better vacations').replace(/fernandina beach realty and amelia vacations/g,'era fernandina').replace(/[^a-z0-9# ]+/g,' ').replace(/\s+/g,' ').trim()}function gear(v){var s=clean(v),l=nt(s),best=s,score=0;if(!s)return'';GEAR.forEach(function(g){var gl=nt(g);if(gl===l){best=g;score=99}else{var toks=gl.split(/\s+/).filter(function(t){return t.length>2}),hit=0;toks.forEach(function(t){if(l.indexOf(t)>=0)hit++});var sc=hit/Math.max(1,toks.length)+(l.indexOf(gl)>=0?1:0);if(sc>score&&hit){score=sc;best=g}}});return score>=.34?best:s}
function normItem(o){if(!o)return null;var it=gear(o.item||o.gear||o.name||'');if(!it)return null;var d=clean(o.dir||o.type||'dropoff').toLowerCase();return{id:o.id||uid(),dir:d.indexOf('pick')>=0||d.indexOf('return')>=0||d.indexOf('load')>=0?'pickup':'dropoff',item:it,qty:Math.max(1,num(o.qty||o.quantity||o.count||1,1)),actual:o.actual||'',done:!!o.done,condition:o.condition||'OK'}}function normStop(o,i){o=o||{};var items=[].concat(o.items||[],(o.pickups||[]).map(function(x){x=cp(x);x.dir='pickup';return x}),(o.dropoffs||[]).map(function(x){x=cp(x);x.dir='dropoff';return x})).map(normItem).filter(Boolean);return{id:o.id||uid(),name:clean(o.name||o.stop||o.job||o.address||'Stop '+((i||0)+1)),address:clean(o.address||o.location||''),customer_name:clean(o.customer_name||o.customerName||''),order_id:clean(o.order_id||o.ticket||''),isDepot:!!o.isDepot,notes:clean(o.notes||''),items:items,photos:o.photos||[],archivedAt:o.archivedAt||null}}function normInv(r){if(!r)return null;var it=gear(r.item||r.gear||r.name||'');return it?{item:it,departing:num(r.departing||r.dropoffs||r.out||0,0),returning:num(r.returning||r.pickups||r.in||0,0)}:null}function mergeInv(rows){var m={};(rows||[]).forEach(function(r){r=normInv(r);if(!r)return;m[r.item]=m[r.item]||{item:r.item,departing:0,returning:0};m[r.item].departing+=r.departing;m[r.item].returning+=r.returning});return Object.keys(m).sort().map(function(k){return m[k]})}
function hydrate(o){return{stops:(o.stops||[]).map(normStop),inventory:mergeInv(o.inventory||o.inventory_summary||[]),routeOrder:o.routeOrder||[],tab:o.tab||'stops',selectedId:o.selectedId||null,driveIndex:o.driveIndex||0,ledger:o.ledger||[]}}function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.stops)return hydrate(x)}catch(e){}return hydrate(SAMPLE)}function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function itemRows(stops){var m={};(stops||state.stops).forEach(function(s){s.items.forEach(function(i){m[i.item]=m[i.item]||{item:i.item,dropoff:0,pickup:0,net:0};if(i.dir==='pickup')m[i.item].pickup+=num(i.qty);else m[i.item].dropoff+=num(i.qty);m[i.item].net=m[i.item].dropoff-m[i.item].pickup})});return Object.keys(m).sort().map(function(k){return m[k]})}function totals(rows){var d=0,r=0;(rows||[]).forEach(function(x){d+=num(x.departing);r+=num(x.returning)});return{d:d,r:r,n:d-r}}function addrNum(s){var m=(s.address||s.name||'').match(/\b(\d{2,5})\b/);return m?Number(m[1]):s.isDepot?-1:999999}function buildRoute(){state.routeOrder=state.stops.map(function(s,i){return {s:s,i:i}}).sort(function(a,b){return (a.s.isDepot?-1:addrNum(a.s))-(b.s.isDepot?-1:addrNum(b.s))||a.s.name.localeCompare(b.s.name)}).map(function(x){return x.i});state.driveIndex=0;state.tab='route';save();render()}function ordered(){if(!state.routeOrder.length)buildRoute();return state.routeOrder.map(function(i){return state.stops[i]}).filter(Boolean)}
function table(h,rows){return'<div class=scroll><table><tr>'+h.map(function(x){return'<th>'+esc(x)+'</th>'}).join('')+'</tr>'+rows.map(function(r){return'<tr>'+h.map(function(x){return'<td>'+esc(r[x]||'')+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>'}function stats(){var t=totals(state.inventory),np=itemRows(state.stops).reduce(function(a,b){return a+b.dropoff},0);$('stats').innerHTML='<span class=pill>Stops '+state.stops.filter(function(s){return !s.isDepot}).length+'</span><span class=pill>Route '+ordered().length+'</span><span class=pill>Inv drop '+t.d+'</span><span class=pill>Inv return '+t.r+'</span><span class=pill>Non-pack '+np+'</span>'}
function render(){if(!state.selectedId&&state.stops[0])state.selectedId=state.stops[0].id;stats();document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.tab===state.tab)});$('app').innerHTML=state.tab==='ocr'?viewOCR():state.tab==='route'?viewRoute():state.tab==='load'?viewLoad():state.tab==='drive'?viewDrive():state.tab==='ledger'?viewLedger():viewStops()}
function viewStops(){var sel=state.stops.find(function(s){return s.id===state.selectedId})||state.stops[0];return'<div class=grid><section>'+state.stops.map(function(s,i){return'<div class="card '+(s.id===state.selectedId?'sel':'')+'" data-act=select data-id="'+s.id+'"><b>'+(i+1)+'. '+esc(s.name)+'</b><p>'+esc(s.address||s.customer_name)+'</p>'+s.items.map(function(it){return'<span class="pill '+(it.dir==='pickup'?'pu':'do')+'">'+it.qty+' '+esc(it.item)+'</span>'}).join('')+'<div class=row><button class=btn data-act=dup data-id="'+s.id+'">Duplicate</button><button class="btn bad" data-act=remove data-id="'+s.id+'">Remove</button></div></div>'}).join('')+'</section><section>'+(sel?editor(sel):'')+'</section></div>'}function editor(s){return'<div class=card><h2>'+esc(s.name)+'</h2><label>Name<input class=input data-edit=name data-id="'+s.id+'" value="'+esc(s.name)+'"></label><label>Address<input class=input data-edit=address data-id="'+s.id+'" value="'+esc(s.address)+'"></label><label>Notes<textarea class=input data-edit=notes data-id="'+s.id+'">'+esc(s.notes)+'</textarea></label></div><div class=card><h3>Gear</h3><button class=btn data-act=additem data-id="'+s.id+'">+ Gear</button>'+s.items.map(function(it){return'<div class=item><select class=input data-item=dir data-id="'+s.id+'" data-iid="'+it.id+'"><option '+(it.dir==='dropoff'?'selected':'')+'>dropoff</option><option '+(it.dir==='pickup'?'selected':'')+'>pickup</option></select><select class=input data-item=item data-id="'+s.id+'" data-iid="'+it.id+'">'+GEAR.map(function(g){return'<option '+(g===it.item?'selected':'')+'>'+esc(g)+'</option>'}).join('')+'</select><input class=input type=number data-item=qty data-id="'+s.id+'" data-iid="'+it.id+'" value="'+it.qty+'"><button class="btn bad" data-act=rmitem data-id="'+s.id+'" data-iid="'+it.id+'">×</button></div>'}).join('')+'</div>'}
function viewRoute(){var os=ordered();return'<section class=card><h2>Route Order</h2>'+os.map(function(s,i){return'<div class=route><div class=num>'+(i+1)+'</div><div><b>'+esc(s.name)+'</b><p>'+esc(s.address)+'</p>'+s.items.map(function(it){return'<span class="pill '+(it.dir==='pickup'?'pu':'do')+'">'+it.qty+' '+esc(it.item)+'</span>'}).join('')+'</div><button class=btn data-act=edit data-id="'+s.id+'">Edit</button></div>'}).join('')+'</section>'+nonPack(os,'Non-Pack From Propagated Route')}function invBox(rows,title){var t=totals(rows);return'<section class=card><h2>'+esc(title)+'</h2><div class=grid2><div class=card>Drop-offs <b>'+t.d+'</b></div><div class=card>Returning <b>'+t.r+'</b></div></div>'+table(['Item','Drop-offs','Returning','Net'],(rows||[]).map(function(r){return{Item:r.item,'Drop-offs':r.departing,Returning:r.returning,Net:r.departing-r.returning}}))+'</section>'}function nonPack(stops,title){var rows=itemRows(stops).map(function(r){return{Item:r.item,'Drop-offs':r.dropoff,Returns:r.pickup,'Net Needed':r.net}});return'<section class=card><h2>'+esc(title)+'</h2>'+table(['Item','Drop-offs','Returns','Net Needed'],rows)+'</section>'}function viewLoad(){return invBox(state.inventory,'Printed Inventory')+nonPack(ordered(),'Calculated Non-Pack / Load')}function viewDrive(){var os=ordered(),s=os[state.driveIndex]||os[0];if(!s)return'<section class=card>No stop</section>';return'<section class=card><h2>Drive '+(state.driveIndex+1)+' / '+os.length+'</h2><h3>'+esc(s.name)+'</h3><p>'+esc(s.address)+'</p>'+s.items.map(function(i){return'<div class=card><b>'+i.dir+' '+i.qty+' '+esc(i.item)+'</b></div>'}).join('')+'<div class=row><button class=btn data-act=back>Back</button><button class="btn pri" data-act=next>Next</button></div></section>'}function viewLedger(){return'<section class=card><h2>Ledger</h2>'+(!state.ledger.length?'<p>No finished jobs.</p>':state.ledger.map(function(l){return'<div class=card>'+esc(l.name)+' '+esc(l.archivedAt)+'</div>'}).join(''))+'</section>'}
function viewOCR(){return'<section class=card><h2>OCR Lab</h2><input id=ocrFiles type=file class=hidden accept="image/*" multiple><div class=row><button class="btn pri" data-act=chooseocr>Choose Photos</button><button class="btn ok" data-act=runocr>Run Strip OCR</button><button class=btn data-act=parseocr>Parse Text</button><button class=btn data-act=invtest>Test Inventory</button><button class=btn data-act=stoptest>Test Stops</button><button class="btn ok" data-act=importreplace>Import Replace</button><button class="btn pri" data-act=importappend>Import Append</button></div><p>'+esc(ocr.files.length+' photo(s). '+ocr.status)+'</p><div class=barwrap><div class=bar style="width:'+ocr.progress+'%"></div></div></section><section class=grid2><div class=card><h3>OCR Text</h3><textarea id=ocrText class="input mono">'+esc(ocr.text)+'</textarea></div><div class=card><h3>Parsed JSON</h3><textarea class="input mono" readonly>'+esc(JSON.stringify(ocr.parsed,null,2))+'</textarea></div></section>'+invBox(ocr.parsed.inventory_summary,'OCR Inventory Preview')+nonPack(ocr.parsed.stops,'OCR Stops Non-Pack Preview')}
function prep(t){return String(t||'').replace(/\r/g,'\n').replace(/(Coral\s+Sands\s*\d+|Amelia\s+South\s+[A-Z0-9]+|Beach\s*Club\s*#?\s*\d+|\d{3,5}\s+S\.?\s*Fletcher[^\n]*)/gi,'\n$1').replace(/(Pickup\s*&?\s*Load|Unload\s*&?\s*Delivery|Customers?\s+Departing|Departing\s+Returning|Gear\/Item\s+Departing\s+Returning)/gi,'\n$1\n')}function lines(t){return prep(t).split('\n').map(clean).filter(Boolean)}function isHead(l){return /coral\s+sands|amelia\s+south|beach\s*club|s\.?\s*fletcher/i.test(l)&&!/(unload|pickup|departing|returning)/i.test(l)}function isInvHeader(l){return /customers?\s+departing|departing\s+returning|gear\/item/i.test(l)}function hits(line){var n=nt(line),hs=[];GEAR.slice().sort(function(a,b){return b.length-a.length}).forEach(function(g){var gn=nt(g),i=n.indexOf(gn);if(i>=0)hs.push({g:g,i:i,l:gn.length})});hs.sort(function(a,b){return a.i-b.i||b.l-a.l});var out=[];hs.forEach(function(h){if(!out.some(function(k){return h.i<k.i+k.l&&k.i<h.i+h.l}))out.push(h)});return out}function tok(x){if(!x)return 0;if(/[ilI|]/.test(x))return 1;if(/[oO]/.test(x))return 0;return num(x,0)}function invLine(line){var h=hits(line),n=nt(line),rows=[];h.forEach(function(x,i){var next=h[i+1]?h[i+1].i:n.length,seg=n.slice(x.i+x.l,next),m=seg.match(/(?:^|\s)(\d{1,3}|[ilI|oO])(?:\s+|$)(\d{1,3}|[ilI|oO])?/);if(m)rows.push({item:x.g,departing:tok(m[1]),returning:tok(m[2])})});return rows}function delItem(line,mode){var h=hits(line)[0];if(!h)return null;var before=line.slice(0,Math.max(0,nt(line).indexOf(nt(h.g)))),m=before.match(/\b(\d{1,2})\b/);return{dir:mode,item:h.g,qty:m?Number(m[1]):1}}function parseText(text){var ls=lines(text),inv=[],stops=[],cur=null,mode='dropoff',invMode=false;function push(){if(cur&&(cur.name||cur.items.length))stops.push(cur)}ls.forEach(function(l){if(isInvHeader(l)){invMode=true;return}var iv=invLine(l);if(invMode&&iv.length){iv.forEach(function(r){inv.push(r)});return}if(isHead(l)){push();cur={name:l,address:l,items:[],notes:'',tasks:['Arrive','Veri async function crops(file){var img=await new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){res(im)};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)}),max=1900,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale),base=document.createElement('canvas');base.width=w;base.height=h;base.getContext('2d').drawImage(img,0,0,w,h);var arr=[base],bands=4;for(var b=0;b<bands;b++){var c=document.createElement('canvas'),y=Math.floor(h*b/bands),hh=Math.floor(h/bands)+40;c.width=w;c.height=Math.min(h-y,hh);c.getContext('2d').drawImage(base,0,y,w,c.height,0,0,w,c.height);arr.push(c)}return arr}async function runOCR(){if(!ocr.files.length){toast('Choose photos first');return}if(!window.Tesseract){toast('Tesseract still loading');return}var texts=[];for(var i=0;i<ocr.files.length;i++){var cs=await crops(ocr.files[i]);for(var j=0;j<cs.length;j++){ocr.progress=Math.round(((i+j/cs.length)/ocr.files.length)*90);ocr.status='OCR page '+(i+1)+' crop '+(j+1)+'/'+cs.length;render();var out=await Tesseract.recognize(cs[j],'eng');texts.push(out.data.text||'')}}ocr.text=texts.join('\n\n');ocr.parsed=parseText(ocr.text);ocr.status='Parsed '+ocr.parsed.stops.length+' stops and '+ocr.parsed.inventory_summary.length+' inventory rows';ocr.progress=100;render()}function importOCR(mode){var p=ocr.parsed;if(mode==='replace'){state.stops=p.stops.map(normStop);state.inventory=mergeInv(p.inventory_summary)}else{state.stops=state.stops.concat(p.stops.map(normStop));state.inventory=mergeInv(state.inventory.concat(p.inventory_summary))}buildRoute();toast('Imported OCR and propagated route')}
