<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYTHOS — Corpus 02</title><style>body{margin:0;background:#080b10;color:#e9eef5;font:15px/1.6 system-ui;padding:28px}main{max-width:1100px;margin:auto}a{color:#79ccd4}.k{color:#d4ad68;text-transform:uppercase;letter-spacing:.14em;font-size:11px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:#10161e;border:1px solid #293440;border-radius:12px;padding:16px}.meta{color:#93a0b0;font-size:11px}input{width:100%;box-sizing:border-box;padding:12px;margin:16px 0;background:#090d12;color:white;border:1px solid #293440;border-radius:8px}.tag{display:inline-block;border:1px solid #293440;border-radius:99px;padding:2px 8px;font-size:11px;color:#a9d8dd}</style><main><div class="k">Cosmic Industries · MYTHOS</div><h1>Corpus Pack 02</h1><p>Fresh evidence-first records: deep time, underrepresented regions, environmental adaptation, trade, medicine, authentication and cross-cultural methodology.</p><a href="./">← Virtual Library</a><input id="q" placeholder="Search Corpus 02…"><div id="count"></div><section id="grid" class="grid"></section></main><script src="../corpus-pack-02.js"></script><script>const p=window.MYTHOS_PACK_02||{};const a=[...(p.entries||[]),...(p.deepTime||[]).map(x=>({...x,era:'Deep time'})),...(p.technologies||[]).map(x=>({...x,era:'Technology'})),...(p.tricksters||[]).map(x=>({...x,era:x.era||'Present'})),...(p.correlations||[]).map(x=>({id:x.id,title:x.pattern,status:x.relation,confidence:x.strength/100,era:'Cross-correlation',summary:x.analysis,sources:x.sources}))];const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function draw(){let q=document.getElementById('q').value.toLowerCase(),b=a.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('count').textContent=b.length+' records';document.getElementById('grid').innerHTML=b.map(x=>'<article class="card"><div class="meta">'+esc(x.id)+' · '+esc(x.era||'')+'</div><h2>'+esc(x.title)+'</h2><span class="tag">'+esc(x.status)+'</span><p>'+esc(x.summary||x.analysis||'')+'</p><div class="meta">confidence '+Math.round((x.confidence||0)*100)+'%</div></article>').join('')}document.getElementById('q').oninput=draw;draw();</script></html>
