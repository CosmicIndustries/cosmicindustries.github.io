<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYTHOS — Corpus 03</title><style>body{font:15px system-ui;background:#080b10;color:#e8edf3;margin:0;padding:28px;max-width:1100px}h1{font:32px Georgia}p{color:#9aa6b5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:#101721;border:1px solid #293442;border-radius:12px;padding:15px}.tag{display:inline-block;padding:3px 7px;border:1px solid #334150;border-radius:99px;font-size:11px}.ok{color:#70c98d}.no{color:#e07070}.unk{color:#a88be8}a{color:#7bd0d8}button{background:#111a24;color:#e8edf3;border:1px solid #334150;padding:8px;border-radius:8px;cursor:pointer}</style><h1>MYTHOS — Corpus Pack 03</h1><p>Evidence-first expansion: deep time, underrepresented archaeology, environmental archives, disease, experimental technology and methodological audits. Human-readable summaries remain separate from associative indexing.</p><p><a href="../">← Atlas</a> · <a href="./">Virtual Library</a></p><div id="count"></div><div class="grid" id="grid"></div><script src="../corpus-pack-03a.js"></script><script src="../corpus-pack-03b.js"></script><script src="../corpus-pack-03c.js"></script><script>const packs=[window.MYTHOS_PACK_03A||{},window.MYTHOS_PACK_03B||{},window.MYTHOS_PACK_03C||{}];const rows=[];for(const p of packs){for(const k of ["entries","deepTime","technologies","tricksters","correlations"]){for(const x of (p[k]||[]))rows.push({...x,kind:k})}}function col(s){return s==="Corroborated"?"ok":s==="Contradicted"?"no":"unk"}document.getElementById("count").textContent=rows.length+" indexed records in Corpus 03";document.getElementById("grid").innerHTML=rows.map(x=>`<article class="card"><span class="tag ${col(x.status)}">${x.status||x.relation||x.kind}</span><h3>${x.title||x.pattern}</h3><p>${x.summary||x.evidence||x.analysis||""}</p><small>${x.id||""}</small></article>`).join("");</script>
