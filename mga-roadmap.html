<title>MGA Aviation Funding &amp; Five-Year Roadmap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg:#EEF2F7; --surface:#FFFFFF; --surface-2:#F4F7FB; --border:#D1DCE9;
  --fg:#111827; --fg-2:#4B5563; --fg-3:#9CA3AF;
  --accent:#1B5FD8; --accent-2:#DBEAFE;
  --green:#15803D; --green-bg:#DCFCE7;
  --amber:#B45309; --amber-bg:#FEF3C7;
  --red:#B91C1C; --red-bg:#FEE2E2;
  --purple:#7C3AED; --purple-bg:#EDE9FE;
  --sky:#0369A1; --sky-bg:#E0F2FE;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#07101E; --surface:#0F1C2E; --surface-2:#162234; --border:#1E3150;
    --fg:#E2E8F0; --fg-2:#94A3B8; --fg-3:#475569;
    --accent:#60A5FA; --accent-2:#1E3A6E;
    --green:#4ADE80; --green-bg:#14532D;
    --amber:#FCD34D; --amber-bg:#451A03;
    --red:#F87171; --red-bg:#450A0A;
    --purple:#C4B5FD; --purple-bg:#2E1065;
    --sky:#38BDF8; --sky-bg:#0C4A6E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#07101E; --surface:#0F1C2E; --surface-2:#162234; --border:#1E3150;
  --fg:#E2E8F0; --fg-2:#94A3B8; --fg-3:#475569;
  --accent:#60A5FA; --accent-2:#1E3A6E;
  --green:#4ADE80; --green-bg:#14532D;
  --amber:#FCD34D; --amber-bg:#451A03;
  --red:#F87171; --red-bg:#450A0A;
  --purple:#C4B5FD; --purple-bg:#2E1065;
  --sky:#38BDF8; --sky-bg:#0C4A6E;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  padding-block: 0 2.5rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}

/* ── STICKY HEADER ─────────────────────────────── */
.page-header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  background: var(--accent);
  color: #fff;
  padding: 0.85rem max(16px, env(safe-area-inset-left, 0px));
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}
.header-title { font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; }
.header-sub { font-size: 0.75rem; opacity: 0.8; margin-top: 1px; }
.header-total { text-align: right; }
.header-total-num {
  font-size: 1.35rem; font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
}
.header-total-label { font-size: 0.7rem; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.06em; }
.header-gh-link { display:inline-block; margin-top:4px; font-size:0.68rem; color:rgba(255,255,255,0.82); text-decoration:none; border:1px solid rgba(255,255,255,0.28); border-radius:4px; padding:1px 7px; letter-spacing:0.02em; }
.header-gh-link:hover { background:rgba(255,255,255,0.12); color:#fff; }

/* ── LAYOUT ────────────────────────────────────── */
.main { max-width: 960px; margin: 0 auto; padding-top: 1.75rem; }
section { margin-bottom: 2.25rem; }
.section-title {
  font-size: 0.7rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--fg-3);
  margin-bottom: 0.85rem;
}

/* ── CAREER PATH ───────────────────────────────── */
.career-path {
  display: flex; flex-wrap: wrap; gap: 0; align-items: center;
}
.cp-pill {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 999px;
  padding: 0.4rem 0.85rem;
  font-size: 0.78rem; font-weight: 600;
  color: var(--fg);
  white-space: nowrap;
  position: relative;
  z-index: 1;
}
.cp-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.cp-arrow {
  font-size: 0.85rem; color: var(--fg-3);
  padding: 0 0.25rem;
}
.cp-pill.drone { background: var(--purple-bg); border-color: var(--purple); color: var(--purple); }

/* ── STAT CARDS ────────────────────────────────── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 0.875rem;
}
.stat-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 1rem 1.1rem;
}
.stat-label { font-size: 0.7rem; font-weight: 600; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.35rem; }
.stat-value { font-size: 1.5rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: var(--fg); }
.stat-note { font-size: 0.72rem; color: var(--fg-2); margin-top: 0.25rem; }

/* ── LEG CARDS ─────────────────────────────────── */
.legs-grid { display: flex; flex-direction: column; gap: 1rem; }
.leg-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.leg-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 0.75rem; flex-wrap: wrap;
  padding: 1rem 1.15rem 0.75rem;
}
.leg-num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent-2); color: var(--accent);
  font-size: 0.78rem; font-weight: 800;
  flex-shrink: 0; margin-top: 2px;
}
.leg-num.drone { background: var(--purple-bg); color: var(--purple); }
.leg-title-block { flex: 1; min-width: 0; }
.leg-title { font-size: 1rem; font-weight: 700; }
.leg-course { font-size: 0.75rem; color: var(--fg-3); margin-top: 2px; }
.leg-cost {
  text-align: right; flex-shrink: 0;
}
.leg-cost-main { font-size: 1.15rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: var(--fg); }
.leg-cost-sub { font-size: 0.7rem; color: var(--fg-3); }

/* progress bar */
.leg-progress-wrap { padding: 0 1.15rem 0.5rem; }
.leg-progress-label {
  display: flex; justify-content: space-between;
  font-size: 0.68rem; color: var(--fg-3);
  margin-bottom: 0.3rem;
}
.progress-bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.3s; }

/* cost rows */
.leg-rows { padding: 0 1.15rem; }
.leg-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.38rem 0;
  border-top: 1px solid var(--border);
  font-size: 0.8rem; gap: 0.5rem;
}
.leg-row-label { color: var(--fg-2); min-width: 0; }
.leg-row-val { font-family: 'JetBrains Mono', monospace; font-weight: 600; white-space: nowrap; }

/* scholarship chips */
.leg-schips { padding: 0.75rem 1.15rem; display: flex; flex-wrap: wrap; gap: 0.45rem; }
.schip {
  display: inline-flex; align-items: center; gap: 0.35rem;
  border-radius: 999px; padding: 0.28rem 0.65rem;
  font-size: 0.7rem; font-weight: 600;
  border: 1.5px solid;
}
.schip.green { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.schip.amber { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }
.schip.red   { background: var(--red-bg);   border-color: var(--red);   color: var(--red); }
.schip.purple { background: var(--purple-bg); border-color: var(--purple); color: var(--purple); }
.schip.sky   { background: var(--sky-bg);   border-color: var(--sky);   color: var(--sky); }
.schip.neutral { background: var(--surface-2); border-color: var(--border); color: var(--fg-2); }
.schip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.schip.green  .schip-dot { background: var(--green); }
.schip.amber  .schip-dot { background: var(--amber); }
.schip.red    .schip-dot { background: var(--red); }
.schip.purple .schip-dot { background: var(--purple); }
.schip.sky    .schip-dot { background: var(--sky); }
.schip.neutral .schip-dot { background: var(--fg-3); }

/* ── ACADEMIC TABLE ────────────────────────────── */
.tbl-wrap { overflow-x: auto; border-radius: 12px; border: 1.5px solid var(--border); }
table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 0.82rem; }
thead { background: var(--surface-2); }
th { padding: 0.65rem 0.9rem; text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-3); white-space: nowrap; }
td { padding: 0.6rem 0.9rem; border-top: 1px solid var(--border); color: var(--fg-2); vertical-align: middle; }
td.mono { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--fg); }
tr:last-child td { font-weight: 700; color: var(--fg); background: var(--surface-2); }
.badge-credit {
  display: inline-block; background: var(--accent-2); color: var(--accent);
  border-radius: 4px; padding: 0.15rem 0.45rem; font-size: 0.68rem; font-weight: 700;
}

/* ── FUNDING GRID ──────────────────────────────── */
.fund-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 0.875rem;
}
.fund-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 0.95rem 1.05rem;
}
.fund-card.urgent { border-color: var(--red); }
.fund-card.soon   { border-color: var(--amber); }
.fund-card.open   { border-color: var(--green); }
.fund-name { font-size: 0.88rem; font-weight: 700; margin-bottom: 0.3rem; }
.fund-amount {
  font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; font-weight: 700;
  margin-bottom: 0.3rem;
}
.fund-amount.green { color: var(--green); }
.fund-amount.amber { color: var(--amber); }
.fund-amount.purple { color: var(--purple); }
.fund-amount.sky   { color: var(--sky); }
.fund-deadline {
  font-size: 0.72rem; font-weight: 600;
  display: inline-flex; align-items: center; gap: 0.3rem;
  border-radius: 999px; padding: 0.22rem 0.6rem;
  margin-bottom: 0.45rem;
}
.fund-deadline.red    { background: var(--red-bg);   color: var(--red); }
.fund-deadline.amber  { background: var(--amber-bg); color: var(--amber); }
.fund-deadline.green  { background: var(--green-bg); color: var(--green); }
.fund-deadline.neutral { background: var(--surface-2); color: var(--fg-3); }
.fund-notes { font-size: 0.74rem; color: var(--fg-2); line-height: 1.45; }
.fund-apply {
  display: inline-flex; align-items: center; gap: 0.3rem;
  margin-top: 0.6rem;
  padding: 0.28rem 0.75rem;
  border-radius: 999px;
  font-size: 0.7rem; font-weight: 700;
  background: var(--accent-2); color: var(--accent);
  text-decoration: none;
  border: 1.5px solid var(--accent);
  transition: background 0.15s, color 0.15s;
}
.fund-apply:hover { background: var(--accent); color: #fff; }

/* ── PAYOFF STACK ──────────────────────────────── */
.payoff-wrap { overflow-x: auto; border-radius: 12px; border: 1.5px solid var(--border); }
.payoff-tbl { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 0.82rem; }
.payoff-tbl th { padding: 0.6rem 1rem; text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-3); background: var(--surface-2); white-space: nowrap; }
.payoff-tbl td { padding: 0.55rem 1rem; border-top: 1px solid var(--border); vertical-align: middle; }
.payoff-tbl td.src { color: var(--fg-2); }
.payoff-tbl td.ded { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--green); text-align: right; white-space: nowrap; }
.payoff-tbl td.bal { font-family: 'JetBrains Mono', monospace; font-weight: 700; text-align: right; white-space: nowrap; }
.payoff-tbl tr.row-start td { background: var(--surface-2); font-weight: 700; }
.payoff-tbl tr.row-gap td { background: var(--red-bg); }
.payoff-tbl tr.row-zero td { background: var(--green-bg); font-weight: 800; }
.pbadge {
  display: inline-block; border-radius: 4px; padding: 0.1rem 0.38rem;
  font-size: 0.64rem; font-weight: 700; margin-left: 0.35rem; vertical-align: middle;
}
.pbadge.urgent { background: var(--red-bg); color: var(--red); }
.pbadge.soon { background: var(--amber-bg); color: var(--amber); }
.pbadge.ok { background: var(--green-bg); color: var(--green); }

/* ── ACTION ITEMS ──────────────────────────────── */
.action-list { display: flex; flex-direction: column; gap: 0.65rem; }
.action-item {
  display: flex; gap: 0.85rem; align-items: flex-start;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 0.85rem 1rem;
}
.action-item.urgent { border-color: var(--red); }
.action-item.soon   { border-color: var(--amber); }
.action-num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  font-size: 0.72rem; font-weight: 800;
  flex-shrink: 0; margin-top: 1px;
}
.action-item.urgent .action-num { background: var(--red-bg); color: var(--red); }
.action-item.soon   .action-num { background: var(--amber-bg); color: var(--amber); }
.action-item:not(.urgent):not(.soon) .action-num { background: var(--accent-2); color: var(--accent); }
.action-body { flex: 1; min-width: 0; }
.action-title { font-size: 0.88rem; font-weight: 700; }
.action-detail { font-size: 0.76rem; color: var(--fg-2); margin-top: 0.2rem; line-height: 1.45; }

/* ── PROFILE BUILDER ──────────────────────────── */
.profile-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
}
.profile-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 1.1rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}
.profile-card-title {
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--accent);
  margin-bottom: 0.25rem;
}
.pf-label {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--fg-2);
}
.pf-input, .pf-textarea {
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  border-radius: 7px;
  padding: 0.35rem 0.55rem;
  font-size: 0.8rem;
  color: var(--fg);
  font-family: inherit;
  width: 100%;
  transition: border-color 0.15s;
}
.pf-input:focus, .pf-textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.pf-textarea { resize: vertical; min-height: 4rem; }
.pf-essay { min-height: 8rem; }
.profile-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 1rem;
}
.pf-btn {
  padding: 0.45rem 1rem;
  border-radius: 999px;
  border: none;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s;
  font-family: inherit;
}
.pf-btn:hover { opacity: 0.85; }
.pf-save { background: var(--green); color: #fff; }
.pf-copy { background: var(--accent-2); color: var(--accent); border: 1.5px solid var(--accent); }
.pf-export { background: var(--accent); color: #fff; }
.gist-sync-card { background: var(--surface); border: 1.5px solid var(--accent); border-radius: 14px; padding: 1.1rem 1rem; margin-top: 1rem; }
.gist-sync-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent); margin-bottom: 0.6rem; }
.gist-sync-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: flex-end; margin-bottom: 0.5rem; }
.gist-sync-row label { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.72rem; font-weight: 600; color: var(--fg-2); flex: 1; min-width: 200px; }
.gist-sync-row input { background: var(--surface-2); border: 1.5px solid var(--border); border-radius: 7px; padding: 0.35rem 0.55rem; font-size: 0.8rem; color: var(--fg); font-family: monospace; width: 100%; transition: border-color 0.15s; }
.gist-sync-row input:focus { outline: none; border-color: var(--accent); }
.gist-sync-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.4rem; }
.gist-status { font-size: 0.78rem; min-height: 1.2em; margin-top: 0.4rem; }
.gist-status--ok   { color: var(--green); }
.gist-status--warn { color: #f59e0b; }
.gist-status--info { color: var(--accent); }
.gist-note { font-size: 0.7rem; color: var(--fg-2); margin-top: 0.5rem; line-height: 1.5; }

/* ── AIRCRAFT RATES ───────────────────────────── */
.rate-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 0.75rem;
}
.rate-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 0.8rem 0.95rem;
  display: flex; align-items: center; gap: 0.75rem;
}
.rate-icon { font-size: 1.4rem; flex-shrink: 0; }
.rate-ac { font-size: 0.8rem; font-weight: 700; }
.rate-hr { font-family: 'JetBrains Mono', monospace; font-size: 0.88rem; font-weight: 700; color: var(--accent); }
.rate-note { font-size: 0.68rem; color: var(--fg-3); }

/* ── UTIL ──────────────────────────────────────── */
.divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; }
@media (max-width: 480px) {
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .fund-grid { grid-template-columns: 1fr; }
  .rate-grid { grid-template-columns: 1fr 1fr; }
}

/* ── NOV 2026 ROADMAP ADDITIONS ─────────────────── */
.fund-card a, .fund-notes a { color:var(--accent); text-decoration:underline; text-underline-offset:2px; }
.fund-card a:hover, .fund-notes a:hover { opacity:.8; }
.fund-card .fund-apply { text-decoration:none; }
#sources .fund-notes { line-height:1.7; }
#funding-ledger td { vertical-align:top; }
#five-year td, #program-cost td { vertical-align:top; }
#timeline .action-item { scroll-margin-top:5rem; }
@media (max-width:560px) {
  .header-total { text-align:left; }
  .stat-grid { grid-template-columns:1fr 1fr; }
  .stat-value { font-size:1.2rem; }
  .leg-header { gap:.5rem; }
}

<div class="roadmap-group" id="fiveyear-group">
    <div class="roadmap-group-heading"><span>04 · LONG-RANGE FINANCIAL PLAN</span><h2>Five-year living and aircraft coverage</h2><p>Household support and aircraft ownership are separate financial problems, each with its own cost and funding evidence.</p></div>
    <section id="five-year">
    <div class="section-title">2027–2031 financial runway</div>
    <p class="fund-notes" style="margin-bottom:.85rem;">Five-year coverage is larger than the $14,482 Spring program gap. Model education, living support, employment transition and aircraft ownership in separate ledgers. The scenarios below are planning sensitivities, not a claim that your actual monthly need is known.</p>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Monthly living requirement</th><th>Annual requirement</th><th>Five-year requirement</th><th>Use</th></tr></thead>
        <tbody>
          <tr><td class="mono">$1,000</td><td class="mono">$12,000</td><td class="mono">$60,000</td><td>Low-cost scenario</td></tr>
          <tr><td class="mono">$1,500</td><td class="mono">$18,000</td><td class="mono">$90,000</td><td>Middle planning scenario</td></tr>
          <tr><td class="mono">$2,000</td><td class="mono">$24,000</td><td class="mono">$120,000</td><td>Higher-cost scenario</td></tr>
        </tbody>
      </table>
    </div>
    <div class="fund-grid" style="margin-top:1rem;">
      <div class="fund-card">
        <div class="fund-name">SSI / SSDI eligibility review</div>
        <div class="fund-notes">SSI depends on qualifying disability and limited income/resources. SSDI depends on qualifying disability and sufficient work credits. Having a diagnosis or currently having no income does not itself establish eligibility. Screen the work-credit history and SSA medical criteria before counting either program.</div>
        <a class="fund-apply" href="https://www.ssa.gov/ssi/text-eligibility-ussi.htm" target="_blank" rel="noopener">SSI eligibility ↗</a>
        <a class="fund-apply" href="https://www.ssa.gov/disability/eligibility" target="_blank" rel="noopener">SSDI eligibility ↗</a>
      </div>
      <div class="fund-card">
        <div class="fund-name">SNAP / Medicaid / Georgia Gateway</div>
        <div class="fund-notes">Use the state's central Gateway application to screen household eligibility for food assistance and applicable medical coverage. These programs reduce living costs; they do not pay flight-school or aircraft bills.</div>
        <a class="fund-apply" href="https://gateway.ga.gov/" target="_blank" rel="noopener">Georgia Gateway ↗</a>
        <a class="fund-apply" href="https://medicaid.georgia.gov/how-apply/basic-eligibility" target="_blank" rel="noopener">Medicaid requirements ↗</a>
      </div>
      <div class="fund-card">
        <div class="fund-name">LIHEAP utility assistance</div>
        <div class="fund-notes">Seasonal energy-bill support for eligible low-income households. The opening schedule differs for older/medically homebound applicants and the general population. Benefit amount and utility eligibility are determined by the program.</div>
        <a class="fund-apply" href="https://dfcs.georgia.gov/services/low-income-home-energy-assistance-program-liheap" target="_blank" rel="noopener">Georgia LIHEAP ↗</a>
      </div>
    </div>
  </section>
    <section id="aircraft">
    <div class="section-title">Aircraft acquisition and five-year ownership — separate capital plan</div>
    <div class="leg-card">
      <div class="leg-header">
        <div class="leg-title-block"><div class="leg-title">No aircraft purchase is counted as funded</div><div class="leg-course">No verified scholarship or grant located that guarantees personal aircraft acquisition plus five years of insurance, maintenance and operating costs.</div></div>
        <div class="leg-cost"><div class="leg-cost-main">TBD</div><div class="leg-cost-sub">sponsor / donation / shared use</div></div>
      </div>
      <div class="tbl-wrap" style="margin:0 1rem 1rem;">
        <table>
          <thead><tr><th>Ownership cost bucket</th><th>Five-year planning status</th><th>Required evidence before commitment</th></tr></thead>
          <tbody>
            <tr><td>Aircraft acquisition</td><td class="mono">Unpriced</td><td>Specific aircraft, independent pre-buy, title/lien and logbook review.</td></tr>
            <tr><td>Pre-purchase inspection / initial repairs</td><td class="mono">Unpriced</td><td>A&amp;P/IA inspection and written discrepancy estimate.</td></tr>
            <tr><td>Insurance</td><td class="mono">Unquoted</td><td>Broker quote for named pilot, aircraft, hours and intended mission.</td></tr>
            <tr><td>Annual inspection / maintenance</td><td class="mono">Unquoted</td><td>Local shop estimate plus reserve for unscheduled repairs.</td></tr>
            <tr><td>Engine / propeller reserves</td><td class="mono">Unpriced</td><td>Aircraft-specific overhaul time, condition and component reserve plan.</td></tr>
            <tr><td>Fuel / oil / hourly operating</td><td class="mono">Unpriced</td><td>Annual utilization, POH fuel burn and current local prices.</td></tr>
            <tr><td>Hangar / tie-down / taxes / fees</td><td class="mono">Unquoted</td><td>Airport rates and applicable tax/registration fees.</td></tr>
            <tr><td>Commercial / agricultural liability</td><td class="mono">Unquoted</td><td>Specialist broker confirmation for the intended commercial operation.</td></tr>
          </tbody>
        </table>
      </div>
      <div class="leg-schips">
        <span class="schip amber"><span class="schip-dot"></span>Not included in scholarship gap</span>
        <span class="schip neutral"><span class="schip-dot"></span>No aircraft debt assumed</span>
      </div>
    </div>
    <div class="fund-grid" style="margin-top:1rem;">
      <div class="fund-card">
        <div class="fund-name">Preferred acquisition routes</div>
        <div class="fund-notes">Seek a direct aircraft donation, industry sponsor, grantmaker that explicitly permits capital acquisition, or shared-ownership/flying-club arrangement. Do not assume a Pell refund or flight scholarship can be redirected to private aircraft ownership; verify award rules and financial-aid cost-of-attendance restrictions first.</div>
      </div>
      <div class="fund-card">
        <div class="fund-name">Career-first alternative</div>
        <div class="fund-notes">Personal ownership need not precede entry into agricultural aviation. A realistic route may involve commercial training, tailwheel/ag-specific preparation, pesticide-applicator requirements and supervised ground/operations work with an established operator. Build flight time and a sponsor relationship before assuming aircraft acquisition costs.</div>
        <a class="fund-apply" href="https://www.agaviation.org/career/" target="_blank" rel="noopener">NAAA career pathway ↗</a>
      </div>
    </div>
  </section>

<script>
/* ── PROFILE FIELDS ─────────────────────────────── */
const PF_FIELDS = [
  'pf-name','pf-dob','pf-phone','pf-email','pf-addr','pf-citystatezip',
  'pf-citizen','pf-heritage','pf-school','pf-major','pf-enroll','pf-gpa',
  'pf-grad','pf-cost','pf-need','pf-need-stmt','pf-certs','pf-hours',
  'pf-career-goal','pf-target-certs','pf-exp','pf-dvr','pf-tribal',
  'pf-wioa','pf-obap','pf-aopa','pf-eaa','pf-ps','pf-career','pf-leadership'
];

function getVal(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
function setVal(id,v){ const el=document.getElementById(id); if(el) el.value=v||''; }

function saveProfile(){
  try{
    const data={};
    PF_FIELDS.forEach(id=>{ data[id]=getVal(id); });
    localStorage.setItem('mga_profile', JSON.stringify(data));
    showStatus('✅ Profile saved to browser storage.');
  } catch(e){ showStatus('⚠ Could not save: '+e.message); }
}

function loadProfile(){
  try{
    const raw=localStorage.getItem('mga_profile');
    if(!raw) return;
    const data=JSON.parse(raw);
    PF_FIELDS.forEach(id=>{ if(data[id]!==undefined) setVal(id,data[id]); });
  } catch(e){}
}

function buildText(mode){
  const n=getVal('pf-name')||'[Name]';
  const school=getVal('pf-school')||'MGA';
  const program=getVal('pf-major')||'Aviation';
  const gpa=getVal('pf-gpa')||'[GPA]';
  const goal=getVal('pf-career-goal')||'[Career Goal]';
  const hrs=getVal('pf-hours')||'0';
  const certs=getVal('pf-certs')||'Student Pilot';
  const need=getVal('pf-need-stmt')||'[Financial need statement]';
  const ps=getVal('pf-ps')||'[Personal statement]';
  const career=getVal('pf-career')||'[Career goals essay]';
  const tribal=getVal('pf-tribal')||'[Tribal status]';
  const dvr=getVal('pf-dvr')||'[DVR status]';
  const heritage=getVal('pf-heritage')||'[Heritage]';
  const addr=getVal('pf-addr'); const csz=getVal('pf-citystatezip');
  const phone=getVal('pf-phone'); const email=getVal('pf-email');
  const enroll=getVal('pf-enroll')||'Full-time';
  const grad=getVal('pf-grad')||'[Grad date]';
  const dob=getVal('pf-dob')||'[DOB]';
  const lead=getVal('pf-leadership')||'[Leadership essay]';

  const sep='─'.repeat(52);

  if(mode==='eaa'){
    return `EAA SCHOLARSHIP APPLICATION — ${n}\n${sep}\nApplicant: ${n}\nDOB: ${dob}\nPhone: ${phone}\nEmail: ${email}\nAddress: ${addr}, ${csz}\n\nSchool: ${school}\nProgram: ${program} | Enrollment: ${enroll}\nGPA: ${gpa} | Expected Graduation: ${grad}\n\nAviation Background:\nCertificates: ${certs} | Logged Hours: ${hrs}\n\nCareer Goal:\n${goal}\n\n${sep}\nPERSONAL STATEMENT:\n${sep}\n${ps}\n\n${sep}\nCAREER GOALS:\n${sep}\n${career}\n\n${sep}\nFINANCIAL NEED:\n${sep}\n${need}\n`;
  }
  if(mode==='aopa'){
    return `AOPA SCHOLARSHIP APPLICATION — ${n}\n${sep}\nApplicant: ${n} | DOB: ${dob}\nContact: ${phone} | ${email}\nAddress: ${addr}, ${csz}\n\nAcademic:\nSchool: ${school}\nMajor/Program: ${program}\nGPA: ${gpa} | Status: ${enroll} | Grad: ${grad}\n\nFlight Experience:\nCerts/Ratings: ${certs}\nTotal Hours: ${hrs}\n\nCareer Objective: ${goal}\n\n${sep}\nPERSONAL STATEMENT:\n${sep}\n${ps}\n\n${sep}\nFINANCIAL NEED:\n${sep}\n${need}\n`;
  }
  if(mode==='native'){
    return `NATIVE FORWARD SCHOLARSHIP APPLICATION PROFILE — ${n}\n${sep}\nApplicant: ${n} | DOB: ${dob}\nContact: ${phone} | ${email}\nAddress: ${addr}, ${csz}\n\nTribal/Descendancy Documentation: ${tribal}\nHeritage information (only if requested): ${heritage}\n\nAcademic:\nSchool: ${school}\nProgram: ${program}\nGPA: ${gpa} | Status: ${enroll} | Expected Graduation: ${grad}\n\nCareer Goal:\n${goal}\n\n${sep}\nPERSONAL STATEMENT:\n${sep}\n${ps}\n\n${sep}\nFINANCIAL NEED:\n${sep}\n${need}\n`;
  }

  // Full profile
  return `SCHOLARSHIP APPLICATION PROFILE — ${n}\nGenerated: ${new Date().toLocaleDateString()}\n${sep}\n\nPERSONAL\nName: ${n}\nDOB: ${dob}\nPhone: ${phone}\nEmail: ${email}\nAddress: ${addr}, ${csz}\nCitizenship: ${getVal('pf-citizen')}\nHeritage: ${heritage}\n\nACADEMIC\nSchool: ${school}\nProgram: ${program}\nEnrollment: ${enroll}\nGPA: ${gpa}\nGraduation: ${grad}\nProgram Cost: ${getVal('pf-cost')}\nUnmet Need: ${getVal('pf-need')}\n\nAVIATION\nCertificates: ${certs}\nFlight Hours: ${hrs}\nCareer Goal: ${goal}\nTarget Certs: ${getVal('pf-target-certs')}\nExperience: ${getVal('pf-exp')}\n\nELIGIBILITY\nDVR/Disability: ${dvr}\nTribal Status: ${tribal}\nWIOA Status: ${getVal('pf-wioa')}\nOBAP Member Since: ${getVal('pf-obap')}\nAOPA Member #: ${getVal('pf-aopa')}\nEAA Member #: ${getVal('pf-eaa')}\n\n${sep}\nPERSONAL STATEMENT:\n${sep}\n${ps}\n\n${sep}\nCAREER GOALS:\n${sep}\n${career}\n\n${sep}\nLEADERSHIP / COMMUNITY:\n${sep}\n${lead}\n\n${sep}\nFINANCIAL NEED:\n${sep}\n${need}\n`;
}

function copyProfile(mode){
  const text=buildText(mode);
  navigator.clipboard.writeText(text)
    .then(()=>showStatus('✅ Copied to clipboard! Paste directly into the application portal.'))
    .catch(()=>{
      // fallback: select a temp textarea
      const ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); showStatus('✅ Copied (fallback).'); }
      catch(e){ showStatus('⚠ Copy failed — try selecting and copying the text manually.'); }
      document.body.removeChild(ta);
    });
}

function exportProfile(){
  const text=buildText('full');
  const name=getVal('pf-name').replace(/\s+/g,'_')||'applicant';
  const filename=`scholarship_profile_${name}_${new Date().toISOString().slice(0,10)}.txt`;
  try{
    const blob=new Blob([text],{type:'text/plain'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); document.body.removeChild(a); },1000);
    showStatus('📤 Download started: '+filename);
  } catch(e){
    copyProfile('full');
    showStatus('📋 Download unavailable here — copied to clipboard instead.');
  }
}

function showStatus(msg){
  const el=document.getElementById('pf-status');
  if(el){ el.textContent=msg; setTimeout(()=>{ el.textContent=''; },5000); }
}

// ── GIST SYNC ──────────────────────────────────────────────────────────────
// PAT and Gist ID live only in localStorage — never in the synced data itself.
const GIST_FILENAME = 'mga_scholarship_profile.json';

function getGistPAT(){ try{ return localStorage.getItem('mga_gist_pat')||''; }catch(e){return '';} }
function getGistID(){  try{ return localStorage.getItem('mga_gist_id')||'';  }catch(e){return '';} }
function setGistID(id){ try{ localStorage.setItem('mga_gist_id',id); }catch(e){} }

function gistHeaders(pat){
  return {
    'Authorization': 'Bearer '+pat,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
    'Content-Type': 'application/json'
  };
}

async function syncToGist(){
  const pat = getGistPAT();
  if(!pat){ showSyncStatus('⚠ Enter your GitHub PAT first.','warn'); return; }
  const data={};
  PF_FIELDS.forEach(f=>{ data[f]=getVal(f); });
  const body = JSON.stringify({
    description: 'MGA Scholarship Application Profile (private)',
    public: false,
    files: { [GIST_FILENAME]: { content: JSON.stringify(data,null,2) } }
  });
  showSyncStatus('⏳ Syncing…','info');
  try{
    const gistId = getGistID();
    let url = 'https://api.github.com/gists';
    let method = 'POST';
    if(gistId){ url += '/'+gistId; method = 'PATCH'; }
    const r = await fetch(url,{ method, headers: gistHeaders(pat), body });
    if(!r.ok){ const t=await r.text(); throw new Error(r.status+': '+t.slice(0,120)); }
    const j = await r.json();
    setGistID(j.id);
    showSyncStatus('✅ Synced to Gist '+j.id.slice(0,8)+'… — open on any device with your PAT.','ok');
  } catch(e){
    showSyncStatus('❌ Sync failed: '+e.message,'warn');
  }
}

async function loadFromGist(){
  const pat = getGistPAT();
  if(!pat){ showSyncStatus('⚠ Enter your GitHub PAT first.','warn'); return; }
  const gistId = getGistID();
  if(!gistId){ showSyncStatus('⚠ No Gist ID saved yet — sync first from your other device.','warn'); return; }
  showSyncStatus('⏳ Loading from Gist…','info');
  try{
    const r = await fetch('https://api.github.com/gists/'+gistId,{ headers: gistHeaders(pat) });
    if(!r.ok){ const t=await r.text(); throw new Error(r.status+': '+t.slice(0,120)); }
    const j = await r.json();
    const file = j.files[GIST_FILENAME];
    if(!file){ throw new Error('Profile file not found in Gist.'); }
    const data = JSON.parse(file.content);
    PF_FIELDS.forEach(f=>setVal(f,data[f]||''));
    try{ localStorage.setItem('mga_profile',JSON.stringify(data)); }catch(e){}
    showSyncStatus('✅ Profile loaded from Gist. Updated: '+new Date(j.updated_at).toLocaleString(),'ok');
  } catch(e){
    showSyncStatus('❌ Load failed: '+e.message,'warn');
  }
}

function showSyncStatus(msg,type){
  const el=document.getElementById('gist-status');
  if(!el) return;
  el.textContent=msg;
  el.className='gist-status gist-status--'+(type||'info');
  if(type==='ok'||type==='warn') setTimeout(()=>{ el.textContent=''; el.className='gist-status'; },8000);
}

// Auto-save on input change
document.addEventListener('DOMContentLoaded',()=>{
  loadProfile();
  // Restore PAT field if saved
  try{
    const savedPAT = localStorage.getItem('mga_gist_pat')||'';
    const savedID  = localStorage.getItem('mga_gist_id')||'';
    const patEl = document.getElementById('gist-pat');
    const idEl  = document.getElementById('gist-id');
    if(patEl && savedPAT) patEl.value=savedPAT;
    if(idEl  && savedID)  idEl.value=savedID;
  }catch(e){}
  // Save PAT/ID on change
  const patEl=document.getElementById('gist-pat');
  const idEl =document.getElementById('gist-id');
  if(patEl) patEl.addEventListener('input',()=>{ try{ localStorage.setItem('mga_gist_pat',patEl.value.trim()); }catch(e){} });
  if(idEl)  idEl.addEventListener('input',()=>{ try{ localStorage.setItem('mga_gist_id',idEl.value.trim()); }catch(e){} });

  PF_FIELDS.forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.addEventListener('input',()=>{
      try{
        const data={};
        PF_FIELDS.forEach(f=>{ data[f]=getVal(f); });
        localStorage.setItem('mga_profile',JSON.stringify(data));
      } catch(e){}
    });
  });
});
</script>
